    AccountType:
      title: Account Type
      description: "The type of an account.\n  | Value | Description |\n  |-----|-----|\n  | CHECKING\
        \ | A deposit account held at a financial institution that allows withdrawals and deposits |\n\
        \  | COMMERCIALDEPOSIT | Deposit Account for Commercial Customers e.g. Business Trust Account\
        \ |"
      type: string
      enum:
      - CHECKING
      - COMMERCIALDEPOSIT
      - MONEYMARKET
    TreasuryManagementType:
      title: Treasury Management Type
      description: The source of Treasury Management account definition; one of BAI, BTRS, ISO, SWIFT
      type: string
      enum:
      - BAI
      - BTRS
      - ISO
      - SWIFT
    AccountPaymentNetworks:
      title: Account Payment Networks
      description: An array of payment networks supported by the account. If array contains `ACCOUNT_NUMBER`
        identifiers which are not masked this is sensitive data which should only be exchanged if encrypted.
        For detailed information on implementing encryption see the FDX CSDF API Security Model document's
        "Part 2 FDX Message Encryption" in the Security folder of the latest FDX Release download
      type: object
      properties:
        page:
          $ref: '#/components/schemas/PageMetadata'
          description: Offset IDs for navigating result sets. Pagination for `/accounts/{accountId}/payment-network`
            is deprecated in v6.5
          deprecated: true
        links:
          $ref: '#/components/schemas/PageMetadataLinks'
          description: Resource URLs for navigating result sets. Pagination for `/accounts/{accountId}/payment-network`
            is deprecated in v6.5
          deprecated: true
        paymentNetworks:
          type: array
          minItems: 0
          description: Array of payment networks
          items:
            $ref: '#/components/schemas/AccountPaymentNetwork'
    AccountPaymentNetwork:
      title: Payment Network Supported by Account
      description: This provides details required to execute a transaction against the account within
        the payment network
      type: object
      properties:
        bankId:
          type: string
          description: Bank identifier used by the payment network. Typically the 9-digit routing transit
            number (RTN) associated with the account number at a US institution, or the 3-digit Institution
            (FID) and 5-digit Transit numbers for Canadian institutions, including leading zeroes
        identifier:
          type: string
          description: The number used to identify the account within the payment network. If identifierType
            is ACCOUNT_NUMBER, this is the account number; if identifierType is TOKENIZED_ACCOUNT_NUMBER,
            this is a tokenized account number
        identifierType:
          $ref: '#/components/schemas/PaymentNetworkIdentifierType'
          description: Type of identifier, ACCOUNT_NUMBER or TOKENIZED_ACCOUNT_NUMBER
        type:
          $ref: '#/components/schemas/PaymentNetworkType'
          description: Type of Canadian or U.S. payment network, CA_ACSS, CA_LVTS, US_ACH, US_CHIPS, US_FEDWIRE,
            US_RTP
    PaymentNetworkIdentifierType:
      title: Payment Network Identifier Type
      description: Suggested values for Payment Initiation Identifier Type
      type: string
      enum:
      - ACCOUNT_NUMBER
      - TOKENIZED_ACCOUNT_NUMBER
    PaymentNetworkType:
      title: Payment Network Type
      description: "Suggested values for Payment Network Type.\n\n  | Value | Description |\n  |-----|-----|\n\
        \  | CA_ACSS | Automated Clearing House Settlement System |\n  | CA_LVTS | Large-Value Transfer\
        \ System |\n  | US_ACH | Automated Clearing House |\n  | US_CHIPS | Clearinghouse Interbank Payments\
        \ System |\n  | US_FEDNOW | Federal Reserve Instant Payment System |\n  | US_FEDWIRE | Fedwire\
        \ Funds Service |\n  | US_RTP | US Real Time Payments System |"
      type: string
      enum:
      - CA_ACSS
      - CA_LVTS
      - US_ACH
      - US_CHIPS
      - US_FEDNOW
      - US_FEDWIRE
      - US_RTP
    AccountContact:
      title: Account Contact entity
      description: Contact information for the account
      type: object
      properties:
        holders:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
          minItems: 0
          description: Owners of the account
    Address:
      title: Address
      description: U.S. domestic address or a foreign address with country other than 'US'
      type: object
      properties:
        line1:
          type: string
          maxLength: 64
          description: Address line 1
          example: 206 WIRT ST
        line2:
          type: string
          maxLength: 64
          description: Address line 2
          example: 111 MAIN ST APT 4B
        line3:
          type: string
          maxLength: 64
          description: Address line 3
        city:
          type: string
          maxLength: 64
          description: City
          example: WEIRTON
        region:
          type: string
          maxLength: 64
          description: State, Province, Territory, Canton or Prefecture. From [Universal Postal Union](https://www.upu.int/en/Postal-Solutions/Programmes-Services/Addressing-Solutions#addressing-s42-standard)
            as of 2-26-2020, [S42 International Address Standards](https://www.upu.int/UPU/media/upu/documents/PostCode/S42_International-Addressing-Standards.pdf).
            For U.S. addresses can be 2-character code from '#/components/schemas/StateCode'
          example: WV
        postalCode:
          type: string
          maxLength: 16
          description: Postal code
          example: '260620000'
        type:
          type: string
          description: Address type
          example: LEGAL
        country:
          allOf:
          - $ref: '#/components/schemas/Iso3166CountryCode'
          - type: string
            description: Country code
            example: US
    TelephoneNumber:
      title: Telephone Number
      description: Standard for international phone numbers
      type: object
      properties:
        number:
          type: string
          maxLength: 15
          pattern: \d+
          description: Telephone subscriber number defined by ITU-T recommendation E.164
          example: '1234567890'
    Customer:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            description: Array of the contact email addresses
            example: ''
          minItems: 0
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          minItems: 0
        telephones:
          type: array
          items:
            $ref: '#/components/schemas/TelephoneNumber'
          minItems: 0
        type:
          $ref: '#/components/schemas/BusinessOrConsumer'
          description: Type of entity. One of BUSINESS or CONSUMER
        businessCustomer:
          $ref: '#/components/schemas/BusinessCustomer'
    BusinessCustomer:
      title: Business Customer entity
      description: Customers that are commercial in nature are affiliated with a business entity
      type: object
      properties:
        name:
          type: string
          description: Name of business customer
          example: AKOMEAH TEXTILES
    DataCluster:
      title: Data Cluster
      description: Name of permissioned Data Cluster. For Data Cluster definitions refer to the Consent
        Components > Data Clusters section of the User Experience Guidelines document included in the
        FDX API. `ACCOUNT_PAYMENTS` is deprecated and replaced with `PAYMENT_SUPPORT` in FDX release V6.1.0,
        `ACCOUNT_PAYMENTS` will be removed with V7 release
      type: string
      enum:
      - ACCOUNT_BASIC
      - ACCOUNT_DETAILED
      - ACCOUNT_PAYMENTS
      - BALANCES
      - BILLS
      - CUSTOMER_CONTACT
      - CUSTOMER_PERSONAL
      - IMAGES
      - INVESTMENTS
      - NOTIFICATIONS
      - PAYMENT_SUPPORT
      - REWARDS
      - SCHEDULED_PAYMENTS
      - SOCIAL_SECURITY_NUMBER
      - STATEMENTS
      - TAX
      - TERMS_AND_CONDITIONS
      - TRANSACTIONS
      - TRANSFERS
    BusinessOrConsumer:
      title: Business or Consumer Type
      description: Indicator if parent entity is a consumer or business
      type: string
      x-fdx-csdf-account-categories:
      - ANY
      enum:
      - BUSINESS
      - CONSUMER
