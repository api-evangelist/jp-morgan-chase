              $ref: '#/components/examples/TransactionCheckConsentResponseUK'
    401-Unauthorized:
      description: "Unauthorized\n| Error Code      | Description                                    |\n| --------------  |------------------------------------------------|\n| 11404           | Authentication failure                         |\n| 11412           | User blocked by financial institution          |\n| 11415           | Maximum Limit Exceeded                         |\n| 12400           | Authentication flow cancelled                  |\n| 12401           | Authentication flow timeout                    |\n| 12402           | Session has expired or timeout                |  \n| 14000           | Security failure                               |"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            UnauthorizedError:
              $ref: '#/components/examples/Unauthorized'
x-jpmc-securityDefinitions:
  JPMC-OAuth2: {}
x-jpmc-security: {}
