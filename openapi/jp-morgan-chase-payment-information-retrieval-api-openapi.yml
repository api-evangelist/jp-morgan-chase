          $ref: '#/components/schemas/CreditorAccount'
        creditorName:
          type: string
          description: "**Credit Transfer Payments**\n\n  Mandatory for RTP Markets :- \n\n  | Market |\n  | ------ |\n  |  UK    |\n  |  SEPA  |\n  |  US    |\n\n\n  Mandatory for RTP markets for Pay to Account transactions :-\n\n  |  Market    |\n  | -----------|\n  |  Singapore |\n  |  Australia |\n  |  Mexico    |\n  |  Hong Kong |\n  |  Brazil    |\n\n\n  Mandatory For Alternate Payments :- \n\n  | Alternate Payments | Market        |\n  | -------------------| --------------|\n  | Push To Card       | US and Canada |\n  | Push To Wallet       | PayPal/Venmo |\n  | Interac       | Canada |\n  | Zelle       | US |\n\n\n  Mandatory for ACH Payments :-\n\n  |  Market    |\n  | -----------|\n  |  Chile |\n\n\n  Maximum length supported per instrument/market :-\n\n  | Payment Type | Market | Max Length |\n  | --- | --- | --- |\n  | RTP | UK | 40 |\n  | RTP | Singapore | 140 |\n  | RTP | Australia | 140 |\n  | RTP | Hong Kong | 140 |\n  | RTP | Indonesia | 140 |\n  | RTP | Mexico | 40 |\n  | Push To Card | US/Canada | 30 |\n  | ACH | Chile | 70 |\n  | SEPA Instant| SEPA Zone | 140 |\n\n**Direct Debit Payments**\n\n  Maximum length supported per instrument/market :-\n\n  | Payment Type | Market | Max Length |\n  | --- | --- | --- |\n  | RTP | Malaysia | 140 |"
        creditorDevice:
          $ref: '#/components/schemas/DeviceInfo'
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
        dateAndPlaceOfBirth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        countryOfResidence:
          $ref: '#/components/schemas/CountryOfResidence'
        ultimateCreditor:
          $ref: '#/components/schemas/UltimateCreditor'
        additionalCreditors:
