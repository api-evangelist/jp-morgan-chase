          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdditionalCreditor'
        partyIdentifiers:
          $ref: '#/components/schemas/PartyIdentifier'
    AccountTypeEnum:
      type: string
      enum:
      - VENMO
      - PAYPAL
      - INTERAC
      - CARD
      - DDA
      - LOAN
      - ODFT
      - NREX
      - OTHER
      - CACC
      - SVGS
      - TRAN
      - CLABE
      - VOSTRO
      - IBAN
      - BBAN
      - DFLT
      - SLRY
      - BDA
      - ZELLE
      description: "Mandatory for :\n  1. Card Payments\n  2. Venmo/PayPal wallets\n  3. Interac \n  4. India IMPS\n  6. Malaysia RTP (Credit Transfer &amp; Direct Debit)\n  8. Brazil RTP (Pay to account only)\n  9. Blockchain Payments (Kinexys Digital Payments)\n  10. Zelle \n  \n\nNot supported for United States RTP\n  \nIndia IMPS - \n\nLOAN - Loan account\nODFT - Overdraft\nNREX - NonResidentExternal\nOTHER - For Book and cross branch with VRN accounts\nCACC - Cash Credit/Current account\nDDA - DDA account\nSVGS - Savings account\n\nSEPA Instant - \nIBAN\n\nHong Kong RTP -\nBBAN\n\nMalaysia RTP - \nLOAN\nDFLT\nSVGS\nCACC\n\nBrazil RTP - \nCACC\nSLRY\nTRAN\nSVGS\n\nMexico RTP - \nCLABE\nVOSTRO\nDDA\n\nAlternate Payments - \n\nVENMO - Push to wallet\nPayPal - Push to wallet\nINTERAC - Interac canada payments\nCARD - Push to card payments\nZELLE - Zelle Payments\n\n\n\nBlockchain Payments (Kinexys Digital Payments) - \nDDA\nBDA - Blockchain Deposit Account\n\n\n\nACH - (Chile Only)\nSVGS \nCACC\nOTHER\nschemeName:\n  type: object\n  description: |-\n    Mandatory for pay by proxy -\n    RTP :- Singapore, Australia, Hong Kong, Malaysia, Brazil, Mexico\n    Alternate Payments :- Push To Wallet\n  properties:\n    proprietary:\n      type: string\n      enum:\n        - MSIDN\n        - NRIC\n        - UEN\n        - VPA\n        - EMAL\n        - ORGN\n        - TELI\n        - AUBN\n        - PSPT\n        - BREG\n        - MBNO\n        - ARMN\n        - MOBN\n        - SVID\n        - CPF\n        - CNPJ\n        - EVP\n        - QRCD\n        - ACCN\n        - ALIS\n      description: |-\n        Specifies the type of Proxy account. Mandatory if creditorAccount.alternateAccountIdentifier is present\n        Proprietary types applicable per market and instrument:\n\n        RTP - Singapore :-\n        MSIDN - Mobile number \n        UEN - Unique Entity Number\n        VPA - Virtual Payment Address\n        NRIC - IC number \n\n        RTP - Australia :-\n        EMAL - Email Address\n        TELI - Telephone Number\n        AUBN - Australia Business number\n        ORGN - Organization Id\n\n        RTP - Malaysia :-\n        MBNO - Mobile number\n        NRIC - IC number \n        PSPT - Passport number \n        ARMN - Army or Police Number \n        BREG - Business registration number\n\n        RTP - Hong Kong :-\n        EMAL - Email Address\n        MOBN - Mobile Number (or fixed-line number)\n        SVID - FPS Identifier\n\n        RTP - Brazil :-\n        CPF - Tax ID of Individual\n        CNPJ - Tax ID of Corporate\n        EVP - Random Key\n        QRCD - QR Code\n        EMAL - Email id \n        MOBN - Mobile number \n\n        RTP - Mexico :-\n        MOBN - Mobile number\n        BANK - Transfer to a Bank identifier \n        CARD - Transfer to a debit card number\n\n        RTP - Indonesia :-\n        MOBN - Mobile number\n        EMAL - Email id \n        CARD - Transfer to a debit card number   \n        ALIS - eMoney transfer\n\n        Alternate Payments - Wallet (For Zelle and Interac only EMAL and TELI are applicable) :-\n        EMAL - Email Address \n        TELI - Telephone Number\n        ACCN - Alternate account number\n        ALIS - Alias identification"
    UltimateCreditorIndividual:
      type: object
      title: Ultimate Creditor Individual
      description: ultimate creditor individual party details
      required:
      - individualId
      properties:
        individualId:
          $ref: '#/components/schemas/IndividualID'
        ultimateCreditorName:
          $ref: '#/components/schemas/UltimateCreditorName'
        dateAndPlaceOfBirth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        countryOfResidence:
          $ref: '#/components/schemas/CountryOfResidence'
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
    AdditionalParties:
      type: object
      title: Additional Parties
      description: Additional parties involved in the money movement.
      properties:
        initiatingParty:
          $ref: '#/components/schemas/InitiatingParty'
      minProperties: 1
      maxProperties: 1
    DebtorAgent:
      type: object
      description: ''
      properties:
        financialInstitutionId:
          $ref: '#/components/schemas/DebtorFinancialInstitutionId'
        additionalInstitutions:
          type: array
          description: Only applicable to UK Faster Payments. Instructing agent of the ultimate debtor.
          minItems: 0
          maxItems: 100
          items:
            $ref: '#/components/schemas/AdditionalInstitution'
      required:
      - financialInstitutionId
    DebtorDevice:
      type: object
      description: Applicable and mandatory for Malaysia Faster Payments
      properties:
        ipAddress:
          type: string
          minLength: 0
          maxLength: 128
    AccountType:
      type: string
      description: '- Mandatory for SEPA Instant - Use IBAN

        - Mandatory for Blockchain Payments (Kinexys Digital Payments)- DDA, BDA (Blockchain Deposit

        Account)

        - Field not applicable to Alternate Payments (Cards)'
      enum:
      - DDA
      - VAM
      - IBAN
      - BDA
      - CACC
      - SVGS
      - CARD
      - LIMITED_DDA
      - EMBEDDED_DDA
      - WALLET
    DebtorAccount:
      oneOf:
      - $ref: '#/components/schemas/DebtorAccountIdentification'
      - $ref: '#/components/schemas/DebtorAlternateAccountIdentification'
  responses:
    400-Query-BadRequest:
      description: "Bad Request\n  | Error Code |           Description                     |  \n  |----------- |-------------------------------------------|\n  | `GCA-095`  |endToEndId or firmRootId is required       | "
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/Errors'
          examples:
            PaymentDetailsAUResponse400:
              $ref: '#/components/examples/PaymentDetailsAUResponse400'
            PaymentStatusAUResponse400:
              $ref: '#/components/examples/PaymentStatusAUResponse400'
    200-Status-OK:
      description: "Response to the status inquiry\n\nList of Error codes and Rule definitions\n---\n\n  | Error Code        |           Rule Definition                           |  \n  |-------------------|-----------------------------------------------------|\n  | `10001`           | Mandatory field is missing or invalid               | \n  | `10002`           | Minimum length validation failure                   | \n  | `10003`           | Maximum length validation failure                   | \n  | `10004`           | Date validation failure                             |  \n  | `10005`           | Amount validation failure ~ value more than maximum |  \n  | `10006`           | Amount validation failure ~ value less than minimum |  \n  | `10007`           | Amount validation failure ~ value is not a number   |  \n  | `10008`           | Validation failure ~ unexpected value provided      |  \n  | `10009`           | Invalid Id provided                                 |  \n  | `10010`           | Personal information validation failure             |  \n  | `11000`           | Clearing/Regulatory failure                         |  \n  | `12000`           | System error                                        | \n  | `13000`           | Uncategorized error                                 |  \n\n`errorDescription` is dynamically generated, hence not shown here."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentStatus'
    503-Query-ServiceUnavailable:
      description: "Service Unavailable.\n  | Error Code |           Description                     |  \n  |----------- |-------------------------------------------|\n  | `GCA-030`  |API Processing Error                       | \n  | `GCA-099`  |System Unavailable                         |"
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/Errors'
          examples:
            SystemUnavailable:
              $ref: '#/components/examples/SystemUnavailableError'
    403-Query-Forbidden:
      description: "Forbidden. \n  | Error Code |           Description                     |  \n  |----------- |-------------------------------------------|\n  | `GCA-001`  |Client is not eligible for the API Service | \n  | `GCA-003`  |Client is not eligible for the API Service | "
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/Errors'
          examples:
            ClientIneligible:
              $ref: '#/components/examples/ClientIneligibleError'
    200-Details-OK:
      description: "Response to the details inquiry. In case a payment is rejected, the following errors can be expected.\n\nList of Error codes and Rule definitions. \n---\n\n  | Error Code        |           Description                               |  \n  |-------------------|-----------------------------------------------------|\n  | `10001`           | Mandatory field is missing or invalid               | \n  | `10002`           | Minimum length validation failure                   | \n  | `10003`           | Maximum length validation failure                   | \n  | `10004`           | Date validation failure                             |  \n  | `10005`           | Amount validation failure ~ value more than maximum |  \n  | `10006`           | Amount validation failure ~ value less than minimum |  \n  | `10007`           | Amount validation failure ~ value is not a number   |  \n  | `10008`           | Validation failure ~ unexpected value provided      |  \n  | `10009`           | Invalid Id provided                                 |  \n  | `10010`           | Personal information validation failure             |  \n  | `11000`           | Clearing/Regulatory failure                         |  \n  | `12000`           | System error                                        | \n  | `13000`           | Uncategorized error                                 |  \n\n  `errorDescription` is dynamically generated, hence not shown here."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentDetailsResponse'
  examples:
    PaymentStatusAUResponse400:
      summary: Payment Status - Request using firm root id
      value:
        errors:
        - errorDetails:
          - errorCode: GCA-095
            errorDescription: endToEndId or firmRootId is required
    ClientIneligibleError:
      summary: Client is not eligible for the API Service
      value:
        errors:
        - errorDetails:
          - errorCode: GCA-001
            errorDescription: Client is not eligible for the API Service
    PaymentDetailsAUResponse400:
      summary: Payment Details - Request using firm root id
      value:
        errors:
        - errorDetails:
          - errorCode: GCA-095
            errorDescription: endToEndId or firmRootId is required
    SystemUnavailableError:
      summary: System Unavailable
      value:
        errors:
        - errorDetails:
          - errorCode: GCA-099
            errorDescription: System Unavailable
  parameters:
    FirmRootId:
      name: firmRootId
      in: query
      description: Unique identification, as assigned by the first instructing agent or initiatingParty, to unambiguously identify the transaction that is passed on, unchanged, throughout the entire interbank chain.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    EndToEndId:
      name: endToEndId
      in: query
      description: Customer assigned reference to the transaction.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-jpmc-security:
- MutualTLS: []
x-jpmc-securitySchemes:
  MutualTLS:
    type: x509
    description: Mutual TLS authentication using client and server certificates.
x-jpmc-securityDefinitions:
  MutualTLS:
    type: x509
    description: Mutual TLS authentication using client and server certificates.
