              type: string
    CategoryPurpose:
      type: object
      description: 'Mandatory RTP markets :-


        Hong Kong - Mandatory'
      properties:
        code:
          type: string
          enum:
          - SALA
          - PENS
          - TAXS
          - SUPP
          description: 'Not applicable for Hong Kong '
        proprietary:
          type: string
          enum:
          - CXSALA
          - CXBSNS
          - CXMRCH
          - CXTOPU
          - WEALTH_TRANSFER
          - INVESTMENT
          - PURCHASE
          - OTHER
          description: "Coded form\nHong Kong RTP\nFor credit transfers -\n\"CXSALA\" - Salary and Benefits Payment\n\"CXBSNS\" - General Business Payment\n\"CXMRCH\" - FPS Merchant Payment\n\"CXTOPU\" - Account Top-up Payment\n\nIndonesia RTP \nWEALTH_TRANSFER\nINVESTMENT\nPURCHASE\nOTHER\nCXSALA"
    PostalAddress:
      type: object
      description: "Address of the party\n\n- For **UK FPS** it is recommended that the combined length of all structured\nfields should be less than 140 characters\n\n- **SEPA Instant** :\n\n  - `creditor`, `ultimateCreditor` and `ultimateDebtor` - unstructured address field, up to 2 lines, 70 characters each including spaces.\n\n  - **FOLLOWING 2023 RULEBOOK GO LIVE IN MARCH 2024** \n    - Structured address fields will be supported\n    - If client elects to use the structured address fields populate:\n      - Address Line + Country + Town Name *OR*\n      - Town Name + Country *OR*\n      - (Postal Address fields except Address Line) + Town Name + Country\n\n  - **THE FOLLOWING SEPA RULEBOOK GUIDELINES GO LIVE IN NOVEMBER 2026:**\n    - Fully unstructured (free-text) postal addresses will be not supported.\n    - Town Name and Country are mandatory when Postal Address is present.\n\n*For ultimateDebtor postalAddress is only required for cross-border flows to be compliant with FTR regulation, not required for intra-EEA flows*\n\n**Push To Card** - Include buildingNumber and streetName"
      properties:
        addressType:
          type: string
          enum:
          - ADDR
          - BIZZ
          - DLVY
          - HOME
          - MLTO
          - PBOX
          description: "| Address Type  |            Description                                               |  \n|---------------|----------------------------------------------------------------------|\n| `ADDR`        | Postal Address is the complete postal address.                       | \n| `BIZZ`        | Business Address is the business address.                            | \n| `DLVY`        | DeliveryTo Address is the address to which delivery is to take place.|  \n| `HOME`        | Residential Address is the home address.                             |  \n| `MLTO`        | MailTo Address is the address to which mail is sent.                 | \n| `PBOX`        | PO Box Address is a postal office (PO) box.                          | "
        streetName:
          type: string
          description: 'Name of street. Mandatory for US RTP

            Maximum length applicable :-

            Push To Card - 35'
          minLength: 0
          maxLength: 70
        buildingNumber:
          type: string
          description: 'Building name or number.

            Maximum length applicable :-

            Push To Card - 35'
          minLength: 0
          maxLength: 16
        postalCode:
          type: string
          description: 'Zip code. Mandatory for Wallet Payments and US RTP

            Maximum length applicable :-

            Push To Card - 9'
          minLength: 0
          maxLength: 16
        townName:
          type: string
          description: 'Name of the town. Mandatory for US RTP and SEPA Instant.

            Maximum length applicable :-

            Push To Card - 25'
          minLength: 0
          maxLength: 35
        countrySubDvsn:
          type: string
          minLength: 0
          maxLength: 35
          description: Mandatory for US RTP
        country:
          type: string
          description: '2 character ISO country code.

            Mandatory for Wallet Payments, US RTP, SEPA Instant and Interac'
          minLength: 2
          maxLength: 2
        addressLine:
          type: array
          minItems: 0
          maxItems: 100
          items:
            type: string
            minLength: 0
            maxLength: 1024
          description: "Not applicable to Wallet Payments. Free form text address lines Up\nto 4 lines.\n\n**Maximum number of characters allowed per instrument/market** :-\n\n  | Market          | Max Lines and length limits    |\n  | ----------------|--------------------------------|\n  | **UK FPS**      |4 lines, 140 characters including spaces |\n  | **SEPA INSTANT**| 2 lines, 70 characters each including spaces |\n  | **Brazil RTP** |7 lines, 70 characters          |\n  | **Chile ACH**   |2 lines, 35 characters + 1 additional line containing 32 characters|"
    DeviceInfo:
      type: object
      description: "Contains Creditor device info.\n\n**Applicable for Direct Debit Payments Only(transferType=DEBIT)** \n\n**Refer the table below for the applicable and mandatory markets**\n\n| Markets        | Significance |\n|----------------|--------------|\n|   Malaysia     | MANDATORY    |"
      properties:
        ipAddress:
          type: string
          minLength: 0
          maxLength: 39
          description: "Device IP address\n\n**Applicable for Direct Debit Payments Only(transferType=DEBIT)**\n\n**Refer the table below for the applicable and mandatory markets**\n\n    | Markets        | Significance |\n    |----------------|--------------|\n    |   Malaysia     | MANDATORY    | "
        geoCoordinates:
          type: object
          description: "Contains the geographical coordinates.\n\n**Applicable for Direct Debit Payments Only(transferType=DEBIT)** \n\n**Refer the table below for the applicable and mandatory markets**\n\n    | Markets        | Significance |\n    |----------------|--------------|\n    |   Malaysia     | MANDATORY    | "
          properties:
            latitude:
              type: string
              minLength: 0
              maxLength: 12
            longitude:
              type: string
              minLength: 0
              maxLength: 12
    Debtor:
      type: object
      properties:
        debtorAccount:
          $ref: '#/components/schemas/DebtorAccount'
        debtorName:
          type: string
          minLength: 0
          maxLength: 128
          description: "Mandatory and Supported for :-\n\n- ACH Chile\n- Push To Card\n- US RTP\n- US FedNow\n- SARIE IPS\n- INTERAC\n- Push To Wallet\n\n\n**Maximum length supported per instrument/market** :-\n\n| Market                          | Max Length |\n|---------------------------------|------------|\n| **US RTP**                      | 140        | \n| **Push To Card** US and Canada  | 30         | \n| **ACH Chile**                   | 140        | \n| **Zelle | 50  (Optional)      | \n| **Malaysia RTP** (Direct Debit) | 140        | "
        partyIdentifiers:
          $ref: '#/components/schemas/PartyIdentifier'
        debtorDevice:
          $ref: '#/components/schemas/DebtorDevice'
        ultimateDebtor:
          $ref: '#/components/schemas/UltimateDebtor'
      required:
      - debtorAccount
    SchemeName:
      title: Scheme Name
      type: object
      description: "\nMandatory - \nAlternate Payments :- Push To Wallet (PayPal/Venmo/Zelle)\n\n\n\nMandatory for pay by proxy -\nRTP :- Singapore, Australia, Hong Kong, Malaysia, Brazil, Mexico\nInterac - Canada "
      properties:
        proprietary:
          type: string
          enum:
          - MSIDN
          - NRIC
          - UEN
          - VPA
          - EMAL
          - ORGN
          - TELI
          - AUBN
          - PSPT
          - BREG
          - MBNO
          - ARMN
          - MOBN
          - SVID
          - CPF
          - CNPJ
          - EVP
          - QRCD
          - ACCN
          - ALIS
          description: "Specifies the type of Proxy account. Mandatory if creditorAccount.alternateAccountIdentifier is present\nProprietary types applicable per market and instrument:\n\nRTP - Singapore :-\nMSIDN - Mobile number \nUEN - Unique Entity Number\nVPA - Virtual Payment Address\nNRIC - IC number \n\nRTP - Australia :-\nEMAL - Email Address\nTELI - Telephone Number\nAUBN - Australia Business number\nORGN - Organization Id\n\nRTP - Malaysia :-\nMBNO - Mobile number\nNRIC - IC number \nPSPT - Passport number \nARMN - Army or Police Number \nBREG - Business registration number\n\nRTP - Hong Kong :-\nEMAL - Email Address\nMOBN - Mobile Number (or fixed-line number)\nSVID - FPS Identifier\n\nRTP - Brazil :-\nCPF - Tax ID of Individual\nCNPJ - Tax ID of Corporate\nEVP - Random Key\nQRCD - QR Code\nEMAL - Email id \nMOBN - Mobile number \n\nRTP - Mexico :-\nMOBN - Mobile number\nBANK - Transfer to a Bank identifier \nCARD - Transfer to a debit card number\n\nRTP - Indonesia :-\nMOBN - Mobile number\nEMAL - Email id \nCARD - Transfer to a debit card number   \nALIS - eMoney transfer\n\nAlternate Payments - Wallet (For Zelle and Interac only EMAL and TELI are applicable) :-\nEMAL - Email Address \nTELI - Telephone Number\nACCN - Alternate account number\nALIS - Alias identification"
    AdditionalInstitution:
      type: object
      description: Only applicable to UK Faster Payments and Mexico RTP (foreign remittances)
      properties:
        bic:
          type: string
        name:
          type: string
        isForeignParty:
          type: boolean
        postalAddress:
          $ref: '#/components/schemas/PostalAddress'
    DeliveryDetails:
      type: object
      properties:
        deliveryMethod:
          type: string
          description: "Method used to deliver the remittance advice information. Only EMAL and URID allowed. \nThis field is currently not available for client usage *****"
        deliveryAddress:
          type: string
          maxLength: 2048
          description: 'Electronic address to which an agent is to send the remittance information. '
    AccountId:
      type: string
      minLength: 0
      maxLength: 128
      description: '**Direct Debit Payments**


        | Payment Type | Market   | Max Length |

        | -------------| -------- | ---------- |

        |     RTP      | Malaysia |    34      |


        ---


        **Credit Transfer Payments**


        ***Applicable and mandatory for RTP and Blockchain (Kinexys Digital Payments) Payments, Push To Wallet (PayPal/Venmo) and Zelle Payments.***


        This field is to provide the regular account id when it is a pay by

        Account instruction. If pay by proxy, this does not need to be filled.


        **Maximum length supported for each instrument and market** :-


        | Payment Type | Market | Max Length |

        | --- | --- | --- |

        | RTP | UK | 8 (7 digit A/C numbers should be padded with a leading zero) |

        | RTP | Singapore | 35 |

        | RTP | Australia | 35 |

        | RTP | Hong Kong | 35 |

        | RTP | Indonesia | 35 |

        | RTP | Brazil | 34 |

        | RTP | Mexico | 16 |

        | RTP | US | 31 |

        | Push To Card | US/Canada | 16 |

        | INTERAC | Canada | 35 |

        | ACH | Chile | 17 |

        | SEPA |  | 34 (IBAN) |

        | Kinexys |  | 34 |

        | Push To Wallet (PayPal/Venmo|  | 35 |

        | Zelle |  | 35 |'
    CoreStatus:
      type: object
      properties:
        createDateTime:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - PENDING_POSTING
          - COMPLETED
          - COMPLETED_CREDITED
          - REJECTED
          - RETURNED
          - WAREHOUSED
          - BLOCKED
          - PENDING_JPM_REVIEW
          description: "Status of the payment.\n\nPENDING - Payment is pending processing\n\nPENDING_POSTING - Payment is yet to be posted in the beneficiary\naccount\n\nCOMPLETED - Payment has successfully completed\n\nCOMPLETED_CREDITED - Status indicating the beneficiary's account has\nbeen credited\n\nREJECTED - Payment has been rejected. Please refer to the exception\nobject for error details\n\nRETURNED - Payment has been retured to the debtor party\n\nWAREHOUSED - Payment request was successfully received. The request will be processed in the next available window, typically the next calendar day\n\nBLOCKED - Payment blocked due to sanctions issue \n\nPENDING_JPM_REVIEW - Payment is pending JPMorgan review\n\nRTP Flows (All Markets) - \n\nPENDING -> COMPLETED  \n\nPENDING -> REJECTED\n\n\nAdditional Flows(RTP)-> \n\nUS  - \n\nPENDING -> PENDING_POSTING -> COMPLETED\n\nPENDING -> BLOCKED\n\n\nHong Kong - \n\nPENDING -> COMPLETED -> COMPLETED_CREDITED\n\n\nPush To Card Flows - \n\nPENDING -> COMPLETED\n\nPENDING -> REJECTED\n\nPENDING -> COMPLETED -> RETURNED\n\n\nBlockchain (Kinexys Digital Payments) Flows - \n\nPENDING -> PENDING_POSTING -> COMPLETED \n\nPENDING -> REJECTED"
        fx:
          $ref: '#/components/schemas/FxApplied'
        clearingSystemReference:
          type: string
          minLength: 0
          maxLength: 256
        exception:
          type: array
          minItems: 0
          maxItems: 100
          items:
            type: object
            properties:
              errorCode:
                type: string
                minLength: 0
                maxLength: 32
              errorDescription:
                type: string
                minLength: 0
                maxLength: 1024
              ruleDefinition:
                type: string
                minLength: 0
                maxLength: 128
              externalCode:
                type: string
                minLength: 0
                maxLength: 32
              externalDescription:
                type: string
                minLength: 0
                maxLength: 1024
                description: This field is currently not available for client usage *****
        paymentRedirected:
          $ref: '#/components/schemas/PaymentRedirected'
    IndividualPartyDetails:
