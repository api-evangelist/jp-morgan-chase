            expiryDate:
              type: string
              description: Card expiry date
              format: date
            cardType:
              type: string
              description: Type of card account
              enum:
              - american_express
              - china_unionpay
              - diners_club
              - jcb
              - maestro
              - master_card
              - uatp
              - visa
              - mir
            sortCode:
              type: string
              description: Routing number (US) / BSB code (Australia) / sort code (UK)
            unitPrice:
              type: number
              description: 'Price per unit (used with units, available for `investment`

