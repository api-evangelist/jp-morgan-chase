            totalPaymentAmount:
              type: number
              description: Total payment amount for loans or credits
            currentDate:
              type: string
              description: Date of Provider statement generation (applicable to banks)
              format: date
            statementCutDate:
              type: string
              description: Date when the current statement becomes a previous one
              format: date
            iban:
              type: string
              description: Account's IBAN number
            blockedAmount:
              type: string
              description: The amount currently blocked in the account?s currency
            status:
              type: string
