                  description: Number of posted transactions
    TransactionsRequest:
      type: object
      required:
      - customerId
      - providerCode
      properties:
        customerId:
          type: string
          description: The unique identifier determined by the J.P. Morgan client for the PSU
        providerCode:
          type: string
          description: Provider's unique reference code
        accountId:
          type: string
          description: 'Account''s unique identifier. If no identifier is provided,

            transactions from all of the PSU''s available accounts will be retrieved'
    TransactionsResponse:
      type: array
      description: Contains transaction details
      items:
        $ref: '#/components/schemas/Transaction'
      minItems: 0
      maxItems: 100
    Transaction:
      type: object
      properties:
        accountId:
          type: string
          description: The ID of the account the transaction belongs to
        duplicated:
          type: boolean
          description: Whether the transaction is duplicated or not
        mode:
          type: string
