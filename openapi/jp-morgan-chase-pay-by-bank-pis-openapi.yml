components:
  parameters:
    RefundId:
      in: path
      name: refundId
      description: A unique refund identifier in UUID (version 4) format.
      schema:
        type: string
        minLength: 0
        maxLength: 36
      required: true
      example: 45f452df-f84a-4fc1-acee-d024f5fede98
    ContentType:
      name: Content-Type
      description: Content Type
      in: header
      required: true
      schema:
        type: string
        enum:
        - application/json
  schemas:
    ProvidersRequest:
      type: object
      properties:
        countryCode:
          type: string
          example: DE
          description: 'ISO 3166-1 Alpha-2 code for the desired country from which to fetch

            the Providers list. If no countryCode is given, then the API will

            return the full list of Providers'
    ProvidersResponse:
      type: object
      description: Contains providers information
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Providers'
          minItems: 0
    Providers:
      type: object
      properties:
        providersCode:
          type: string
          description: Provider's unique reference code
        providersName:
          type: string
          description: Provider's name
        customerNotifiedOnSignIn:
          type: boolean
          description: Whether the Provider will notify the customer upon a login attempt
        instruction:
          type: string
          description: Instructions on how to connect to the Provider in English
        homeUrl:
          type: string
          description: The URL of the Provider's main page
          format: URL
        loginUrl:
          type: string
          description: URL of the entry point to the provider's login interface. This URL is not used
            in account information service requests
          format: URL
        logoUrl:
          type: string
          description: The URL of the Provider's logo
          format: URL
        refreshTimeOut:
          type: integer
          description: Amount of time in minutes that connections to the provider can be refreshed until
            timeout
        maxConsentDays:
          type: integer
          description: Maximum allowed consent duration in days. If the response is `null` then there
            is no limit on the consent duration
        countryCode:
          type: string
          description: Code of Provider's country; ISO 3166-1 alpha-2
        supportedFetchScopes:
          type: array
          description: 'Array of strings with supported fetch scopes (i.e. what data can be

            retrieved from the Provider)'
          items:
            type: string
          minItems: 1
        supportedAccountNatures:
          type: array
          description: Array of possible account natures that can be fetched. Currently, only `account`
            is supported
          items:
            type: string
          minItems: 0
    ConsentRequest:
      type: object
      required:
      - customerId
      - countryCode
      - consentScopes
      - providerCode
      - returnToUrl
      properties:
        customerId:
          type: string
          description: The unique identifier determined by the J.P. Morgan client for the PSU
        countryCode:
          type: string
          description: Code of provider's country in ISO 3166-1 alpha-2 format
        providerCode:
          type: string
          description: Provider's unique reference code
        consentScopes:
          type: array
          description: "Array of possible consent scopes for the PSU to consent to. \nYou must provide\
            \ at least one of the below options"
          items:
            type: string
            properties:
              account_details:
                type: string
              transactions_details:
                type: string
              holder_information:
                type: string
          minItems: 0
        consentDuration:
          type: integer
          description: 'Duration in days of the consent. Can be left blank or null for

            open-ended consent if the provider permits it'
        returnToUrl:
          type: string
          description: 'URL to redirect the PSU once they have completed the

            consent process. This URL must be fully qualified and

            include the full path, as some providers will validate it.

            Additionally, some providers only permit HTTPS redirect URLs'
          format: URL
    ConsentResponse:
      type: object
      properties:
        redirectUrl:
          type: string
          description: 'URL to redirect the PSU to their online banking portal or mobile app to

            confirm the sharing of information. Additionally, the redirect URL will

            contain the access token needed in the Send Authorized Token API

            request body'
          format: URL
    AuthorizeRequest:
      type: object
      required:
      - customerId
      - providerCode
      - authToken
      properties:
        customerId:
          type: string
          description: The unique identifier determined by the J.P. Morgan client for the PSU
        providerCode:
          type: string
          description: Providers unique reference code
        authToken:
          type: string
          example: access_token=bc4521d3&state=Pd8b4d0eb
          description: The authorization token given by the provider in the `redirectUrl` attribute in
            the Account Information Access Consent API response body
    AuthorizeResponse:
      type: object
      properties:
        message:
          type: string
          description: Message that states whether the authorization was successful and a connection was
            established to the provider or not
    AccountsRequest:
      type: object
      required:
      - customerId
      - providerCode
      properties:
        customerId:
          type: string
          description: The unique identifier determined by the J.P. Morgan client for the PSU
        providerCode:
          type: string
          description: Providers unique reference code
    AccountsResponse:
      type: array
      description: Contains account(s) information
      items:
        $ref: '#/components/schemas/Account'
      minItems: 0
      maxItems: 100
    Account:
      type: object
      properties:
        accountId:
          type: string
          description: Accounts unique identifier. This number has no other relevance or use to the PSU
            or provider; it is only used to identify the account in API requests and responses
        balance:
          type: number
          description: Account's current balance
        nature:
          type: string
          description: 'The type of the account. Note that for the ''credit_card'' nature, the

            balance represents the sum of all negative transactions; the

            positive ones do not count'
          enum:
          - account
          - bonus
          - card
          - checking
          - credit
          - credit_card
          - debit_card
          - ewallet
          - insurance
          - investment
          - loan
          - mortgage
          - savings
        name:
          type: string
          description: Accounts unique name
          example: Account100
        currencyCode:
          type: string
          description: Accounts currency. ISO 4217 Alpha-3 Currency Code
        extra:
          type: object
          description: Additional account related fields.
          properties:
            accountName:
              type: string
              description: Changeable name of the account
            accountNumber:
              type: string
              description: Account number
            lastPostedTransactionId:
              type: string
              description: The identifier of the last posted transaction
            cards:
              type: array
              description: List of masked card numbers
              items:
                type: string
              minItems: 0
            assets:
              type: array
              description: Array of crypto codes and their amounts assigned to an `investment` account
              items:
                type: string
              minItems: 0
            availableAmount:
              type: number
              description: Available amount in the accounts currency
            units:
              type: string
              description: Amount of units owned (used with unit_price, available for `investment` account
                nature only)
            nextPaymentDate:
              type: string
              description: Next payment date for loans or credits
              format: date
            closingBalance:
              type: number
              description: Account balance at the end of an accounting period
            creditLimit:
              type: number
              description: Credit limit in the account?s currency
            interestRate:
              type: string
              description: 'Interest rate paid on the account?s balance as a percentage

