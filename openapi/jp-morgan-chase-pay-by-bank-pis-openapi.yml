        propertyName: template_identifier
        mapping:
          FPS: '#/components/schemas/BacsChapsFpsPayment'
          SEPA: '#/components/schemas/SepaPayment'
    SepaPayment:
      title: SEPA Payment
      type: object
      properties:
        data:
          type: object
          required:
          - customer_id
          - country_code
          - provider_code
          - payee_description
          - template_identifier
          - return_to
          - payment_attributes
          properties:
            customer_id:
              type: string
              description: The unique identifier determined by the J.P. Morgan client for the PSU
            country_code:
              type: string
              description: Provider's country code in ISO 3166-1 alpha-2 format
            provider_code:
              type: string
              description: Provider's unique code. This value is the same as the `code` attribute in the
                providers API response body
            payee_description:
              type: string
              description: 'A versatile field that can be used to specify the merchant''s

                internal identifier, payee name, user identifier, or any other

                fields that might be relevant to the J.P. Morgan client for

                internal processes. This field is not visible to the PSU'
            template_identifier:
              type: string
              description: 'Unique identifier for the template being used for the

                payment. This value is the same as the ''identifier'' field in

                the Payment Templates API response body and the

                ''payment_templates'' attribute returned by the providers API'
            return_to:
              type: string
              description: 'The URL that the PSU will be redirected to after they have

                completed the payment. This URL must be fully qualified

                and include the full path, as some providers will validate it.

                Additionally, some providers only permit HTTPS redirect URLs'
            locale:
              type: string
              description: "The language of the error message in the ISO 639-1 format. \nPossible values\
                \ are: bg, cz, de, en, es-MX, es, fi, fr, he, hr, hu, it, nl, pl, pt-BR, pt, ro, ru, si,\
                \ sk, sv, tr, uk, zh-HK(Traditional), zh(Simplified)  \n\n**Defaults to en if not provided**"
            payment_attributes:
              type: object
              description: 'Payment attributes for the select Payment Template. This object will

                vary based on payment type'
              required:
              - end_to_end_id
              - creditor_name
              - creditor_iban
              - description
              - amount
              - currency_code
              properties:
                end_to_end_id:
                  type: string
                  description: 'Numerical identifier determined by the J.P. Morgan

                    client for the payment. This identifier will follow the

                    payment throughout the process and can be used

                    for reconciliation and reporting'
                customer_last_logged_at:
                  type: string
                  description: Customer's last login date and time
                customer_ip_address:
                  type: string
                  description: Customer's IP address
                customer_device_os:
                  type: string
                  description: Customer's operating system
                creditor_name:
                  type: string
                  description: 'Creditor''s name

                    This field may be visible to the PSU, depending on the provider'
                creditor_street_name:
                  type: string
                  description: Creditor's street name
                creditor_building_number:
                  type: string
                  description: Creditor's building number
                creditor_post_code:
                  type: string
                  description: Creditor's post code
                creditor_town:
                  type: string
                  description: Creditor's town
                creditor_iban:
                  type: string
                  description: Creditor's IBAN
                debtor_iban:
                  type: string
                  description: 'Debtor''s IBAN

                    **Can be mandatory to initiate payments in some locales**'
                description:
                  type: string
                  description: 'A description of the payment that will be sent to the

                    provider. The description may be visible to the PSU,

                    depending on the provider'
                amount:
                  type: string
                  description: Amount of the payment
                currency_code:
                  type: string
                  description: Currency used for the Payment
            connect_template:
              type: string
              description: 'An optional field to specify the UI template.


                **Only applicable for certain merchants**'
    BacsChapsFpsPayment:
      type: object
      title: bacsChapsFpsPayment
      description: Payment request schema for BACS, CHAPS and FPS payments
      properties:
        data:
          type: object
          required:
          - customer_id
          - country_code
          - provider_code
          - payee_description
          - template_identifier
          - return_to
          - payment_attributes
          properties:
            customer_id:
              type: string
              description: The unique identifier determined by the J.P. Morgan client for the PSU
            country_code:
              type: string
              description: Provider's country code in ISO 3166-1 alpha-2 format
            provider_code:
              type: string
              description: Provider's unique code. This value is the same as the `code` attribute in the
                providers API response body
            payee_description:
              type: string
              description: 'A versatile field that can be used to specify the merchant''s

                internal identifier, payee name, user identifier, or any other

                fields that might be relevant to the J.P. Morgan client for

                internal processes. This field is not visible to the PSU'
            template_identifier:
              type: string
              description: 'Unique identifier for the template being used for the

                payment. This value is the same as the ''identifier'' field in

                the Payment Templates API response body and the

                ''payment_templates'' attribute returned by the providers API'
            return_to:
              type: string
              description: 'The URL that the PSU will be redirected to after they have

                completed the payment. This URL must be fully qualified

                and include the full path, as some providers will validate it.

                Additionally, some providers only permit HTTPS redirect URLs'
            noFundsRjctPreferred:
              type: boolean
              description: "This flag is handled only for those providers which support it:\n  -  TRUE:\
                \ If the PSU has no available funds (a.k.a.\n  fundsAvailable=false) the bank should reject\
                \ the\n  payment\n  - FALSE Payment Initiation is accepted even when\n  \"fundsAvailable\"\
                =false. If the account has funds at\n  the time of SEPA execution (e.g. End of Day batch\n\
                \  Payment instead of Instant payment), the payment will go through."
            payment_attributes:
              type: object
              description: 'Payment attributes for the select Payment Template. This object will

                vary based on payment type'
              required:
              - end_to_end_id
              - creditor_name
              - creditor_sort_code
              - creditor_account_number
              - description
              - amount
              - currency_code
              properties:
                end_to_end_id:
                  type: string
                  description: 'Numerical identifier determined by the J.P. Morgan

                    client for the payment. This identifier will follow the

                    payment throughout the process and can be used

                    for reconciliation and reporting'
                customer_last_logged_at:
                  type: string
                  description: Customer's last login date and time
                customer_ip_address:
                  type: string
                  description: Customer's IP address
                customer_device_os:
                  type: string
                  description: Customer's operating system
                creditor_name:
                  type: string
                  description: 'Creditor''s name

                    This field may be visible to the PSU, depending on the provider'
                creditor_street_name:
                  type: string
                  description: Creditor's street name
                creditor_building_number:
                  type: string
                  description: Creditor's building number
                creditor_post_code:
                  type: string
                  description: Creditor's post code
                creditor_town:
                  type: string
                  description: Creditor's town
                creditor_account_number:
                  type: string
                  description: Creditor's account number
                creditor_sort_code:
                  type: string
                  description: Creditor's sort code
                description:
                  type: string
                  description: 'A description of the payment that will be sent to the

                    provider. The description may be visible to the PSU,

                    depending on the provider'
                amount:
                  type: string
                  description: Amount of the payment
                currency_code:
                  type: string
                  description: Currency used for the Payment
    PaymentResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            payment_id:
              type: string
              description: Internal payment ID for the submitted payment initiation request
            expires_at:
              type: string
              description: Expiration date of the redirect URL
            redirect_url:
              type: string
              description: Points to a page where the PSU can provide PISP access to make the payment
    PaymentStatusRequest:
      type: object
      properties:
        customer_id:
          type: string
          description: The unique ID determined by the J.P. Morgan client for the PSU
        payment_id:
          type: string
          description: 'The unique payment identifier generated by J.P. Morgan.

            This value is the same as the `payment_id` attribute in the

            Payment Initiation API response body'
    PaymentStatusResponse:
      type: object
      properties:
        id:
          type: string
          description: Payment ID for the submitted payment initiation request
        provider_code:
          type: string
          description: Provider's code for where the payment has been initiated
        provider_name:
          type: string
          description: Provider's name
        status:
          type: string
          description: Payment status
          enum:
          - processing
          - accepted
          - rejected
          - failed
        template_identifier:
          type: string
          description: 'Identifiers of the payment templates that are supported by this

            provider'
          enum:
          - FPS
          - SEPA
          - SEPA_INSTANT
          - BACS
          - CHAPS
          - SWIFT
        payment_attributes:
          type: object
          description: Attributes of the payment. May vary based on payment template
          properties:
            mode:
              type: string
            amount:
              type: string
            debtor_iban:
              type: string
            description:
              type: string
            creditor_iban:
              type: string
            creditor_name:
              type: string
            creditor_town:
              type: string
            currency_code:
              type: string
            end_to_end_id:
              type: string
            creditor_agent:
              type: string
            creditor_region:
              type: string
            creditor_address:
              type: string
            creditor_post_code:
              type: string
            customer_device_os:
              type: string
            creditor_agent_name:
              type: string
            customer_ip_address:
              type: string
            customer_user_agent:
              type: string
            creditor_street_name:
              type: string
            creditor_bank_country_code:
              type: string
            customer_last_logged_at:
              type: string
            creditor_building_number:
              type: string
            payment_template_identifier:
              type: string
        stages:
          type: array
          items:
            type: object
            description: 'The stages the payment request has completed. Will contain details

              on the time and status'
            properties:
              id:
                type: string
              name:
                type: string
              created_at:
                type: string
                description: Created date time in ISO 8601 date time format
          minItems: 0
    PaymentAuthorizationRequest:
      required:
      - paymentId
      - authToken
      type: object
      properties:
        paymentId:
          type: string
          description: 'The unique payment identifier generated by J.P. Morgan.

            This value is the same as the `payment_id` attribute in the

            Payment Initiation API response body'
        authToken:
          type: string
          description: 'One-time use token given by the provider to authorize the

            payment. This token is obtained from the `redirect_url` field in

            the Payment Initiation API response body and it must be

            appended with “&” and the “end_to_end id” (e.g.

            “code=95c…Ijo&end_to_end_id= 0002")'
    PaymentAuthStatusResponse:
      type: object
      properties:
        id:
          type: string
          description: Payment ID for the submitted payment initiation request
        provider_code:
          type: string
          description: Provider code for where the payment has been initiated
        provider_name:
          type: string
          description: Provider's name
        customer_id:
          type: string
          description: The unique identifier determined by the J.P. Morgan client for the PSU
        created_at:
          type: string
          description: Created timestamp in ISO 8601 date time format
        updated_at:
          type: string
          description: Updated timestamp in ISO 8601 date time format
        payment_consent_id:
          type: string
          description: Consent Id of the authorized payment.
        status:
          type: string
          description: 'The status of the payment.


            | Status     | Meaning                                                                                                                              |

            | -----------|--------------------------------------------------------------------------------------------------------------------------------------|

            | processing | The payment initiation is in process. Further detail can be found by looking
            at the “stages” attribute below                         |

            | accepted   | The payment initiation has been accepted by the ASPSP                                                                                |

            | rejected   | The payment was rejected by the ASPSP. An error code will be provided                                                                |

            | failed     | he payment initiation has been rejected due to an unknown reason, such as the
            ASPSP being down or returning a generic error response |'
          enum:
          - processing
          - accepted
          - rejected
          - failed
        fundsAvailable:
          type: boolean
          description: 'Refer the table for the interpretation of the values

            | FundsAvailable | Meaning                                                                                                                                                                                                     |

            | -----------    |-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

            | True           | Money will be debited. If the bank uses a batch process for SEPA processing
            and the PSU no longer have sufficient funds, the money will not be debited                                                      |

            | False          | In combination with `noFundsRjctPreferred=TRUE`, the bank rejects the payment.
            If noFundsRjctPreferred is not supported for a specific bank, the default behavior is that
            the payment is rejected by the bank |'
        template_identifier:
          type: string
          description: Identifiers of the payment templates that are supported by this provider such as
            FPS, SEPA, SEPA_INSTANT, BACS, CHAPS
        payment_attributes:
          type: object
          description: 'The payment attributes object. These are the same attributes used to

            initiate the payment, so will therefore vary depending on the payment template'
        custom_fields:
          type: object
          description: The custom fields (optional) are not used currently but would be used for any additional
            fields that would be relevant to payments.
        stages:
          type: array
          items:
            type: object
            description: "The stages that the payment request has completed. \n\n- Possible values for\
              \ a payment with status `processing`are below:\n\n  | Stage Name | Meaning             \
              \                                                                                      \
              \                           |\n  | -----------|--------------------------------------------------------------------------------------------------------------------------------------|\n\
              \  | initialize | The payment has been created, but the initiation process has not begun\n\
              \  | start      | The payment initiation process has begun|\n  | interactive| User interaction\
              \ is required, such as authentication or redirection to the ASPSP|\n  | submission | The\
              \ payment has been submitted to the ASPSP|\n  | settlement | The payment has been validated\
              \ by the ASPSP|\n  | completed  | The payment lifecycle has been completed|\n  | finish\
              \     | The action has been completed|\n\n- Possible value for payments with status “accepted/rejected/failed”\
              \ is `finish`"
            properties:
              id:
                type: string
              name:
                type: string
              created_at:
                type: string
                description: Created date time in ISO 8601 date time format
          minItems: 0
    RefundsRequest:
      type: object
      required:
      - paymentIdentifiers
      - amount
      - reason
      - mode
      properties:
        paymentIdentifiers:
          $ref: '#/components/schemas/PaymentIdentifiers'
        amount:
          $ref: '#/components/schemas/Amount'
        reason:
          $ref: '#/components/schemas/Reason'
        mode:
          $ref: '#/components/schemas/Mode'
    Amount:
      description: Contains amount details
      type: object
      properties:
        amount:
          description: Amount should be more than 0.01 and maximum of two decimal places allowed
          type: number
          format: decimal
          example: 10
        currency:
          description: 3 character ISO 4217 currency code.
          type: string
          enum:
          - GBP
          - EUR
      required:
      - amount
      - currency
    Reason:
      description: Reason for the refund request
      type: string
      enum:
      - DUPLICATE
      - WITHDRAWAL
      - REFUND
      - PARTIAL_REFUND
    Mode:
      description: Captures the speed of refund settlement
      type: string
      enum:
      - INSTANT
      - NORMAL
    PaymentIdentifiers:
      type: object
      description: the payment identifier provided in the original payment request
      properties:
        endToEndId:
          description: The EndtoEndId provided in the original payment initiation request
          type: string
          example: '123123123'
        paymentId:
          description: The PaymentId received in the original payment initiation response
          type: string
          example: '1401642'
      minProperties: 1
      additionalProperties: false
    StatusUpdatedAt:
      type: string
      format: dateTime
      description: The last updated date and time of the refund status
      example: '2022-05-31T14:00:57.751Z'
    RefundsResponse:
      type: object
      description: The refunds response object from the API provided the request was accepted successfully.
      properties:
        refund:
          type: object
          properties:
            refundId:
              type: string
              description: A unique refund identifier in UUID ( version 4) format
              example: 45f452df-f84a-4fc1-acee-d024f5fede98
            status:
              description: 'Describes the status of the refund.


                |Status|    |Description|

                PENDING   - The refund is pending for processing

                COMPLETED - The refund is processed successfully

                REJECTED  - The refund was rejected due to the request not qualified

                FAILED    - The refund was failed such as credit can''t be done to the bank account'
              type: string
              enum:
              - PENDING
              - COMPLETED
              - REJECTED
              - FAILED
            paymentIdentifiers:
              $ref: '#/components/schemas/PaymentIdentifiers'
            amount:
              $ref: '#/components/schemas/Amount'
            reason:
              $ref: '#/components/schemas/Reason'
            mode:
              $ref: '#/components/schemas/Mode'
            statusUpdatedAt:
              $ref: '#/components/schemas/StatusUpdatedAt'
    Error:
      type: object
      description: "The error response object \n\n**Note: This error response format is used by all AISP\
        \ and PISP endpoints except Refunds endpoint which adopted a better error strcuture**"
      properties:
        error:
          type: array
          items:
            properties:
              errorCode:
                type: string
                description: Unique error code
              errorMsg:
                type: string
                description: Describes the details of the error occurred
          minItems: 0
          maxItems: 99
    ErrorsInit:
      type: object
      description: Contains error response
      properties:
        errors:
          description: Contains error payload
          type: object
          properties:
            errorDetails:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetailsInit'
              minItems: 0
    Errors:
      type: object
      properties:
        errors:
          type: object
          properties:
            errorDetails:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetailsType'
              minItems: 0
    ErrorDetailsInit:
      type: object
      properties:
        errorCode:
          type: string
          example: '1009'
        errorDescription:
          type: string
          example: RefundId provided in the URI is invalid
        ruleDefinition:
          type: string
          example: Invalid Id provided
    ErrorDetailsType:
      type: object
      properties:
        errorCode:
          type: string
          example: GCA-001
        errorDescription:
          type: string
          example: Client is not eligible for the API Service.
