# Harvested verbatim from the J.P. Morgan Payments Developer Portal.
# method: searched
# source: https://developer.payments.jpmorgan.com/api/llm-content?path=en%2Fapi%2Ftreasury%2Fpay-by-bank%2Fais-oas.md
# generated: '2026-07-28'
openapi: 3.0.1
info:
  title: Account Information Services
  version: 2.0.22
  description: Enable access to account information services that allow J.P. Morgan clients to leverage
    Open Banking for data from customer bank accounts. Support consent management, account verification,
    balance retrieval, and transaction history for secure and efficient financial integration.
  contact:
    name: JPMorgan Chase & Co. API Support
    url: https://apistore.jpmchase.net/support/contact
    email: imsd.security.operations@jpmorgan.com
servers:
- url: https://api.payments.jpmorgan.com/paybybank/v2
  description: PRODUCTION
- url: https://api-cat.payments.jpmorgan.com/paybybank/v2
  description: CLIENT TESTING
- url: https://api-mock.payments.jpmorgan.com/paybybank/v2
  description: MOCK
tags:
- name: Consents
  description: Account Information - Consents
- name: Account Services
  description: Account Information - Services
paths:
  /consents:
    post:
      tags:
      - Consents
      summary: Initiate Consent Journey
      description: '**Initiate consent journey to grant access to account information**

        '
      operationId: initiateConsent
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ClientId'
      requestBody:
        $ref: '#/components/requestBodies/ConsentInitiation'
      responses:
        '201':
          $ref: '#/components/responses/201-ConsentCreated'
        '400':
          $ref: '#/components/responses/400-BadConsentRequest'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '429':
          $ref: '#/components/responses/429-TooManyRequests'
        '503':
          $ref: '#/components/responses/503-ServiceUnavailable'
      callbacks:
        consentCallback:
          '{client-url}/callback':
            post:
              operationId: consentCallBack
              summary: Consent Webhook
              requestBody:
                description: '**Consent callback to merchant, after completion of user consent journey.
                  Merchant can retrieve consented information**

                  '
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: '#/components/schemas/WebHook'
                    examples:
                      Consent Link - Initiated US:
                        $ref: '#/components/examples/ConsentLinkInitiatedCallBackUS'
                      Consent Link - Initiated EU:
                        $ref: '#/components/examples/ConsentLinkInitiatedCallBackEU'
                      Consent Link - Initiated UK:
                        $ref: '#/components/examples/ConsentLinkInitiatedCallBackUK'
                      Consent Link - Opened US:
                        $ref: '#/components/examples/ConsentLinkOpenedCallBackUS'
                      Consent Link - Opened EU:
                        $ref: '#/components/examples/ConsentLinkOpenedCallBackEU'
                      Consent Link - Opened UK:
                        $ref: '#/components/examples/ConsentLinkOpenedCallBackUK'
                      Consent Link - Pending US:
                        $ref: '#/components/examples/ConsentLinkPendingCallBackUS'
                      Consent Link - Expired US:
                        $ref: '#/components/examples/ConsentLinkExpiredCallBackUS'
                      Consent Link - Expired EU:
                        $ref: '#/components/examples/ConsentLinkExpiredCallBackEU'
                      Consent Link - Expired UK:
                        $ref: '#/components/examples/ConsentLinkExpiredCallBackUK'
                      Consent Link - Failed US:
                        $ref: '#/components/examples/ConsentLinkFailedCallBackUS'
                      Consent Link - Failed EU:
                        $ref: '#/components/examples/ConsentLinkFailedCallBackEU'
                      Consent Link - Failed UK:
                        $ref: '#/components/examples/ConsentLinkFailedCallBackUK'
                      Consent Link - Cancelled US:
                        $ref: '#/components/examples/ConsentLinkCancelledCallBackUS'
                      Consent Link - Cancelled EU:
                        $ref: '#/components/examples/ConsentLinkCancelledCallBackEU'
                      Consent Link - Cancelled UK:
                        $ref: '#/components/examples/ConsentLinkCancelledCallBackUK'
                      Consent Link - Abandoned US:
                        $ref: '#/components/examples/ConsentLinkAbandonedCallBackUS'
                      Consent Link - Abandoned EU:
                        $ref: '#/components/examples/ConsentLinkAbandonedCallBackEU'
                      Consent Link - Abandoned UK:
                        $ref: '#/components/examples/ConsentLinkAbandonedCallBackUK'
                      Consent Link - Successful US:
                        $ref: '#/components/examples/ConsentLinkSuccessfullCallbackUS'
                      Consent Link - Successful EU:
                        $ref: '#/components/examples/ConsentLinkSuccessfullCallbackEU'
                      Consent Link - Successful UK:
                        $ref: '#/components/examples/ConsentLinkSuccessfullCallbackUK'
                      Consent - Partially Success - US:
                        $ref: '#/components/examples/ConsentPartiallySuccessfulCallBackUS'
                      Consent - Success - US:
                        $ref: '#/components/examples/ConsentSuccessfulCallBackUS'
                      Consent - Success - UK:
                        $ref: '#/components/examples/ConsentSuccessfulCallBackUK'
                      Consent - Success - EU:
                        $ref: '#/components/examples/ConsentSuccessfulCallBackEU'
                      Consent - Pending - US:
                        $ref: '#/components/examples/ConsentPendingCallBackUS'
                      Consent - Ready to Validate - US:
                        $ref: '#/components/examples/ConsentReadyToValidateCallBackUS'
                      Consent - Revoked by Client US:
                        $ref: '#/components/examples/ConsentRevokeCallBackUS-ClientDelete'
                      Consent - Revoked by System US:
                        $ref: '#/components/examples/ConsentRevokeCallBackUS-PermanentDelete'
                      Consent - Failed US:
                        $ref: '#/components/examples/ConsentFailedCallBackUS'
                      Consent - Failed EU:
                        $ref: '#/components/examples/ConsentFailedCallBackEU'
                      Consent - Failed UK:
                        $ref: '#/components/examples/ConsentFailedCallBackUK'
                      Consent - Expired US:
                        $ref: '#/components/examples/ConsentRevokeCallBackUS-Expired'
                      ConsentFix - Success US:
                        $ref: '#/components/examples/ConsentFixSuccessfulCallBackUS'
                      ConsentFix - Failed US:
                        $ref: '#/components/examples/ConsentFixFailedCallBackUS'
                required: true
              responses:
                '204':
                  description: Callback successfully completed
  /consents/{consentId}:
    summary: Get consent status
    get:
      tags:
      - Consents
      summary: Get consent status
      description: '**Get consent status.**

        '
      operationId: getConsentStatus
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ClientId'
      - name: consentId
        in: path
        description: JPMC generated consent identifier in UUID format (e.g., 0488ecb1-33c3-4b6a-b5e5-7a61680c463f)
        required: true
        schema:
          $ref: '#/components/schemas/ConsentId'
        examples:
          ConsentId-US:
            summary: Example of consent id for US
            value: 0488ecb1-33c3-4b6a-b5e5-7a61680c463f
      responses:
        '200':
          $ref: '#/components/responses/200-OK-ConsentBasic'
        '400':
          $ref: '#/components/responses/400-BadConsentIdRequest'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-NotFoundAccount'
        '422':
          $ref: '#/components/responses/422-Unprocessable'
        '429':
          $ref: '#/components/responses/429-TooManyRequests'
        '503':
          $ref: '#/components/responses/503-ServiceUnavailable'
    delete:
      tags:
      - Consents
      summary: Revoke consent
      description: '**Revoke a consent authorized for continuous access**

        '
      operationId: revokeConsent
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ClientId'
      - name: consentId
        in: path
        description: JPMC generated consent identifier
        required: true
        schema:
          $ref: '#/components/schemas/ConsentId'
        examples:
          ConsentId-US:
            summary: Example of consent id for US
            value: 0488ecb133c34b6ab5e57a61680c463f
      responses:
        '204':
          description: Consent Revoked Successfully
        '400':
          $ref: '#/components/responses/400-BadConsentIdRequest'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-NotFound'
        '422':
          $ref: '#/components/responses/422-Unprocessable'
        '429':
          $ref: '#/components/responses/429-TooManyRequests'
        '503':
          $ref: '#/components/responses/503-ServiceUnavailable'
  /consents/{consentId}/renew:
    summary: Renew consent or obtain new Consent Link URL for Microdeposit Confirmation
    post:
      tags:
      - Consents
      summary: Renew consent
      description: 'Renew consent is used to prompt the account holder for continued access to their financial
        data.

        For flows with Microdeposit and Challenge, Renew Consent is used to obtain new Consent Link URL
        for completion of the microdeposit confirmation.

        '
      operationId: renewConsent
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ClientId'
      - name: consentId
        in: path
        description: JPMC generated consent identifier
        required: true
        schema:
          $ref: '#/components/schemas/ConsentId'
        examples:
          ConsentId-US:
            summary: Example of consent id for US
            value: 0488ecb133c34b6ab5e57a61680c463f
      requestBody:
        $ref: '#/components/requestBodies/ConsentUpdate'
      responses:
        '200':
          $ref: '#/components/responses/200-OK-ConsentRenew'
        '400':
          $ref: '#/components/responses/400-BadConsentIdRequest'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-NotFoundAccount'
        '422':
          $ref: '#/components/responses/422-Unprocessable'
        '429':
          $ref: '#/components/responses/429-TooManyRequests'
        '503':
          $ref: '#/components/responses/503-ServiceUnavailable'
  /accounts:
    get:
      summary: Retrieve account information report
      description: 'The **Pay By Bank** - **Account Information Report API** provides an overview of permissioned
        consumer payment account details.

        '
      tags:
      - Account Services
      operationId: getAccounts
      parameters:
      - $ref: '#/components/parameters/ConsentId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          $ref: '#/components/responses/200-OK-AccountSummary'
        '400':
          $ref: '#/components/responses/400-AccountVerificationBadRequest'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-NotFound'
        '422':
          $ref: '#/components/responses/422-Unprocessable'
        '429':
          $ref: '#/components/responses/429-TooManyRequests'
        '503':
          $ref: '#/components/responses/503-ServiceUnavailable'
  /balances:
    get:
      summary: Retrieve balance information report
      description: 'The **Pay By Bank** - **Balance Report** provides an overview of permissioned consumer
        payment account information and access to real-time balances.

        '
      tags:
      - Account Services
      operationId: getAccountBalances
      parameters:
      - $ref: '#/components/parameters/ConsentId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          $ref: '#/components/responses/200-OK-BalanceDetails'
        '400':
          $ref: '#/components/responses/400-AccountVerificationBadRequest'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-NotFound'
        '422':
          $ref: '#/components/responses/422-Unprocessable'
        '429':
          $ref: '#/components/responses/429-TooManyRequests'
        '503':
          $ref: '#/components/responses/503-ServiceUnavailable'
  /transactions:
    get:
      summary: Retrieve transaction history report
      description: 'The **Pay By Bank** - **Transaction History Report API** provides an overview of permissioned
        consumer payment account information, including real-time balances and transaction history.

        '
      tags:
      - Account Services
      operationId: getAccountTransactions
      parameters:
      - $ref: '#/components/parameters/ConsentId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          $ref: '#/components/responses/200-OK-TransactionDetails'
        '400':
          $ref: '#/components/responses/400-AccountVerificationBadRequest'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-NotFound'
        '422':
          $ref: '#/components/responses/422-Unprocessable'
        '429':
          $ref: '#/components/responses/429-TooManyRequests'
        '503':
          $ref: '#/components/responses/503-ServiceUnavailable'
  /account-information:
    get:
      summary: Retrieve account information
      description: 'The **Pay By Bank** - **Account Information API** facilitates the verification and
        provision of detailed information for linked bank accounts with continuous access permissions.
        This API allows users to retrieve specific account information, including account details, account
        owner verification, and balance checks.

        '
      tags:
      - Account Services
      operationId: getAccountSummaries
      parameters:
      - $ref: '#/components/parameters/ConsentId'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/AccountView'
      responses:
        '200':
          $ref: '#/components/responses/200-OK-AccountInformation'
        '400':
          $ref: '#/components/responses/400-AccountInformationBadRequest'
        '401':
          $ref: '#/components/responses/401-Unauthorized'
        '403':
          $ref: '#/components/responses/403-Forbidden'
        '404':
          $ref: '#/components/responses/404-NotFound'
        '422':
          $ref: '#/components/responses/422-Unprocessable'
        '429':
          $ref: '#/components/responses/429-TooManyRequests'
        '503':
          $ref: '#/components/responses/503-ServiceUnavailable'
components:
  schemas:
    IdempotencyKey:
      title: IdempotencyKey
      description: A string that enables the API support idempotency by safely retrying requests without
        accidentally performing the same operation twice.
      type: string
      minLength: 36
      maxLength: 36
      pattern: ^[-_.a-zA-Z0-9]{36}$
      example: 1b036f9c-8c84-4ce6-b1dd-5979472945a1
    RequestId:
      title: RequestId
      description: Client provided unique identifier for the current request invocation
      type: string
      minLength: 6
      maxLength: 128
      example: 5d1ff121-3a41-4cdc-9af9-de2f19cd567f
    ClientId:
      title: ClientId
      description: Unique Identifier of the client that is generated by PBB.
      type: string
      minLength: 1
      maxLength: 36
      example: '9876543210'
    ReferenceId:
      type: string
      minLength: 6
      maxLength: 128
      description: A unique identifier provided by the client for the request, which will be returned
        upon the completion of the consent process.
    ConsentType:
      title: ConsentType
      type: string
      description: 'Type of consent requested, specifying the **scope** of access to account information


        | Consent Type             | Description                                                           |
        Supported Region |

        |:-------------------------|:-----------------------------------------------------------------------|:------------------|

        | `ACCOUNT_INFORMATION`    | Consent for continuous access to account, account holders and balances
        information  | US  |

        | `ACCOUNT_CHECK`          | Consent for one time access to account and account holder information|
        UK, EU|

        | `BALANCE_CHECK`          | Consent for one time access to account balances information| UK,
        EU|

        | `TRANSACTIONS`           | Consent for one time access to access account transaction history|UK,
        EU|

        | `PAYMENT`                | Consent for one time payment to make a payment |UK, EU|

        '
      enum:
      - ACCOUNT_INFORMATION
      - ACCOUNT_CHECK
      - BALANCE_CHECK
      - TRANSACTIONS
      - PAYMENT
    ExternalUserId:
      title: ExternalUserId
      description: User Id for tracking the external user
      type: string
      minLength: 6
      maxLength: 256
    Email:
      title: Email
      type: object
      description: Representation of detailed email information.
      properties:
        isPrimary:
          type: boolean
          description: Indicates the email address is the first point of communication in instances where
            there are multiple email addresses.
        emailAddressType:
          type: string
          description: The email type.
          enum:
          - PERSONAL
          - BUSINESS
          - OTHER
          - UNKNOWN
        emailAddress:
          type: string
          description: The email address.
          format: email
      additionalProperties: false
    Phone:
      title: Phone
      type: object
      description: Representation of a Phone Number
      properties:
        phoneNumber:
          type: string
          pattern: ^\+[0-9]{1,3}-[0-9()+\-]{1,30}$
          description: Number as defined by the Telecom services
        phoneNumberType:
          type: string
          description: "The phone type.\r\n"
          enum:
          - PHONE
          - MOBILE
          - BUSINESS
          - OTHER
    ExternalUserProfile:
      type: object
      title: ExternalUserProfile
      description: Details of the external user.
      properties:
        firstName:
          type: string
          description: First name of the external user.
          maxLength: 100
        lastName:
          type: string
          description: Last name of the external user.
          maxLength: 100
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/Phone'
    FinancialInstitutionIdType:
      title: FinancialInstitutionIdType
      description: Financial Institution Identifier Type
      type: string
      enum:
      - BIC
      - SORT_CODE
    FinancialInstitutionId:
      title: FinancialInstitutionId
      description: Financial Institution Identifier
      type: object
      properties:
        id:
          type: string
          description: Financial Institution Identifier
        idType:
          $ref: '#/components/schemas/FinancialInstitutionIdType'
      required:
      - id
      - idType
    ConsentLinkRequest:
      type: object
      title: ConsentLinkRequest
      description: Representation of a User's consent detail for accessing financial data
      properties:
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        country:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: "ISO 3166-1 Alpha-2 Country Code representing where the consent is requested\n\n\
            \  **Supported Countries:**\n  | Region         | Country                        |\n  | :-------------\
            \ | :----------------------------- |\n  | United States  | US                            \
            \ |\n  | United Kingdom | GB                             |\n  | EU             | DE, ES, IT,\
            \ NL, AT |\n"
        consentType:
          $ref: '#/components/schemas/ConsentType'
        externalUserId:
          $ref: '#/components/schemas/ExternalUserId'
        externalUserProfile:
          $ref: '#/components/schemas/ExternalUserProfile'
        redirectUrl:
          type: string
          format: uri
          description: Callback URL to be redirected upon consent completion
        locale:
          type: string
          description: 'Locale indicating the language and regional settings for the consent initiation

            '
          default: en_US
          maxLength: 5
        financialInstitutionId:
          description: 'Financial Institution where the end user will log in to provide consent

            '
          allOf:
          - $ref: '#/components/schemas/FinancialInstitutionId'
      required:
      - consentType
      - externalUserId
      - country
      additionalProperties: false
    ConsentLinkId:
      title: ConsentLinkId
      description: Unique identifier to access Pay by Bank UI for Link (UUID)
      type: string
      maxLength: 36
      minLength: 32
    ConsentId:
      title: ConsentId
      description: Unique identifier to access consent resources (UUID)
      type: string
      maxLength: 36
      minLength: 32
    ConsentLink:
      title: ConsentLink
      type: object
      description: Representation of a generated consent link.
      properties:
        consentLinkId:
          $ref: '#/components/schemas/ConsentLinkId'
        consentId:
          $ref: '#/components/schemas/ConsentId'
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
      required:
      - consentLinkId
      - consentId
    ConsentLinkResponse:
      title: ConsentLinkResponse
      description: Representation of the details necessary to start and track the consent journey.
      type: object
      allOf:
      - $ref: '#/components/schemas/ConsentLink'
      - type: object
        properties:
          consentLink:
            type: string
            description: A URL link used to initiate user interaction for granting and authorizing consent.
            format: uri
          createdAt:
            type: string
            description: The timestamp indicating when the consent initiation process was created, formatted
              in ISO 8601 format.
            format: date-time
          consentLinkExpiringAt:
            type: string
            description: The timestamp indicating when the consent link will expire, formatted in ISO
              8601 format.
            format: date-time
        required:
        - consentLink
        - createdAt
        - consentLinkExpiringAt
    TraceId:
      title: TraceId
      description: A unique identifier generated by server for tracing the request through the system.
      type: string
      minLength: 16
      maxLength: 36
      pattern: ^[-_.a-zA-Z0-9]{16,36}$
      example: ed392d86-83f3-4611-ac51-3a00442c8fc5
    ApiAdditionalContext:
      title: AdditionalContext
      type: object
      properties:
        type:
          type: string
          description: Category of the error code (EXTERNAL)
          minLength: 3
          maxLength: 20
        code:
          type: string
          description: Short code that identifies the error - publicly cataloged and documented
          minLength: 2
          maxLength: 10
        message:
          type: string
          description: Humanly readable textual description of the error
          minLength: 1
          maxLength: 200
      required:
      - type
      - code
      - message
      additionalProperties: false
    ApiErrorContext:
      title: ErrorContext
      description: The API error context object returned by the API.
      type: object
      properties:
        code:
          type: string
          description: JPMC Short code that identifies the error - publicly cataloged and documented
          minLength: 5
          maxLength: 5
        message:
          type: string
          description: Humanly readable textual description of the error
          minLength: 1
          maxLength: 200
        location:
          type: string
          description: The location of the error occurred in the request.
          enum:
          - BODY
          - PATH
          - QUERY
          - HEADER
          minLength: 1
          maxLength: 99
        field:
          type: string
          description: The field which caused the error. Where the location of error occurred is BODY
            the field would contain the JSON Path expression
          minLength: 1
          maxLength: 99
        additionalContext:
          type: array
          description: List of additional error contexts providing detailed information
          items:
            $ref: '#/components/schemas/ApiAdditionalContext'
          minItems: 0
          maximum: 10
      required:
      - message
      additionalProperties: false
    ApiError:
      title: Error
      description: The error object returned by the API.
      type: object
      properties:
        title:
          type: string
          description: Brief title describing the error
          example: Consent Processing Error
          minLength: 1
          maxLength: 128
        httpStatus:
          type: integer
          format: int32
          description: HTTP Status Code
        traceId:
          $ref: '#/components/schemas/TraceId'
        requestId:
          $ref: '#/components/schemas/RequestId'
        context:
          type: array
          description: List of error contexts providing detailed information
          items:
            $ref: '#/components/schemas/ApiErrorContext'
          minItems: 0
          maxItems: 10
      required:
      - title
      - httpStatus
      - traceId
      additionalProperties: false
    ConsentLinkInitiated:
      title: ConsentLinkInitiated
      description: Consent Link event published as part of account linking flow for consent link URL is
        generated
      type: object
      properties:
        consentLinkRequest:
          $ref: '#/components/schemas/ConsentLinkRequest'
        consentLinkResponse:
          $ref: '#/components/schemas/ConsentLinkResponse'
      required:
      - consentLinkRequest
      - consentLinkResponse
    ConsentLinkWithView:
      title: ConsentLinkCancelled
      type: object
      description: Representation of a generated consent link.
      allOf:
      - $ref: '#/components/schemas/ConsentLink'
      - type: object
        properties:
          viewName:
            type: string
            description: The view page where the user cancelled the consent link
    AdditionalContext:
      title: AdditionalContext
      type: object
      properties:
        type:
          type: string
          description: Category of the error code (EXTERNAL)
          minLength: 3
          maxLength: 20
        code:
          type: string
          description: Short code that identifies the error - publicly cataloged and documented
          minLength: 2
          maxLength: 10
        message:
          type: string
          description: Humanly readable textual description of the error
          minLength: 1
          maxLength: 200
      required:
      - type
      - code
      - message
      additionalProperties: false
    ErrorContext:
      title: ConsentErrorContext
      type: object
      properties:
        code:
          type: string
          description: JPMC Short code that identifies the error - publicly cataloged and documented
          minLength: 5
          maxLength: 5
        message:
          type: string
          description: Humanly readable textual description of the error
          minLength: 1
          maxLength: 200
        field:
          type: string
          description: The field which caused the error. Where the location of error occurred is BODY
            the field would contain the JSON Path expression
          minLength: 1
          maxLength: 99
        additionalContext:
          type: array
          description: List of additional error contexts providing detailed information
          items:
            $ref: '#/components/schemas/AdditionalContext'
          minItems: 0
          maxItems: 10
      required:
      - message
      additionalProperties: false
    Error:
      title: ConsentError
      description: Error details for consent processing issues
      type: object
      properties:
        title:
          type: string
          description: Brief title describing the error
          example: Consent Processing Error
          minLength: 1
          maxLength: 128
        traceId:
          $ref: '#/components/schemas/TraceId'
        context:
          type: array
          description: List of error contexts providing detailed information
          items:
            $ref: '#/components/schemas/ErrorContext'
          minItems: 0
          maxItems: 10
      required:
      - title
      - traceId
    ConsentLinkFailed:
      title: ConsentLinkFailed
      description: Consent Link event published as part of account linking flow for failure
      type: object
      allOf:
      - $ref: '#/components/schemas/ConsentLink'
      - type: object
        properties:
          error:
            $ref: '#/components/schemas/Error'
        required:
        - error
    ConsumerProfileId:
      title: ConsumerProfileId
      type: string
      description: Internal consumer profile identifier provided by JPMC
      minLength: 5
      maxLength: 64
    User:
      title: User
      description: Pay by Bank User
      type: object
      allOf:
      - $ref: '#/components/schemas/ExternalUserProfile'
      properties:
        consumerProfileId:
          $ref: '#/components/schemas/ConsumerProfileId'
    ConsentStatus:
      title: ConsentStatus
      type: string
      description: 'Type of consent status


        | Consent Status     | Description                                                                 |

        |:---------------------|:--------------------------------------------------------------------------|

        | `SUCCESS`            | Consent process completed successfully.                                   |

        | `PARTIAL_SUCCESS`    | Consent completed successful. Consent data retrieval partial successful.  |

        | `FAILED`             | Consent process failed.                                                   |

        | `REVOKED_BY_USER`    | Consent was revoked by the user.                                          |

        | `REVOKED_BY_CLIENT`  | Consent was revoked by the client.                                        |

        | `REVOKED_BY_SYSTEM`  | Consent was revoked by System and can not be recovered.                   |

        | `REVOKED_EXPIRED`    | Consent has expired and is no longer valid.                               |

        | `PENDING`            | Consent process is still in progress.                                     |

        '
      enum:
      - SUCCESS
      - PARTIAL_SUCCESS
      - FAILED
      - REVOKED_BY_USER
      - REVOKED_BY_CLIENT
      - REVOKED_BY_SYSTEM
      - REVOKED_EXPIRED
      - PENDING
    ConsentLinkType:
      title: ConsentLinkType
      type: string
      description: 'Type of consent link that defines how account connects.


        | Consent Link Type | Description                                       |

        |:------------------|:--------------------------------------------------|

        | `INSTANT`         | Consumer links account instantly via Open Banking.|

        | `MANUAL`          | Consumer links account manually.                  |

        '
      enum:
      - INSTANT
      - MANUAL
    ConsentBasic:
      title: ConsentBasic
      type: object
      description: Representation of a User's consent details without account information.
      properties:
        consentId:
          $ref: '#/components/schemas/ConsentId'
        referenceId:
          $ref: '#/components/schemas/ReferenceId'
        consentType:
          $ref: '#/components/schemas/ConsentType'
        externalUserId:
          $ref: '#/components/schemas/ExternalUserId'
        externalUserProfile:
          $ref: '#/components/schemas/User'
        status:
          $ref: '#/components/schemas/ConsentStatus'
        statusReason:
          type: string
          description: A detailed reason for the current status of the consent, providing additional context.
            This field is optional and may be omitted if not applicable.
          maxLength: 200
        lastUpdatedAt:
          type: string
          description: The timestamp indicating when the consent initiation process was created, formatted
            in ISO 8601 format.
          format: date-time
        clientId:
          $ref: '#/components/schemas/ClientId'
        country:
          type: string
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
          description: "ISO 3166-1 Alpha-2 Country Code representing where the consent is requested\n\n\
            \  **Supported Countries:**\n  | Region         | Country                        |\n  | :-------------\
            \ | :----------------------------- |\n  | United States  | US                            \
            \ |\n  | United Kingdom | GB                             |\n  | EU             | DE, ES, IT,\
            \ NL, AT |\n"
        locale:
          type: string
          description: 'Locale indicating the language and regional settings for the consent initiation

            '
          default: en_US
          maxLength: 5
        consentLinkType:
          $ref: '#/components/schemas/ConsentLinkType'
        error:
          $ref: '#/components/schemas/Error'
      required:
      - consentId
      - consentType
      - status
      - country
      - externalUserId
      - lastUpdatedAt
    AccountId:
      title: AccountId
      description: Internal account identifier provided by JPMC
      type: string
      maxLength: 36
      minLength: 32
    FinancialInstitution:
      title: FinancialInstitution
      description: Represents a financial institution with its name and logo.
      type: object
      properties:
        name:
          type: string
          description: Name of the financial institution.
          minLength: 2
          maxLength: 100
        logoUrl:
          type: string
          description: URL of the financial institution's logo.
          format: uri
          pattern: ^https?:\/\/[^\s$.?#].[^\s]*$
      required:
      - name
      additionalProperties: false
    USABA:
      title: USABA
      type: object
      description: Account Identifier in US Banking account number format
      required:
      - accountIdType
      properties:
        accountIdType:
          type: string
          default: USABA
        routingNumber:
          type: string
          description: Represents routing number of financial institution, that account belongs to.
          minLength: 1
          maxLength: 128
        accountNumber:
          type: string
          description: Represents account number assigned by financial institution.
          minLength: 1
          maxLength: 128
        maskedAccountNumber:
          type: string
          description: Account number assigned by financial institution in masked format e.g.  XXXXXXXXXXXX1234
          maxLength: 20
        tokenizedAccountNumber:
          type: string
          description: Tokenized representation of the US bank account number.
          minLength: 1
          maxLength: 128
      additionalProperties: false
    SORTCODE:
      type: object
      title: SORTCODE
      description: Account identifier specific to the SORT_CODE account numbering scheme.
      required:
      - accountIdType
      properties:
        accountIdType:
          type: string
          default: SORT_CODE
        accountNumber:
          type: string
          description: The account number of the account.
          minLength: 1
          maxLength: 128
        sortCode:
          type: string
          description: The sort code of the account.
          minLength: 1
          maxLength: 128
      additionalProperties: false
    IBAN:
      type: object
      title: IBAN
      description: International bank account number (**IBAN**) standard numbering system.
      required:
      - accountIdType
      properties:
        accountIdType:
          type: string
          default: IBAN
        bban:
          type: string
          description: BBAN represents a country-specific bank account number.
          minLength: 1
          maxLength: 128
        bic:
          type: string
          description: BIC bank number. This can be inferred from the IBAN, but some banks might require
            it for adding a beneficiary or will display it for existing accounts owned by the user.
          minLength: 1
          maxLength: 128
        iban:
          type: string
          description: IBAN represents an international bank account number.
          minLength: 1
          maxLength: 128
      additionalProperties: false
    AccountType:
      title: AccountType
      type: string
      description: 'Specifies the type of account.


        | Account Type   | Description            |

        |----------------|------------------------|

        | **CHECKING**   | A Checking account.    |

        | **SAVINGS**    | A Savings account.     |

        | **CREDIT_CARD**| A Credit Card account. |

        '
      enum:
      - CHECKING
      - SAVINGS
      - CREDIT_CARD
      - OTHER
    ISOCurrencyCode:
      title: ISOCurrencyCode
      description: '**Currency of the money movement**: a 3 alpha character ISO 4217 currency code.'
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      example: EUR
    AccountStatus:
      type: string
      description: Account Status
      enum:
      - ACTIVE
      - INACTIVE
      - UNKNOWN
    AccountBasic:
      title: AccountBasic
      description: Basic representation of a financial account.
      type: object
      properties:
        financialInstitution:
          $ref: '#/components/schemas/FinancialInstitution'
        accountIdentifiers:
          description: Unique account identifiers assigned by the financial institution for identification
            and transaction processing.
          type: object
          oneOf:
          - $ref: '#/components/schemas/USABA'
          - $ref: '#/components/schemas/SORTCODE'
          - $ref: '#/components/schemas/IBAN'
          discriminator:
            propertyName: accountIdType
            mapping:
              USABA: '#/components/schemas/USABA'
              SORTCODE: '#/components/schemas/SORTCODE'
              IBAN: '#/components/schemas/IBAN'
        accountType:
          $ref: '#/components/schemas/AccountType'
        currencyCode:
          $ref: '#/components/schemas/ISOCurrencyCode'
        name:
          type: string
          maxLength: 250
          description: Name of the account assigned by the account holder or by the financial institution.
            This field is typically what the user recognises in their online banking app.
        segment:
          type: string
          description: Customer segment
          enum:
          - PERSONAL
          - BUSINESS
          - UNKNOWN
        status:
          $ref: '#/components/schemas/AccountStatus'
    PartyRole:
      type: string
      enum:
      - PRIMARY
      - PRIMARY_JOINT
      - PRIMARY_JOINT_TENANTS
      - PRIMARY_BORROWER
      - SECONDARY
      - SECONDARY_JOINT
      - SECONDARY_BORROWER
      - SECONDARY_JOINT_TENANTS
      - SOLE_OWNER
      - TRUSTEE
      - UNIFORM_TRANSFER_TO_MINOR
      - AUTHORIZED_USER
      - BUSINESS
      - POWER_OF_ATTORNEY
      - FOR_BENEFIT_OF_PRIMARY
      - FOR_BENEFIT_OF_PRIMARY_JOINT_RESTRICTED
      - FOR_BENEFIT_OF_SECONDARY
      - FOR_BENEFIT_OF_SECONDARY_JOINT_RESTRICTED
      - FOR_BENEFIT_OF_SOLE_OWNER_RESTRICTED
      - OTHER
      - UNKNOWN
      description: 'The role of the party to the account.

        '
    ISOCountryCode:
      title: ISOCountryCode
      type: string
      description: ISO 3166-1 Alpha-2 Country Code
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
      example: AU
    Address:
      title: Address
      type: object
      description: Representation of an address object.
      properties:
        fullAddress:
          type: string
          description: Full Address.
          minLength: 3
          maxLength: 256
        addressType:
          type: string
          description: Type of the address.
          enum:
          - BUSINESS
          - CORRESPONDENCE
          - DELIVERY_TO
          - MAIL_TO
          - PO_BOX
          - RESIDENTIAL
          - POSTAL
          - UNKNOWN
        addressLines:
          type: array
          nullable: true
          description: Optional; if provided must contain at least one address line.
          items:
            type: string
            minLength: 1
            maxLength: 70
          minItems: 1
          maxItems: 7
        city:
          type: string
          description: City name.
          minLength: 1
          maxLength: 100
        state:
          type: string
          description: State or region name.
          minLength: 1
          maxLength: 100
        postalCode:
          type: string
          description: Postal or ZIP code.
          minLength: 1
          maxLength: 20
          pattern: ^[0-9A-Za-z\- ]+$
        countryCode:
          $ref: '#/components/schemas/ISOCountryCode'
    PartyIdentity:
      title: PartyIdentity
      type: object
      description: Representation of a party with its role, identity, and verification status.
      properties:
        name:
          type: string
          description: Party name.
          maxLength: 200
        addresses:
          type: array
          description: Addresses of the party.
          items:
            $ref: '#/components/schemas/Address'
          minItems: 0
          maxItems: 7
        emails:
          type: array
          description: Email addresses of the user.
          items:
            $ref: '#/components/schemas/Email'
          minItems: 0
          maxItems: 5
        phones:
          type: array
          description: Phone numbers of the user.
          items:
            $ref: '#/components/schemas/Phone'
          minItems: 0
          maxItems: 5
    Party:
      title: Party
      type: object
      description: Representation of a party with its role, identity, and verification status.
      properties:
        role:
          $ref: '#/components/schemas/PartyRole'
        identity:
          $ref: '#/components/schemas/PartyIdentity'
        dateOfBirth:
          type: string
          description: Date of birth of the party, ISO 8601 date format `YYYY-MM-DD`.
          format: date
        verificationStatus:
          type: string
          description: Verification status of the party.
          enum:
          - VERIFIED
          - PARTIALLY_VERIFIED
          - UNVERIFIED
          - UNKNOWN
      required:
      - identity
    Amount:
      title: Amount
      type: string
      minLength: 3
      maxLength: 18
      pattern: ^(\d{1,15})\.(\d{1,2})$
      example: '10.50'
      description: The value representation of a monetary amount. The amount value should be more than
        0.01 with maximum of two decimal places allowed.
    Value:
      title: Value
      description: Value
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/ISOCurrencyCode'
      required:
      - amount
      - currency
    Balance:
      title: Balance
      description: Balance Information
      type: object
      properties:
        balanceType:
          type: string
          description: "Balance types\n\n  | Balance Type      | Description             |\n  |:-----------------\
            \ |:------------------------|\n  | BOOKED_BALANCE    | The current balance of the account\
            \ at the end of an account reporting period|\n  | AVAILABLE_BALANCE | The amount of funds\
            \ the customer is able to withdraw from the account|"
          enum:
          - BOOKED_BALANCE
          - AVAILABLE_BALANCE
        value:
          $ref: '#/components/schemas/Value'
        lastRefreshedAt:
          type: string
          format: date-time
          description: The timestamp of when the balance data was last refreshed.
      required:
      - balanceType
      - value
      additionalProperties: false
    AccountDetail:
      title: AccountDetail
      description: Consented accounts details
      type: object
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        account:
          $ref: '#/components/schemas/AccountBasic'
        parties:
          type: array
          description: List of parties associated with the account.
          items:
            $ref: '#/components/schemas/Party'
          minItems: 0
          maxItems: 5
        balances:
          type: array
          description: List of balances associated with the account.
          items:
            $ref: '#/components/schemas/Balance'
          minItems: 0
          maxItems: 2
      required:
      - accountId
    ConsentDetail:
      title: Consent
      description: Representation of a User's consent detail with account information.
      type: object
      allOf:
      - $ref: '#/components/schemas/ConsentBasic'
      - type: object
        properties:
          accounts:
            type: array
            description: List of accounts associated with the consent.
            items:
              $ref: '#/components/schemas/AccountDetail'
            minItems: 1
            maxItems: 10
    WebHook:
      title: AccountInformationServiceNotification
      description: Webhook Data
      type: object
      required:
      - notificationId
      - notificationType
      - notificationSubType
      - messageCreateTimestamp
      - clientId
      - accountInformationServiceNotification
      properties:
        notificationType:
          type: string
          description: Notification type
          enum:
          - accountInformationServiceNotification
          default: accountInformationServiceNotification
        notificationId:
          type: string
          description: Unique Notification Identifier
        notificationSubType:
          type: string
          description: Type of notification being published
          enum:
          - ConsentLinkInitiated
          - ConsentLinkOpened
          - ConsentLinkSuccessful
          - ConsentLinkCancelled
          - ConsentLinkExpired
          - ConsentLinkAbandoned
          - ConsentLinkPending
          - ConsentLinkFailed
          - ConsentSuccessful
          - ConsentFailed
          - ConsentRevoked
          - ConsentPending
          - ConsentReadyToValidate
          - ConsentFixSuccessful
          - ConsentFixFailed
        messageCreateTimestamp:
          description: Notification occurrence timestamp. An RFC-3339 compliant date-time format.
          type: string
          format: date-time
        clientId:
          type: string
          description: Client identifier
        platformId:
          type: string
          description: Platform identifier
        accountInformationServiceNotification:
          type: object
          description: Account Information Service Notification event data
          oneOf:
          - title: Consent Link Initiated Event
            type: object
            required:
            - consentLinkInitiated
            properties:
              consentLinkInitiated:
                $ref: '#/components/schemas/ConsentLinkInitiated'
          - title: Consent Link Opened Event
            type: object
            required:
            - consentLinkOpened
            properties:
              consentLinkOpened:
                $ref: '#/components/schemas/ConsentLink'
          - title: Consent Link Successful Event
            type: object
            required:
            - consentLinkSuccessful
            properties:
              consentLinkSuccessful:
                $ref: '#/components/schemas/ConsentLink'
          - title: Consent Link Cancelled Event
            type: object
            required:
            - consentLinkCancelled
            properties:
              consentLinkCancelled:
                $ref: '#/components/schemas/ConsentLinkWithView'
          - title: Consent Link Expired Event
            type: object
            required:
            - consentLinkExpired
            properties:
              consentLinkExpired:
                $ref: '#/components/schemas/ConsentLink'
          - title: Consent Link Abandoned Event
            type: object
            required:
            - consentLinkAbandoned
            properties:
              consentLinkAbandoned:
                $ref: '#/components/schemas/ConsentLinkWithView'
          - title: Consent Link Pending Event
            type: object
            required:
            - consentLinkPending
            properties:
              consentLinkPending:
                $ref: '#/components/schemas/ConsentLink'
          - title: Consent Link Failed Event
            type: object
            required:
            - consentLinkFailed
            properties:
              consentLinkFailed:
                $ref: '#/components/schemas/ConsentLinkFailed'
          - title: Consent Successful Event
            type: object
            required:
            - consentSuccessful
            properties:
              consentSuccessful:
                $ref: '#/components/schemas/ConsentDetail'
          - title: Consent Failed Event
            type: object
            required:
            - consentFailed
            properties:
              consentFailed:
                $ref: '#/components/schemas/ConsentBasic'
          - title: Consent Revoked Event
            type: object
            required:
            - consentRevoked
            properties:
              consentRevoked:
                $ref: '#/components/schemas/ConsentBasic'
          - title: Consent Fix Successful Event
            type: object
            required:
            - consentFixSuccessful
            properties:
              consentSuccessful:
                $ref: '#/components/schemas/ConsentDetail'
          - title: Consent Fix Failed Event
            type: object
            required:
            - consentFixFailed
            properties:
              consentFailed:
                $ref: '#/components/schemas/ConsentBasic'
          - title: Consent Pending Event
            type: object
            required:
            - consentPending
            properties:
              consentPending:
                $ref: '#/components/schemas/ConsentDetail'
          - title: Consent Ready To Validate Event
            type: object
            required:
            - consentReadyToValidate
            properties:
              consentReadyToValidate:
                $ref: '#/components/schemas/ConsentDetail'
    ConsentRenew:
      type: object
