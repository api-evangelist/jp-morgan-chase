      - transactions
    ConsentIncludes:
      title: Includes
      type: string
      description: "Option to retrieve either the complete set or specific portions of the consented information.\n\
        \n |View                   |Description                                                      \
        \                       |\n |:----------------------|:-------------------------------------------\
        \ -------------------------------------------|\n |FULL                   |Retrieve full details\
        \ of authorized accounts                                            |\n |ACCOUNT             \
        \   |Retrieve basic details of authorized accounts                                           |\n\
        \ |PARTIES                |Retrieve all account parties and their corresponding roles        \
        \                      |\n |BALANCES               |Retrieve the balances of active accounts|\n"
      enum:
      - FULL
      - ACCOUNT
      - PARTIES
      - BALANCES
    AccountView:
      type: array
      items:
        $ref: '#/components/schemas/ConsentIncludes'
      minItems: 0
      maxItems: 3
    AccountInformation:
      title: AccountInformation
      description: Account Information account , balances, etc....
      type: object
      properties:
