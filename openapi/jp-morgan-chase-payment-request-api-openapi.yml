          format: date-time
        paymentDate.lte:
          type: string
          description: Lesser-or-equal to actual payment date. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC
          format: date-time
        amount.gte:
          description: Greater-or-equal to payment request amount
