          maxLength: 18
          pattern: ^(\d{1,15})\.(\d{2})$
        amount.lte:
          description: Lesser-or-equal to payment request amount
          type: string
          minLength: 3
          maxLength: 18
          pattern: ^(\d{1,15})\.(\d{2})$
        status:
          description: Search by request status
