  schemas:
    UnstructuredInformation:
      type: object
      title: UnstructuredInformation
      description: Unstructured information about request
      properties:
        valueType:
          type: string
          description: Information type
          maxLength: 50
        text:
          type: string
          description: Information text
          maxLength: 200
    UnstructuredAddress:
      type: array
      description: "Unstructured Address\n\n  |Markets                     |Description                                                            |\n  |:--------------------------|:----------------------------------------------------------------------|\n  |Brazil                     |<ul><li>`Debtor`: Applicable for Dynamic QR Codes with due date expiration</li><li>`Creditor`: Applicable only for Dynamic QR Codes</li></ul>|\n  |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |\n"
      minItems: 1
      maxItems: 7
      items:
        type: string
        minLength: 1
        maxLength: 70
    Discount:
      title: Discount
      description: "Parameters to calculate discount based on actual payments \n\n|Markets                     |Description                                                            |\n|:--------------------------|:----------------------------------------------------------------------|\n|Brazil                     |Applicable for Dynamic QR Codes with due date expiration |\n|Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                         |\n"
      type: object
      properties:
        days:
          description: Days to consider for discount calculation
          type: string
          enum:
          - CALENDAR_DAYS
          - BUSINESS_DAYS
        cutOffDetails:
          description: For discount type is FIXED_TO_DATE or PERCENTAGE_TO_DATE, up to 3 cut-off days and amounts/percentages for each cut-off date can be provided
          type: array
          items:
            $ref: '#/components/schemas/CutOffItem'
          minItems: 0
          maxItems: 3
        percentage:
          description: "Discount expressed as percentage. Applicable for discount type \"ADVANCE_PAYMENT\" or \"PAYMENT_TO_DUE_PERCENTAGE\"\n  ** Note: Discount can be specified either as percentage or amount\n"
          $ref: '#/components/schemas/Percentage'
        amount:
          description: 'Discount expressed as fixed amount. Applicable for discount type "ADVANCE_PAYMENT" or "PAYMENT_TO_DUE_PERCENTAGE"

            ** Note: Discount can be specified either as percentage or amount

            '
          $ref: '#/components/schemas/Amount'
    Penalty:
      title: Penalty
      description: 'Penalty details expressed as a fixed value or percentage of payment amount


        |Markets                     |Description                                                            |

        |:--------------------------|:----------------------------------------------------------------------|

        |Brazil                     |Applicable for Dynamic QR Codes with due date expiration |

        |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |'
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        percentage:
          $ref: '#/components/schemas/Percentage'
    Error:
      type: object
      title: Error
      description: Common error model
      properties:
        title:
          type: string
          title: Short humanly-readable title of the error
          minLength: 1
          maxLength: 100
        httpStatus:
          type: integer
          default: 400
          title: ' HTTP Status Code'
        traceId:
          type: string
          title: JPM Assigned traced identifier
        requestId:
          type: string
          title: The 'client originated' requestId
        context:
          type: array
          title: Provides additional context and detail on the validation errors
          items:
            $ref: '#/components/schemas/ErrorContext'
          minItems: 0
          maxItems: 100
      required:
      - title
      readOnly: true
    EndToEndId:
      title: EndToEndId
      type: string
      minLength: 1
      maxLength: 128
      description: 'End to end Id used to identify Payments against a Payment Request

        |Markets                       |Description                                                        |

        |:-----------------------------|:------------------------------------------------------------------|

        |Brazil                        |Does Not Apply |

        |Singapore,<br>Hong&nbsp;Kong   |End to End Id (customer''s reference) provided by customer for QR code generation. If not provided by customer, will be generated by J.P. Morgan. Will generally appear as EndToEndId of the incoming payment for the QR code.|

        '
    Percentage:
      description: The value representation of a percentage. The percentage value should be between 0.01 and 99.99 with maximum of two decimal places allowed
      type: string
      minLength: 3
      maxLength: 5
      pattern: ^(\d{1,2})\.(\d{2})$
      example: '10.50'
    CutOffItem:
      title: CutOffItem
      description: Cutoff limit to calculate discount, expressed as a date and applicable discount in percentage or fixed amount
      type: object
      properties:
        cutOffDate:
          type: string
          format: date
          description: Cutoff date
        percentage:
          description: "Discount expressed as percentage\n  ** Note: Discount can be specified either as percentage or amount\n"
          $ref: '#/components/schemas/Percentage'
        amount:
          description: 'Discount expressed as fixed amount

            ** Note: Discount can be specified either as percentage or amount

            '
          $ref: '#/components/schemas/Amount'
    CursorId:
      type: string
      minLength: 1
      maxLength: 50
    QRCode:
      title: QRCode
      description: Representation of QR Code metadata
      allOf:
      - $ref: '#/components/schemas/QRCodeImage'
      - $ref: '#/components/schemas/QRCodeMetaData'
    Status:
      type: string
      description: "Payment request and associated  QR code status depicting the current status \n|Value          |Description                                       |        \n|:--------------|:-------------------------------------------------|\n|ACTIVE         | Payment Request captured but not settled          | \n|PROCESSING       | Payment is being processed          | \n|SETTLED        | Payment Request captured and payment settled      | \n|EXPIRED | Payment Request expired| \n|CANCELLED| Payment Request cancelled |"
      enum:
      - ACTIVE
      - PROCESSING
      - SETTLED
      - EXPIRED
      - CANCELLED
    ExpiresAt:
      title: ExpiresAt
      description: 'Specify a datetime stamp in valid RFC 3339 section 5.6, ISO 8601 compliant format for expiration.

        E.g., `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC


        |Markets                     |Description                                                        |

        |:--------------------------|:------------------------------------------------------------------|

        |Brazil                     |Applicable for Payment Response object, calculated from Duration |

        |Singapore                  |Mandatory for Dynamic QR. Optional for Static QR. |

        |Hong&nbsp;Kong                  |Mandatory for Dynamic QR. Not supported for Static QR. |'
      type: string
      format: date-time
    SearchCriteria:
      title: SearchCriteria
      description: 'Payment Requests search criteria

        '
      type: object
      required:
      - createdDate.gte
      - createdDate.lte
      properties:
        createdDate.gte:
          type: string
          description: Greater-or-equal to payment request created date. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC
          format: date-time
        createdDate.lte:
          type: string
          description: Lesser-or-equal to payment request created date. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC
          format: date-time
        country:
          type: string
          description: 'ISO 3166-1 Alpha-2 country code


