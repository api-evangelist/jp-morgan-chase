      properties:
        address:
          type: string
          description: 'The email address


            |Markets                     |Description                                                            |

            |:--------------------------|:----------------------------------------------------------------------|

            |Brazil                     |<ul><li>`Debtor` : Applicable for Dynamic QR Codes with due date expiration</li></ul>|

            |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |

            '
        type:
          description: 'The email type


            |Markets                     |Description                                                            |

            |:--------------------------|:----------------------------------------------------------------------|

            |Brazil                     |<ul><li>`Debtor` : Applicable only for Dynamic QR Codes with due date expiration</li></ul>|

            |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |

            '
          type: string
          default: PRIMARY
          enum:
          - PRIMARY
          - SECONDARY
          - OTHER
          - UNKNOWN
    Duration:
      description: 'Specify how long (in seconds) the request is valid. ISO 8601 compliant duration.

        E.g., a validity of 5 minutes will be represented as 300. If duration unspecified,

        a default duration of 86400 seconds (i.e 24 hours) will be considered


        |Markets                     |Description                                                        |

        |:--------------------------|:------------------------------------------------------------------|

        |Brazil                     |Applicable and mandatory only for Dynamic - IMMEDIATE QR Codes     |

        |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply.    |'
      type: integer
      format: int32
      minimum: 0
      maximum: 999999
    PaymentLinkAlternateIdentifier:
      title: alternateIdentifier
      type: integer
      format: int64
      description: 'Numeric identifier required by some markets


        |MARKET | Description                               |

        |:------|:------------------------------------------|

        |BRAZIL | Requires generation of numeric identifier |

        |SINGAPORE | Does not Apply |'
      example: 12345
    PaymentRequestUpdate:
      title: PaymentRequestUpdate
      description: 'Payment Request Update Request


        |Market     |Description                                                        |

        |:--------------------------|:------------------------------------------------------------------|

        |Singapore                     |Does Not Apply  |'
      type: object
      required:
      - request
      - requestMethodType
      properties:
        country:
          $ref: '#/components/schemas/ISOCountryCode'
        request:
          $ref: '#/components/schemas/PaymentRequest'
        requestMethodType:
          $ref: '#/components/schemas/RequestMethodType'
        requestMethod:
          $ref: '#/components/schemas/QRCodeRequest'
    Return:
      title: Return
      description: Return details of Payment Request
      type: object
      properties:
        id:
          type: string
          description: 'Return identifier '
        referenceId:
          type: string
          description: 'Client provided reference identifier for the return '
        currency:
          description: Return Currency
          $ref: '#/components/schemas/ISOCountryCode'
        amount:
          description: Return amount
          $ref: '#/components/schemas/Amount'
        type:
          description: 'Return Type


            |Value|Description|

            |:---------------|:-----------------------------------------------------|

            |USER_REQUEST|Return is requested by the receiving user|

            |OPERATIONAL|Return occurred due to an operational failure|

            |FRAUD|Return occurred due to a well-founded suspicion of fraud |

            '
          type: string
          enum:
          - USER_REQUEST
          - OPERATIONAL
          - FRAUD
        description:
          type: string
          description: Description indicating why the refund was initiated
          maxLength: 140
        createdAt:
          type: string
          format: date-time
          description: Date and time when the return was created
        settledAt:
          type: string
          format: date-time
          description: Date and time when the return was settled
        status:
          description: 'Return Status


            |Value|Description|

            |:---------------|:-----------------------------------------------------|

            |PENDING|Return is pending|

            |SUCCESS|Return completed successfully|

            |FAILED|Return has failed|

            '
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
        statusReason:
          type: string
          description: Reason for the return status
          maxLength: 140
    PaymentRequest:
      title: PaymentRequest
      description: Payment Request details
      type: object
      required:
      - creditor
      properties:
        debtor:
          $ref: '#/components/schemas/Debtor'
        creditor:
          $ref: '#/components/schemas/Creditor'
        expirationType:
          $ref: '#/components/schemas/ExpirationType'
        paymentDueDate:
          type: string
          format: date
          description: 'Payment Due Date. Format - `YYYY-MM-DD`

            |Markets                     |Description                                                        |

            |:--------------------------|:------------------------------------------------------------------|

            |Brazil                     |Applicable and mandatory only for Dynamic - Due Date QR Codes |

            |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |'
        duration:
          $ref: '#/components/schemas/Duration'
        expiresAt:
          $ref: '#/components/schemas/ExpiresAt'
        gracePeriod:
          type: integer
          format: int32
          description: 'Number of consecutive calender days after payment due date, by which

            payment can be still be made. Beyond this date, QR code will be expired

            and it impacts any applicable discounts and might results in penalty


            |Markets                     |Description                                                        |

            |:--------------------------|:------------------------------------------------------------------|

            |Brazil                     |Applicable for Dynamic QR Code with due date expiration            |

            |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |'
        currency:
          description: Payment Request currency code. All the amounts for this request considered in this currency.
          $ref: '#/components/schemas/ISOCurrencyCode'
        paymentAmount:
          $ref: '#/components/schemas/Amount'
        isAmountAdjustable:
          type: boolean
          description: 'If this value is true, it allows debtor to pay a different amount than the

            original payment amount specified by the creditor


            |Markets                     |Description                                                        |

            |:--------------------------|:------------------------------------------------------------------|

            |Brazil                     |Applicable for Dynamic QR code with Immediate expiration;           |

            |Singapore,<br>Hong&nbsp;Kong                  |Applicable for Dynamic or Static QR code when Payment amount is provided           |


            |Markets                     |Default Value                                                        |

            |:--------------------------|:------------------------------------------------------------------|

            |Brazil                     |false           |

            |Singapore,<br>Hong&nbsp;Kong                  |true           |'
        interestType:
          $ref: '#/components/schemas/InterestType'
        interestParameters:
          $ref: '#/components/schemas/Interest'
        discountType:
          $ref: '#/components/schemas/DiscountType'
        discountParameters:
          $ref: '#/components/schemas/Discount'
        penaltyType:
          $ref: '#/components/schemas/ValueType'
        penaltyParameters:
          $ref: '#/components/schemas/Penalty'
        reductionType:
          $ref: '#/components/schemas/ValueType'
        reductionParameters:
          $ref: '#/components/schemas/Reduction'
        reference:
          $ref: '#/components/schemas/Reference'
        additionalInformation:
          type: array
          description: 'Additional information provided by the client for the Payment Request

            expressed as array of key/value pairs


            |Markets                     |Description                                                        |

            |:--------------------------|:------------------------------------------------------------------|

            |Brazil                     |Applicable only for Dynamic QR Codes                               |

            |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |'
          minItems: 0
          maxItems: 50
          items:
            $ref: '#/components/schemas/UnstructuredInformation'
          example:
          - valueType: Obs
            text: This bill can be paid after the due date
    Creditor:
      type: object
      title: Creditor
      description: Creditor details
      properties:
        account:
          $ref: '#/components/schemas/AlternateAccountDetails'
        name:
          type: string
          description: 'Name of creditor


            |Markets                     |Description                                                           |

            |:--------------------------|:---------------------------------------------------------------------|

            |Brazil                     |Maximum of 25 characters allowed                                      |

            |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |

            '
          maxLength: 500
        shortName:
          type: string
          description: 'Company short name


            |Markets                     |Description                                                           |

            |:--------------------------|:---------------------------------------------------------------------|

            |Brazil                     |Applicable only for Dynamic - Due Date QR Codes                       |

            |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |

            '
          maxLength: 500
        address:
          description: 'Creditor''s address

            '
          allOf:
          - $ref: '#/components/schemas/Address'
        taxInformation:
          $ref: '#/components/schemas/CreditorTaxInformation'
    PaymentLinkId:
      title: id
      type: string
      description: Unique payment link identifier generated by JPM
      minLength: 0
      maxLength: 128
      example: 253f67f3-b640-44cb-aabd-2cc348b52678
    DebtorTaxInformation:
      type: object
      title: DebtorTaxInformation
      description: 'Debtor tax details


        |Markets                     |Description                                                            |

        |:--------------------------|:----------------------------------------------------------------------|

        |Brazil                     |Applicable only for Dynamic QR codes. Mandatory for Dynamic - Due Date QR Codes|

        |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |

        '
      properties:
        taxpayerCategory:
          type: string
          description: Tax payer category
          enum:
          - INDIVIDUAL
          - CORPORATE
        taxId:
          type: string
          description: 'Tax Identifier


            Maximum lengths allowed per market :-

            |Markets                     |Description                                                        |

            |:--------------------------|:------------------------------------------------------------------|

            |Brazil                     |Individual - CPF: 11  , CORPORATE - CNPJ: 14                       |

            |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |

            '
    CancellationRequest:
      title: CancellationRequest
      description: Payment Request cancellation request
      type: object
      required:
      - reason
      properties:
        reason:
          type: string
          description: Reason for cancellation
          default: Client Request
        metaData:
          type: array
          minItems: 0
          maxItems: 10
          items:
            $ref: '#/components/schemas/UnstructuredInformation'
    Reduction:
      title: Reduction
      description: 'Reduction details expressed either as a fixed value or percentage of payment

        amount


        |Markets                     |Description                                                            |

        |:--------------------------|:----------------------------------------------------------------------|

        |Brazil                     |Applicable for Dynamic QR Codes with due date expiration |

        |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |'
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        percentage:
          $ref: '#/components/schemas/Percentage'
    PaymentLink:
      title: PaymentLink
      type: object
      description: 'The payment link is a URL hosted at the receiver''s PSP. This is invoked by the

        payer''s PSP to retrieve associated QR Code details


        | Market | Description                                    |

        |:-----  |:-----------------------------------------------|

        |Brazil  |Associated to a QR code using a PIX URL format per Brazil Central Bank rules|

        |Singapore  |Does not Apply|

        '
      properties:
        id:
          $ref: '#/components/schemas/PaymentLinkId'
        alternateIdentifier:
          $ref: '#/components/schemas/PaymentLinkAlternateIdentifier'
        expirationType:
          $ref: '#/components/schemas/ExpirationType'
        country:
          description: Payment requested for country / market
          $ref: '#/components/schemas/ISOCountryCode'
        url:
          type: string
          description: 'Payment Service Provider''s (PSP) hosted payment resource, where customer

            can pay for services / goods


            example: pix.jpmchase.com/qr/v2/2353c790eefb11eaadc10242ac120002


            |MARKET | Url Format                                                                                                                                                                          |

            |:------|:------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|

            |BRAZIL | <ul><li>Immediate pay: https://{FQDN}/{pixEndpoint}/{pixUrlAccessToken}</li><li>Pay by due date: https://{FQDN}/{pixEndpoint}/cobv/{pixUrlAccessToken}</li></ul>         |

            '
          format: uri
        createdAt:
          type: string
          format: date-time
          description: 'Payment Link/location creation timestamp. Format -

            `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC

            '
        paymentRequestId:
          $ref: '#/components/schemas/PaymentRequestId'
  parameters:
    RevisionNumber:
      name: revisionNumber
      in: query
      description: Payment request revision number. If unspecified, API will return Payment Request details with the latest revision
      schema:
        $ref: '#/components/schemas/RevisionNumber'
      required: false
    PaymentRequestId:
      name: id
      in: path
      description: 'Unique transaction identifier provided by <mark>client</mark> or identifier generated by <mark>JPM</mark>


        |Markets     |Description                                                        |

        |:--------------------------|:------------------------------------------------------------------|

        |Brazil                     |<ul><li>Mandatory field</li><li>For Static QR Codes Minimum Length: 1 characters , Maximum Length:  25 characters</li><li>For Dynamic QR Codes Minimum Length: 26 characters , Maximum Length:  35 characters</li></ul>   |

        |Singapore,<br>Hong&nbsp;Kong                  |<ul><li>Mandatory field</li><li>For Static and Dynamic QR Codes Maximum Length:  35 characters</li></ul>   |'
      schema:
        $ref: '#/components/schemas/PaymentRequestId'
      required: true
      examples:
        ImmediatePaymentRequestBR:
          summary: Payment Request identifier with Dynamic QR Code and immediate expiry - Brazil market
          value: 1062ad7dee5c4611962733d4ce5cf9c9
        DueDatePaymentRequestBR:
          summary: Payment Request identifier with Dynamic QR Code and  due date expiry - Brazil market
          value: 05df6aaa4fea44128795a1d42b5e3e45
        StaticQRCodeBR:
          summary: Payment Request identifier with Static QR Code - Brazil market
          value: 9e9ea51f07874f3eb3bba60017280a93
    PaymentRequestIdPutOnly:
      name: id
      in: path
      description: 'Unique transaction identifier provided by <mark>client</mark> or identifier generated by <mark>JPM</mark>


        |Market     |Description                                                        |

        |:--------------------------|:------------------------------------------------------------------|

        |Brazil                     |<ul><li>Mandatory field</li><li>For Static QR Codes Minimum Length: 1 characters , Maximum Length:  25 characters</li><li>For Dynamic QR Codes Minimum Length: 26 characters , Maximum Length:  35 characters</li></ul>   |'
      schema:
        $ref: '#/components/schemas/PaymentRequestId'
      required: true
      examples:
        ImmediatePaymentRequestBR:
          summary: Payment Request identifier with Dynamic QR Code and immediate expiry - Brazil market
          value: 1062ad7dee5c4611962733d4ce5cf9c9
        DueDatePaymentRequestBR:
          summary: Payment Request identifier with Dynamic QR Code and  due date expiry - Brazil market
          value: 05df6aaa4fea44128795a1d42b5e3e45
        StaticQRCodeBR:
          summary: Payment Request identifier with Static QR Code - Brazil market
          value: 9e9ea51f07874f3eb3bba60017280a93
    IfMatch:
      name: If-Match
      description: JPM created ETag - An opaque version identifier for the resource
      in: header
      schema:
        type: string
        minLength: 1
        maxLength: 100
      required: false
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Client generated unique idempotency key used in recognizing consecutive retries of the same request


        **V4 UUIDs are recommended**'
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
      required: false
  requestBodies:
    PaymentRequestSearchRequest:
      required: true
      description: "Payment Request search\n\n*Note*: \n  - Maximum permissible date range: **one month**\n  - Maximum historical data access: Up to **one year** from the current date\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchCriteria'
          examples:
            PaymentRequestsSearchBR:
              $ref: '#/components/examples/PaymentRequestSearchBR'
            PaymentRequestsSearchSG:
              $ref: '#/components/examples/PaymentRequestSearchSG'
    PaymentRequest:
      required: true
      description: Payment Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NewPaymentRequest'
          examples:
            DueDatePaymentRequestBR:
              $ref: '#/components/examples/DynamicQRDueDateRequestBR'
            ImmediatePaymentRequestBR:
              $ref: '#/components/examples/DynamicQRImmediateRequestBR'
            ImmediatePaymentRequestWithDefaultsBR:
              $ref: '#/components/examples/DynamicQRImmediateRequestWithDefaultsBR'
            StaticQRCodeBR:
              $ref: '#/components/examples/StaticQRCodeRequestBR'
            StaticQRCodeSG without Expiration:
              $ref: '#/components/examples/StaticQRCodeRequestSG'
            StaticQRCodeSG with Expiration:
              $ref: '#/components/examples/ScheduledStaticQRCodeRequest'
            DynamicQRCodeSG with Expiration:
              $ref: '#/components/examples/ScheduledDynamicQRCodeRequest'
    PaymentRequestUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentRequestUpdate'
          examples:
            ImmediatePaymentRequestBR:
              $ref: '#/components/examples/DynamicQRImmediateUpdateRequestBR'
            DueDatePaymentRequestBR:
              $ref: '#/components/examples/DynamicQRDueDateUpdateRequestBR'
            StaticQRCodeBR:
              $ref: '#/components/examples/StaticQRUpdateRequestBR'
    PaymentRequestCancellationRequest:
      required: true
      description: Dynamic QR code Payment Request (Due Date) cancellation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CancellationRequest'
          examples:
            DueDatePaymentRequestBR:
              $ref: '#/components/examples/PaymentRequestCancellationRequestBR'
            ImmediatePaymentRequestBR:
              $ref: '#/components/examples/PaymentRequestCancellationRequestBR'
            StaticQRCodeBR:
              $ref: '#/components/examples/PaymentRequestCancellationRequestBR'
            StaticQRCodeSG:
              $ref: '#/components/examples/PaymentRequestCancellationRequestSG'
            DynamicQRCodeSG:
              $ref: '#/components/examples/PaymentRequestCancellationRequestSG'
x-jpmc-securityDefinitions:
  MutualTLS:
    type: x509
    description: Mutual TLS authentication using client and server certificates.
x-jpmc-security:
- MutualTLS
