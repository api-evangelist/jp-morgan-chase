        image:
          type: string
          description: QRCode image binary contents with Base64 encoding
        mimeType:
          type: string
          description: QRCode image MIME type
          default: image/png
        imageWidth:
          type: integer
          format: int32
          description: Actual QR code image width in pixels
    ExpirationType:
      title: ExpirationType
      description: 'Payment request expiration type

        |Markets                     |Description                                                        |

        |:--------------------------|:------------------------------------------------------------------|

        |Brazil                     |IMMEDIATE, DUE-DATE apply for Dynamic QR Codes                |

        |Singapore                  |Provide SCHEDULED if expiry date/time is provided in expiresAt. Mandatory for Dynamic QR. Optional for Static QR.                             |

        |Hong&nbsp;Kong                  |Provide SCHEDULED if expiry date/time is provided in expiresAt. Mandatory for Dynamic QR. Not supported for Static QR. |'
      type: string
      enum:
      - IMMEDIATE
      - DUE_DATE
      - SCHEDULED
    IdempotencyKey:
      title: Idempotency Key
      description: A unique string that enables API support idempotency by safely retrying requests without accidentally performing the same operation twice
      type: string
      minLength: 36
      maxLength: 36
      pattern: ^[-_.a-zA-Z0-9]{36}$
      example: 1b036f9c-8c84-4ce6-b1dd-5979472945a1
    InterestType:
      description: 'Interest type


        |Markets                     |Description                                                            |

        |:--------------------------|:----------------------------------------------------------------------|

        |Brazil                     |Applicable only for Dynamic - Due Date QR Codes|

        |Singapore,<br>Hong&nbsp;Kong                  |Does not Apply                                                        |


        |Value               |Description                                                                             |

        |:-------------------|:---------------------------------------------------------------------------------------|

        |NOT_APPLICABLE      |Interest not applicable                                                                 |

        |AMOUNT              |Fixed Amount of interest                                                                |

        |PERCENTAGE_PER_DAY  |Rate of Interest / day                                                                  |

        |PERCENTAGE_PER_MONTH|Rate of Interest / month                                                                |

        |PERCENTAGE_PER_YEAR |Rate of Interest / year                                                                 |'
      type: string
      enum:
      - NOT_APPLICABLE
      - AMOUNT
      - PERCENTAGE_PER_DAY
      - PERCENTAGE_PER_MONTH
      - PERCENTAGE_PER_YEAR
    PageSize:
      type: integer
      format: int32
      minimum: 1
      maximum: 99
      default: 10
      description: Pagination limit for normal sized payload elements
    RevisionNumber:
      type: integer
      format: int32
      description: Payment request revision number
      minimum: 0
      maximum: 100
    PaymentRequestId:
      title: PaymentRequestId
      type: string
      description: 'Unique transaction identifier provided by <mark>client</mark> or identifier generated by <mark>JPM</mark>


        |Market     |Description                                                        |

        |:--------------------------|:------------------------------------------------------------------|

        |Brazil                     |<ul><li>Mandatory field</li><li>For Static QR Codes Minimum Length: 1 characters , Maximum Length:  25 characters</li><li>For Dynamic QR Codes Minimum Length: 26 characters , Maximum Length:  35 characters</li></ul>   |

        |Singapore                  |<ul><li>Mandatory field</li><li>For Static and Dynamic QR Codes Maximum Length:  35 characters</li></ul>   |

        |HongKong                   |<ul><li>Mandatory field</li><li>For Static and Dynamic QR Codes Maximum Length:  35 characters</li></ul>   |'
      minLength: 1
      maxLength: 36
    PaymentRequestCollection:
