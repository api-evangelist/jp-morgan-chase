              type: string
              description: 'ISO 3166-1 Alpha-2 country code


                |Markets     |Country ISO Code     |Description                                                        |

                |:----------|:--------------------|:------------------------------------------------------------------|

                |Brazil     |BR                     | ISO Country Code for the Market, Mandatory |

                |Singapore  |SG                  | ISO Country Code for the Market, Not Applicable |

                |Hong&nbsp;Kong  |HK                  | ISO Country Code for the Market, Not Applicable |'
              minLength: 2
              maxLength: 2
              pattern: ^[A-Z]{2}$
              example: AU
        paymentLinkStatus:
          description: Search by payment link status (whether the qr is linked to a payment link or not)
          type: string
          enum:
          - LINKED
          - NOT_LINKED
        pageSize:
          $ref: '#/components/schemas/PageSize'
    QRCodeImage:
      title: QRCodeImage
