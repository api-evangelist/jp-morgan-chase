      pattern: '[A-Za-z0-9 .-]*'
      minLength: 1
      maxLength: 40
    transactionTimestamp:
      description: Designates the date and time in UTC timezone, on which the original sale or refund
        transaction was performed. The format is YYYY-MM-DDTHH:MM:SSZ.
      type: string
      format: date-time
    authorizationTimestamp:
