    transactionId:
      type: string
      description: The transaction identifier of the original transaction.
      example: '1707071808295'
      maxLength: 36
    submitterPlatformId:
      type: string
      description: Identifies the platform used to facilitate the request of the transaction that is being
        disputed.
      example: '2179821798'
      maxLength: 20
    companyId:
      description: Identifies a unique entity which represents a relationship at the highest of the three
        levels of the account hierarchy of the backend proprietary merchant acquiring processing platform.
        Complex organizations may be represented by grouping multiple company identifiers. The full hierarchy
        consists of company identifier, business unit identifier, and transaction division identifier.
        Reserved for future use. Currently not active.
      type: string
      pattern: ^\d+$
      minLength: 1
      maxLength: 12
    merchantId:
      description: Identifies a unique entity for transaction processing at the lowest level of the account
        hierarchy of the backend proprietary merchant acquiring processing platform. This level organizes
        transaction types for submission, funding, and reporting.
      type: string
      pattern: ^\d+$
      minLength: 1
      maxLength: 12
    companyName:
      description: The label given to a unique entity which represents a relationship at the highest of
        the three levels of the account hierarchy of the back-end proprietary merchant acquiring processing
        platform. Complex organizations may be represented by grouping multiple company identifiers. The
        full hierarchy consists of company identifier, business unit identifier, and transaction division
        identifier. Reserved for future use. Currently not active.
      type: string
      maxLength: 80
    merchantName:
      description: The label given to a unique entity for transaction processing at the lowest level of
        the account hierarchy of the backend proprietary merchant acquiring processing platform. This
        level organizes transaction types for submission, funding, and reporting.
      type: string
      maxLength: 80
    authorizationReferenceNumber:
      description: Identifies a reference number generated at debit card transaction time.
      type: string
      maxLength: 8
    issuerDocumentCode:
      description: "Codifies a document is required by the payment network from the issuer for a disputed\
        \ transaction. If this is set to 1, expect an issuer document arrival in next few days depending\
        \ on payment brand. You can check the issuer document availability using our \"documents\" API\
        \ endpoint.  Sample Values: 0-\tNo Chargeback Documentation Provided by issuer. 1-\tSupporting\
        \ document will be provided by issuer. 2-\tNo Documents required by issuer. 3-\tDocuments are\
        \ required by issuer. 4-\tNon Receipt of required documents by issuer.'"
      type: integer
      format: int32
      deprecated: true
    issuerDocumentExpected:
      description: 'Codifies a document is required by the payment network from the issuer for a disputed
        transaction. If this is set to true, expect an issuer document arrival in next few days depending
        on payment brand. You can check the issuer document availability using our "documents" API endpoint.  Sample
        Values: true - Chargeback Documentation will be provided by issuer. false - No Chargeback Documentation
        will be provided by issuer.'
      type: boolean
      example: true
    issuerDocumentReceived:
      description: 'Codifies a document is received by the payment network from the issuer for a disputed
        transaction. If this is set to true, an issuer document is received from the payment brand. You
        can check the issuer document availability using our "documents" API endpoint.  Sample Values:
        true - Received Issuer Documents, false - No issuer Documents Received.'
      type: boolean
      example: false
    merchantDataDetailed:
      description: Contains detailed information about merchant.
      type: object
      properties:
        merchantData:
          $ref: '#/components/schemas/merchantData'
        merchantCategoryCode:
          description: Codifies a merchant's primary goods or services sold, this is a four-digit number
            associated with a business by a credit/debit card merchant acquirer or merchant transaction
            processor (e.g., 5411 = "GROCERY STORES, SUPERMARKETS", 5812 = "EATING PLACES, RESTAURANTS",
            4121 = "TAXICABS AND LIMOUSINES").
          type: string
          maxLength: 4
        merchantCountryCode:
          description: Codifies the three digit value used to define country per ISO 3166 standard (e.g.
            840=United States, 124=Canada).
          type: string
          maxLength: 3
        merchantRegionCode:
          description: 'Codifies a geographic area represented by one or more Countries, States or Provinces.
            Country, State or Province identifies a geographic area that represents a Firm recognized
            geopolitical unit. Examples: E - East, M - Midwest, X - Out of Country (U.S.)'
          type: string
          maxLength: 10
    transactionDataDetailed:
      description: Contains detailed information about sale or refund transaction.
      type: object
      properties:
        transactionData:
          $ref: '#/components/schemas/transactionData'
        transactionTypeCode:
          description: 'Codifies a grouping of payment transactions with similar processing characteristics
            such as retails transactions, mail order transactions, etc. Sample Values: R - Retail Transaction
            1 - Single Transaction - Mail Order/ Telephone Order 2 - Recurring Transaction 3 - Installment
            Transaction 4 - Deferred Transaction 5 - SET (Secure Electronic Transmission) Transaction
            6 - Non Authenticated SET Transaction 7 - Non SET Channel Encrypted Transaction 8 - Non Secure
            Transaction I - IVR(PINless Debit Only)'
          type: string
          maxLength: 1
    authorizationDataDetailed:
      description: Contains detailed information about transaction authorization.
      type: object
      properties:
        authorizationTimestamp:
          $ref: '#/components/schemas/authorizationTimestamp'
        authorizationIdentifier:
          description: Identifies a unique occurrence of an authorization that is associated with a purchase
            of goods and/or services. More than one authorization can exist for a purchase, as an example
            in fuel and hotel services a merchant can send multiple authorization requests when the exact
            amount is unknown until completion of the sale.
          type: string
          maxLength: 13
        authorizationReferenceNumber:
          $ref: '#/components/schemas/authorizationReferenceNumber'
        authorizationResponseCode:
          description: Codifies the Firm's representation of the authorization response code being sent
            back to the merchant during credit card authorization.
          type: integer
          format: int32
        authorizationAmount:
          description: Specifies the monetary value of the sum requested to validate and ensure there
            are enough funds required to make a purchase. The amount is usually identical to the cost
            of the goods or services charged for a single transaction. It can be a smaller amount in cases
            where a transaction is split into multiple payments. It can also be a small amount or estimated
            amount to ensure the payment method is valid and has sufficient funds available when the final
            transaction amount is not known at authorization. In the case of a reversal, this represents
            the sum originally requested.
          type: number
          format: double
        authorizationCurrency:
          $ref: '#/components/schemas/authorizationCurrency'
        cavvResponseCode:
          description: Codifies the payment brand's outcome result to the process that validates the vendor
            Cardholder Authentication Verification Value (CAVV).
          type: string
          maxLength: 1
        secureIndicator:
          description: Indicates whether the transaction is 3DS (Three Domain Secure). TRUE value indicates
            the transaction is three domain secure.
          type: boolean
        terminalNumber:
          description: Identifies the terminal at which the transaction was initiated for the merchant.
            This is a programmable number assigned by the merchant.
          type: string
          maxLength: 8
        posEntryMode:
          description: Codifies the original Point of Sale entry method used on a payment transaction
            as well as the maximum level capability of the Point of Sale device.
          type: string
          maxLength: 2
    relatedItemsData:
      description: Contains information about other related disputes items.
      type: object
      properties:
        disputeId:
          $ref: '#/components/schemas/disputeId'
        disputeType:
          $ref: '#/components/schemas/disputeType'
        disputeValue:
          $ref: '#/components/schemas/disputeValue'
        disputeReason:
          $ref: '#/components/schemas/disputeReason'
        disputeInitiatedDate:
          $ref: '#/components/schemas/disputeInitiatedDate'
    caseTimelineEvent:
      description: Depicts a specific event within the chronological timeline of all events in a particular
        dispute case.
      type: object
      properties:
        eventName:
          description: The label given to a classification of a known, possible, documented and tracked
            happening on a dispute case.  Such events are typically assembled together to create a lifecycle
            of a dispute.  Event examples could include New, Assigned, Auto - Assigned, Accepted, Auto
            Accepted, Challenged - Merchant, Challenged - JPMC, JPMC denied this dispute, Need Additional
            Information, Under Issuer Review, Closed, Expired, Needs Response, Issuer Document Uploaded.
          type: string
        eventDate:
          description: Designates the hour, minute, and second in a specific day when an event occurred
            on a dispute.
          type: string
        eventDetailText:
          description: Provides textual information about the specifics of the action taken.
          type: string
    challengeRequest:
      description: Contains request attributes required to challenge a dispute.
      type: object
      required:
      - last4CardNumber
      - supportingDocuments
      properties:
        last4CardNumber:
          $ref: '#/components/schemas/last4CardNumber'
        supportingDocuments:
          type: array
          minItems: 1
          maxItems: 10
          description: Provide list of supporting document(s) in .pdf or .tiff or .tif format for the
            challenge request.
          items:
            $ref: '#/components/schemas/supportingDocument'
    last4CardNumber:
      description: Identifies the last 4 digits of card number. The truncated value is used in place of
        the full number to protect against exposure of confidential information.
      type: string
      minLength: 4
      maxLength: 4
    supportingDocument:
      description: Contains supporting document information for the dispute action.
      type: object
      required:
      - documentName
      - documentContent
      properties:
        documentName:
          description: Provide name of the document.
          type: string
        documentContent:
          description: Provide document content in base64-encoded format.
          type: string
    challengeDisputeResponse:
      description: Challenge action response
      type: object
      properties:
        requestId:
          $ref: '#/components/schemas/requestId'
        disputeId:
          $ref: '#/components/schemas/disputeId'
        actionProcessingStatus:
          $ref: '#/components/schemas/actionProcessingStatus'
        disputeStatus:
          $ref: '#/components/schemas/disputeStatus'
        statusUpdateTimestamp:
          $ref: '#/components/schemas/statusUpdateTimestamp'
        traceId:
          $ref: '#/components/schemas/traceId'
    actionProcessingStatus:
      description: 'Codifies dispute action processing status code, in response of the case action requested
        by merchant. Possible values are, IN_PROGRESS: The request is being processed asynchronously and
        this is applicable for HTTP response status code 202. Check the retrieve-status endpoint for updates.
        COMPLETED: The request was processed successfully and this is applicable for HTTP response status
        code 200. Check error messages for details.'
      type: string
      enum:
      - IN_PROGRESS
      - COMPLETED
    fulfillRequest:
      description: Contains request attributes required to fulfill retrieval-request dispute.
      type: object
      required:
      - last4CardNumber
      - supportingDocuments
      properties:
        last4CardNumber:
          $ref: '#/components/schemas/last4CardNumber'
        supportingDocuments:
          type: array
          minItems: 1
          maxItems: 10
          description: Provide list of supporting document(s) in .pdf or .tiff or .tif format for the
            fulfill request.
          items:
            $ref: '#/components/schemas/supportingDocument'
    fulfillDisputeResponse:
      description: Fulfill action response
      type: object
      properties:
        requestId:
          $ref: '#/components/schemas/requestId'
        disputeId:
          $ref: '#/components/schemas/disputeId'
        actionProcessingStatus:
          $ref: '#/components/schemas/actionProcessingStatus'
        disputeStatus:
          $ref: '#/components/schemas/disputeStatus'
        statusUpdateTimestamp:
          $ref: '#/components/schemas/statusUpdateTimestamp'
        traceId:
          $ref: '#/components/schemas/traceId'
    acceptRequest:
      description: Contains request attributes required to accept a dispute.
      type: object
      required:
      - last4CardNumber
      properties:
        last4CardNumber:
          $ref: '#/components/schemas/last4CardNumber'
    acceptDisputeResponse:
      description: Accept dispute response.
      type: object
      properties:
        requestId:
          $ref: '#/components/schemas/requestId'
        disputeId:
          $ref: '#/components/schemas/disputeId'
        actionProcessingStatus:
          $ref: '#/components/schemas/actionProcessingStatus'
        disputeStatus:
          $ref: '#/components/schemas/disputeStatus'
        statusUpdateTimestamp:
          $ref: '#/components/schemas/statusUpdateTimestamp'
        traceId:
          $ref: '#/components/schemas/traceId'
    disputesStatusData:
      description: Dispute current status related information.
      type: object
      properties:
        disputeId:
          $ref: '#/components/schemas/disputeId'
        disputeStatus:
          $ref: '#/components/schemas/disputeStatus'
        statusUpdateTimestamp:
          $ref: '#/components/schemas/statusUpdateTimestamp'
        outcome:
          $ref: '#/components/schemas/outcome'
        financialAdjustmentIndicator:
          description: 'Indicates that a recent activity or a status change has financial impact on merchant.
            Examples: a new dispute, issuer has reversed the chargeback, lost dispute, excess funds has
            been credited or debited, etc. This is reserved for future use.'
          type: boolean
        isReversed:
          description: Indicates whether the transaction is a reversal transaction.
          type: boolean
        relatedFinancialItems:
          type: array
          minItems: 0
          maxItems: 25
          description: Financial items related to disputes.
          items:
            $ref: '#/components/schemas/relatedFinancialItemsData'
    disputesStatusResponse:
      description: Dispute Response
      type: object
      properties:
        requestId:
          $ref: '#/components/schemas/requestId'
        disputesStatusList:
          type: array
          minItems: 0
          maxItems: 5000
          description: List of disputes
          items:
            $ref: '#/components/schemas/disputesStatusData'
        traceId:
          $ref: '#/components/schemas/traceId'
        pagination:
          $ref: '#/components/schemas/pagination'
    disputesStatusRequest:
      description: Retrieve dispute status request.
      type: object
      required:
      - statusInquiryParameters
      properties:
        statusInquiryParameters:
          $ref: '#/components/schemas/statusInquiryParameters'
        pagination:
          description: The next cursor is a marker or identifier provided by the API in the response of
            a paginated request. It indicates the starting point for the next set of data. When you make
            a request to the API and receive a response with a next page token, you can use that token
            in a subsequent request to retrieve the next page of results.
          type: object
          properties:
            cursor:
              description: The next cursor is a marker or identifier provided by the API in the response
                of a paginated request. It indicates the starting point for the next set of data. When
                you make a request to the API and receive a response with a next page token, you can use
                that token in a subsequent request to retrieve the next page of results.
              type: string
            pageSize:
              description: Denotes the maximum number of records the API can return as the output for
                a requested page in a paginated response.
              type: integer
              default: 1000
              maximum: 5000
    disputeIds:
      description: List of unique case identifiers.
      type: object
      properties:
        disputeIds:
          type: array
          minItems: 0
          maxItems: 1000
          description: A list of unique identifiers assigned by the acquirer to track each inquiry or
            case created for a transaction dispute on an account.
          items:
            $ref: '#/components/schemas/disputeId'
    relatedFinancialItemsData:
      description: Dispute related financial items.
      type: object
      properties:
        transactionTypeCode:
          $ref: '#/components/schemas/transactionTypeCode'
        relatedItemsData:
          $ref: '#/components/schemas/relatedItemsData'
    statusUpdateStartDate:
      description: Dispute case status update date. This is to set start date-time of the range, in format
        YYYY-MM-DDTHH:MM:SSZ.
      type: object
      properties:
        startDateTime:
          description: 'Dispute case status update date: This field specifies the start date-time of the
            range in the format YYYY-MM-DDTHH:MM:SSZ. By default, the time is set to the beginning of
            the 72-hour period preceding the current date-time. The default value does not apply when
            disputeIds are included in the request.'
          type: string
          format: date-time
    statusUpdateEndDate:
      description: Dispute case status update date. This is to set end date-time of the range, in format
        YYYY-MM-DDTHH:MM:SSZ.
      type: object
      properties:
        endDateTime:
          description: 'Dispute case status update date: This field specifies the end date-time of the
            range in the format YYYY-MM-DDTHH:MM:SSZ. By default, the end time is set to the current date-time.
            The default value does not apply when disputeIds are included in the request.'
          type: string
          format: date-time
    transactionTypeCode:
      description: Codifies whether a transaction type will be grouped as a debit, credit or non monetary.
        C value indicates Credit and D indicates Debit.
      type: string
      maxLength: 1
      enum:
      - C
      - D
    disputeDocumentsResponse:
      description: Dispute document response
      type: object
      properties:
        requestId:
          $ref: '#/components/schemas/requestId'
        disputeId:
          $ref: '#/components/schemas/disputeId'
        issuerDocuments:
          type: array
          minItems: 0
          maxItems: 10
          description: List of documents
          items:
            $ref: '#/components/schemas/documentData'
        traceId:
          $ref: '#/components/schemas/traceId'
    documentData:
      description: Document data attached to a case.
      type: object
      properties:
        documentName:
          description: The label given to a data file containing zero or more records that is processed
            or transmitted.
          type: string
        documentContent:
          description: Provides document content in base64-encoded format. It should be decoded to retrieve
            the original data.
          type: string
        documentDate:
          description: Designates the year (YYYY), month and day printed on the document.
          type: string
    statusInquiryParameters:
      description: Status enquiry parameters
      type: object
      anyOf:
      - $ref: '#/components/schemas/companyIds'
      - $ref: '#/components/schemas/merchantIds'
