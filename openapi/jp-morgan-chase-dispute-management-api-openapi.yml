        between a merchant and their customer. Examples: Visa, MasterCard, PayPal, Bill Me Later etc.
        Also known with the Firm as method of payment or MOP.'
      type: string
      maxLength: 100
      example: Visa
    merchantOrderNumber:
      description: A unique identifier assigned by the merchant or on behalf of the merchant for the intention
        to purchase goods and/or services. The merchant order provides the merchant a reference to the
        prices, quantity and description of goods and/or services to be delivered for all transactions
        included in the sale.
