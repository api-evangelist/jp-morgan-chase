    disputeReasonCode:
      description: Codifies the reason for the disputed case.
      type: string
      minLength: 1
      maxLength: 6
    disputeReasonDescription:
      description: Textual reason description of the disputed case.
      type: string
      maxLength: 256
    disputeCategoryCode:
      description: The category of the dispute based on the reason code.
      type: string
      maxLength: 25
      enum:
      - AUTHORIZATION
      - CONSUMER_DISPUTE
      - FRAUD
      - PROCESSING_ERROR
    responseDueDate:
      description: Due date before which the merchant can challenge the dispute in YYYY-MM-DD format.
      type: string
    disputeStatus:
      description: The label for the current stage of a case in the dispute resolution process
      type: string
      maxLength: 50
      enum:
      - NEW
      - NEEDS_RESPONSE
      - EXPIRED
      - CHALLENGED_JPMC
      - UNDER_ISSUER_REVIEW
      - CHALLENGED_MERCHANT
      - ACCEPTED
      - CHALLENGE_DENIED
      - CLOSED
      - NEED_ADDITIONAL_INFORMATION
    statusUpdateTimestamp:
      description: Represents the date and time when the status of a dispute case was last updated in
        UTC timezone. The format is YYYY-MM-DDTHH:MM:SSZ.
      type: string
      format: date-time
    outcome:
      description: 'The label given to the financial outcome of a chargeback dispute where money was taken
        back from the merchant for a sale and indicates if the case has been Won (money returned to merchant)
        or Lost (money returned to consumer) by the merchant. List of outcomes for Chargeacks are PENDING:
        Final decision/result pending, LOST:  Merchant lost dispute, WON: Merchant won dispute and PARTIALLY_WON:
        Merchant won partial disputed amount, List of outcomes for Retrieval requests are PENDING: Final
        decision/result pending, FULFILLED: Request Retrieval request complete and NOT_FULFILLED: Request
        Retrieval request expired.'
      type: string
      maxLength: 50
      enum:
      - WON
      - LOST
      - PENDING
      - PARTIALLY_WON
      - FULFILLED
      - NOT_FULFILLED
    paymentMethodCode:
      description: 'Codifies the method used to pay for the exchange of money, goods or services between
        a merchant and their customer. Examples: VI for Visa, MC for MasterCard etc. Also known as method
        of payment or MOP.'
