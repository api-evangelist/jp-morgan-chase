                    browserAcceptHeader: application/json
                    deviceIPAddress: 192.168.1.11
                    browserLanguage: EN
                    browserColorDepth: '8'
                    browserScreenHeight: '480'
                    browserScreenWidth: '640'
                    deviceLocalTimeZone: '1'
                    browserUserAgent: Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:47.0) Gecko/20100101 Firefox/47.0
                    javaEnabled: true
                    javaScriptEnabled: true
                  threeDSChallengeMerchantNotificationUrl: https://returnurl.com
                  authenticationAccount:
                    email: example@example.com
                    firstName: FirstName
                    lastName: LastName
                    middleName: MiddleName
                    phone:
                      countryCode: 1
                      phoneNumber: '8131112222'
                    billingAddress:
                      line1: 123 Main Street
                      line2: Apartment 3b
                      city: Tampa
                      state: FL
                      postalCode: '33602'
                      countryCode: USA
                      addressTypeCode: Doing Business As Address
                  shippingAddress:
                    line1: 123 Main Street
                    line2: Apartment 3b
                    city: Tampa
                    state: FL
                    postalCode: '33602'
                    countryCode: USA
                    addressTypeCode: Doing Business As Address
                  authenticationSupportUrl: https://merchantsupporturl.com
                  messageType: PAYMENT_AUTHENTICATION
              3DS Challenge Completion:
                value:
                  channelType: BROWSER
                  accountType: CREDIT
                  threeDSRequestorAuthenticationInfo:
                    threeDSAuthenticationTimestamp: '2023-08-21T15:12:12Z'
                    threeDSChallengeType: CHALLENGE_REQUESTED
                    authenticationPurpose: PAYMENT_TRANSACTION
                  threeDSPurchaseInfo:
                    purchaseDate: '2023-08-21T15:12:12Z'
                    threeDomainSecureTransactionType: GOODS_SERVICES
                  browserInfo:
                    browserAcceptHeader: application/json
                    deviceIPAddress: 192.168.1.11
                    browserLanguage: EN
                    browserColorDepth: '8'
                    browserScreenHeight: '480'
                    browserScreenWidth: '640'
                    deviceLocalTimeZone: '1'
                    browserUserAgent: Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:47.0) Gecko/20100101 Firefox/47.0
                    javaEnabled: true
                    javaScriptEnabled: true
                  threeDSChallengeMerchantNotificationUrl: https://returnurl.com
                  authenticationAccount:
                    email: example@example.com
                    firstName: FirstName
                    lastName: LastName
                    middleName: MiddleName
                    phone:
                      countryCode: 1
                      phoneNumber: '8131112222'
                    billingAddress:
                      line1: 123 Main Street
                      line2: Apartment 3b
                      city: Tampa
                      state: FL
                      postalCode: '33602'
                      countryCode: USA
                      addressTypeCode: Doing Business As Address
                  shippingAddress:
                    line1: 123 Main Street
                    line2: Apartment 3b
                    city: Tampa
                    state: FL
                    postalCode: '33602'
                    countryCode: USA
                    addressTypeCode: Doing Business As Address
                  authenticationSupportUrl: https://merchantsupporturl.com
                  messageType: PAYMENT_AUTHENTICATION
              3DS CB Challenge Completion:
                value:
                  channelType: BROWSER
