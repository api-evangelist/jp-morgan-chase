          $ref: '#/components/schemas/threeDSRequestorAuthenticationInfo'
    browserInfo:
      description: Browser Information of the consumer
      type: object
      properties:
        browserAcceptHeader:
          description: Exact content of the HTTP accept headers from the cardholder browser.
          type: string
        browserLanguage:
          description: Value representing the cardholder browser language as defined in IETF BCP47. This value is limited to 1-8 characters.
          type: string
        browserScreenHeight:
          description: Total height of the cardholder browser screen in pixels.
          type: string
        browserColorDepth:
          description: Value representing the bit depth of the color palette of the cardholder browser for displaying images, in bits per pixel.  The field is limited to 1-2 characters.
          type: string
        browserScreenWidth:
          description: Total width of the cardholder browser screen in pixels.
          type: string
        deviceLocalTimeZone:
          description: Represents a unique code assigned by the firm for a geographical area that observes a uniform standard time for legal, commercial, and social purposes.
          type: string
        browserUserAgent:
          description: Exact content of the HTTP user-agent header. The field is limited to a maximum of 2048 characters.
          type: string
        javaEnabled:
          description: Indicates if the device's application software, used to communicate between users of the Internet's World Wide Web, allows java.
          type: boolean
        javaScriptEnabled:
          description: Indicates if the device's application software, used to communicate between users of the Internet's World Wide Web, allows javascript.
          type: boolean
        challengeWindowSize:
          description: Provides the dimensions of the challenge window in pixels that has been displayed to the consumer. The Acces Control Server (ACS) shall reply with content that is formatted to appropriately render in this window to provide the best possible user experience.
          type: string
        deviceIPAddress:
          description: 'A unique string of numbers separated by periods that identifies each device using the Internet Protocol (IP) to communicate over a network.  An IP address is assigned to every single computer, printer, switch, router or any other device that is part of a TCP/IP-based network which allows users to send and receive data. The numerals in an IP address are divided into two parts:  1) The network part specifies which networks this address belongs to and 2) The host part further pinpoints the exact location. In this context, this is the IP address of the devices associated with the transaction.'
          type: string
          example: 192.0.2.255
    orderOverrideCode:
      description: Codifies the option merchant has chosen to perform a non-systemic override on a payment order.
      type: string
      enum:
      - NO_MAPPING
      - CONSUMER_REFNUM_ORDERID
      - CONSUMER_REFNUM_COMMENTS
      - CONSUMER_REFNUM_ORDERID_COMMENTS
    mandate:
      description: This is used for specifying an attribute used on a model for object that will contain one or more attributes
      type: object
      required:
      - mandateId
      - mandateType
      - mandateSignatureDate
      properties:
        mandateId:
          description: Identifies an agreement between the consumer, debtor bank (direct debit account of the consumer) and the merchant. This agreement (mandate) gives the merchant permission to withdraw funds from the consumer's account for some specific financial purpose. Typically mandates are used for recurring or installment payments; that is, a fixed amount to be withdrawn over a specific period of time (defined by the “Mandate Date”). One-time withdrawals are allowed. Mandates are specific to European programs such as Single Euro Payments Area (SEPA) Direct Debit (DD) scheme and Bankers' Automated Clearing System (BACS).
          type: string
        mandateType:
          description: Codifies the category of an agreement between the consumer, debtor bank (direct debit account of the consumer) and the merchant. This agreement (mandate) gives the merchant permission to withdraw funds from the consumer's bank account for some specific financial purpose. Typically mandates are used for recurring or installment payments; that is, a fixed amount to be withdrawn over a specific period of time (defined by the “Mandate Date”). One-time withdrawals are allowed. Mandates are specific to European programs such as Single Euro Payments Area (SEPA) Direct Debit (DD) scheme and Bankers' Automated Clearing System (BACS).
          type: string
        mandateSignatureDate:
          description: Designates the year, month and day when the consumer signs an agreement (mandate) that gives the merchant permission to withdraw funds from the consumer's bank account for some specific financial purpose. Typically mandates are used for recurring or installment payments; that is, a fixed amount to be withdrawn over a specific period of time (defined by the “Mandate Date”). One-time withdrawals are allowed. Mandates are specific to European programs such as Single Euro Payments Area (SEPA) Direct Debit (DD) scheme and Bankers' Automated Clearing System (BACS). mandateSignatureDate should be valid date with format YYYY-MM-DD.
          type: string
        mandateReferenceId:
          description: Identifies an unique reference number generated by the consumer profile system for the agreement between the consumer, debtor bank (direct debit account of the consumer) and the merchant. This agreement (mandate) gives the merchant permission to withdraw funds from the consumer's account for some specific financial purpose.
          type: string
          readOnly: true
    latLong:
      description: 'Identifies the latitude and longitude coordinates of the digital device when it is being provisioned. Information is expressed in the order of latitude followed by longitude. Valid Range: Latitude is greater than or equal to -90.00000 and less than or equal to 90.00000. Longitude is greater than or equal to -180.00000 and less than or equal to 180.00000.'
      type: string
      minLength: 3
      maxLength: 21
      example: 1,1
