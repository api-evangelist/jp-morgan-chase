      value:
        title: Conflict
        httpStatus: 409
        traceId: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        requestId: 123e4567-e89b-12d3-a456-426614174000
        context:
        - code: '11001'
          message: Hold already decisioned
    BadIdentifier:
      value:
        title: Bad Request
        httpStatus: 400
        traceId: 0eca2e1a-74b7-44b7-9e66-4a6ec8336eb9
        requestId: UK202109202311354152
        context:
        - code: '10103'
          message: Invalid resource identifier format.
          field: id
          location: PATH
    RetrieveSingleHoldResponse:
      description: Retrieve single hold
      summary: Retrieve single hold by id
      value:
