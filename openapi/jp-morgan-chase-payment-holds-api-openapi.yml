  parameters:
    EndDateTime:
      name: endDateTime
      in: query
      description: End of hold date/time range (inclusive). If only endDateTime provided, returns anything <= endDateTime. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-02-01T00:00:00+00:00'
    Status:
      name: status
      in: query
      description: One or more hold statuses to filter by. If substatus is used, this must not be provided. If multiple values are specified (comma-separated), treated as OR. If not provided, returns holds for any status.
      required: false
      style: form
      explode: false
      schema:
        type: array
        minItems: 0
        maxItems: 10
        items:
          $ref: '#/components/schemas/DecisionStatus'
      examples:
        Pending Client Action:
          summary: Not specified - using substatus instead
          value: []
        Pending JPM Review:
          summary: Not specified - using substatus instead
          value: []
        Pending Bank Or Client Decision:
          summary: Filter by any pending status
          value:
          - PENDING
        Approved Only:
          summary: Filter by approved status
          value:
          - APPROVED
        Rejected Only:
          summary: Filter by rejected status
          value:
          - REJECTED
        Filter By Status And Substatus (Not Allowed):
          summary: Not allowed - mutually exclusive with substatus
          value:
          - APPROVED
          - REJECTED
    Offset:
      name: offset
      in: query
      description: Page offset for pagination (0-based)
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
        default: 0
    Sort:
      name: sort
      in: query
      description: 'Sort order for the collection results. Uses the format field.`direction` where direction is `asc` (ascending) or `desc` (descending).


        Supported sort fields: `heldAt`, `cutOffAt`, `status`.


        If not provided, defaults to heldAt.`desc` (most recently held first).

        '
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 50
        default: heldAt.desc
    StartDateTime:
      name: startDateTime
      in: query
      description: Start of hold date/time range (inclusive). If only startDateTime provided, returns anything >= startDateTime. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC
      required: false
      schema:
        type: string
        format: date-time
      example: '2026-01-01T00:00:00+00:00'
    substatus:
      name: substatus
      in: query
      description: One or more hold sub-statuses. If status is used, substatus must not be provided. If multiple values are specified (comma-separated), treated as OR. If not provided, returns holds for any sub-status.
      required: false
      style: form
      explode: false
      schema:
        type: array
        minItems: 0
        maxItems: 20
        items:
          $ref: '#/components/schemas/DecisionSubstatus'
      examples:
        Pending Client Action:
          summary: Filter by pending client action
          value:
          - PENDING_ACTION_CLIENT
        Pending JPM Review:
          summary: Filter by pending JPM review
          value:
          - PENDING_ACTION_JPM
        Pending Bank Or Client Decision:
          summary: Not specified - using status instead
          value: []
        Filter By Status And Substatus (Not Allowed):
          summary: Not allowed - mutually exclusive with status
          value:
          - REJECTED_TXN_NOT_NEEDED_CLIENT
    PageSize:
      name: pageSize
      in: query
      description: The number of records per page
      required: false
