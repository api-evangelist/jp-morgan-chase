components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    healthCheckResource:
      description: Contains health check information about a resource.
      type: object
      required:
      - status
      properties:
        status:
          description: General status of all resources.
          type: string
          enum:
          - PASS
          - FAIL
          - WARN
          example: PASS
    adfsError:
      description: Object containing information about the active directory file system error.
      type: object
      required:
      - errorSource
      - errorCode
      - errorDescription
      properties:
        errorSource:
          description: The label of the component from where the error or warning originated.
          type: string
          example: APG-EDGE
        errorCode:
          description: Codifies a raised exception encountered by an internal or external system, sub-system,
            interface, job, module, or system component with which the web service application interfaces.  In
            this instance it refers to the error raised when reporting job failed.
          type: string
          example: EDG00012
        errorDescription:
          description: The textual information of the code of the raised exception encountered by an internal
            or external system, sub-system, interface, job, module, or system component with which the
            web service application interfaces.
          type: string
          example: the signature could not be verified
    messages:
      description: A list of errors and warnings.
      type: object
      required:
      - responseStatus
      - responseCode
      properties:
        responseStatus:
          $ref: '#/components/schemas/responseStatus'
        responseCode:
          $ref: '#/components/schemas/responseCode'
        responseMessage:
          $ref: '#/components/schemas/responseMessage'
        validationErrors:
          type: array
          minItems: 0
          description: validationErrors
          items:
            $ref: '#/components/schemas/validationMessage'
    validationMessage:
      description: Object containing information about transaction validation.
      type: object
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/code'
        message:
          $ref: '#/components/schemas/message'
        entity:
          description: The name given to the module or program where the error was generated.
          type: string
    responseStatus:
      description: Request result status.
      type: string
      readOnly: true
      example: SUCCESS
      enum:
      - SUCCESS
      - ERROR
    responseCode:
      description: Short explanation of the response code.
      type: string
      readOnly: true
      minLength: 2
      maxLength: 50
      example: ACCEPTED
    responseMessage:
      description: Long explanation of the response message.
      type: string
      readOnly: true
      example: Request Accepted
    code:
      description: Codifies a raised exception encountered by an internal or external system, sub-system,
        interface, job, module, or system component with which the web service application interfaces.
        In this instance it refers to the error raised when the reporting job failed.
      type: string
    message:
      description: Provides textual description of a problem that has occurred and which is preventing
        the system from completing a task. Messages can be a  confirmation, warning or notification, and
        can trigger the system to apply a customized default value or override to a field, record or file,
        halt or postpone processing, or skip or reject the entry generating the problem. Messages can
        be displayed on-screen in the user interface or in reporting.
      type: string
    consumerProfile:
      description: Consumer Profile Object
      type: object
      properties:
        externalConsumerProfileIdentifier:
          $ref: '#/components/schemas/externalConsumerProfileIdentifier'
        consumerProfileId:
          description: Identifies a unique occurrence of a consumer maintained in the firm as requested
            by merchant. Consumer profile contains information relevant to processing transactions such
            as name, address, account and payment methods information.
          type: string
          readOnly: true
        cardOnFileReferenceNumber:
          description: Identifies a cardholder account profile which allows cardholder data (including,
            but not limited to, an account number or payment token) to be stored and subsequently used
            for transaction processing.
          type: string
          maxLength: 32
          pattern: '[A-Za-z0-9]*'
          example: 3456789fghuj
        merchant:
          $ref: '#/components/schemas/merchant'
        fullName:
          $ref: '#/components/schemas/fullName'
        profileStatus:
          description: Codifies the current standing of a Party's profile.
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        consumerProfileAddresses:
          type: array
          minItems: 0
          description: List of postal addresses linked with consumer profile.
          items:
            $ref: '#/components/schemas/consumerProfileAddress'
        profilePaymentMethod:
          $ref: '#/components/schemas/profilePaymentMethod'
        communication:
          $ref: '#/components/schemas/communication'
        browserInfo:
          $ref: '#/components/schemas/browserInfo'
        orderOverrideCode:
          $ref: '#/components/schemas/orderOverrideCode'
        firstName:
          $ref: '#/components/schemas/firstName'
        lastName:
          $ref: '#/components/schemas/lastName'
    address:
      description: Address Object
      type: object
      required:
      - line1
