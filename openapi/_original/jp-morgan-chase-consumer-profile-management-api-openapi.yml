    phone:
      description: Phone Information
      type: object
      required:
      - phoneNumber
      - countryCode
      properties:
        phoneNumber:
          description: 'A locator whose value identifies the formatted numeric address for routing voice
            or data communications via telephony, to reach a party. NOTE: Telephone number formats may
            vary; this field can include domestic and international telephone numbers.'
          type: string
        countryCode:
          description: The telephone dialing prefix for a member country in the International Telecommunication
            Union (ITU) that is defined by the ITU-T E.164 standard. The code is a combination of one,
            two or three digits identifying a specific country, countries in an integrated numbering plan,
            or a specific geographic area.
          type: string
        phoneNumberType:
          description: Codifies the type of formatted numeric address for routing voice or data communications
            via telephony to reach a party.
          type: string
        communicationIdentifier:
          description: Internal Identifier generated by firm for each phone information for a consumer
            stored in the system.
          type: string
          readOnly: true
    email:
      description: Email information
      type: object
      required:
      - emailAddress
      properties:
        emailAddress:
          description: A mail system that allows a party to send and receive messages electronically.
            An email address is composed of a local part and a domain part. The local part is unique to
            the individual while the domain or host name must meet specific standards required by the
            host that administers the email service.
          type: string
        emailAddressType:
          description: Codifies the type of formatted numeric address for routing electronic message communications
            via email to reach a party.
          type: string
        communicationIdentifier:
          description: Internal Identifier generated by firm for each email information for a consumer
            stored in the system.
          type: string
          readOnly: true
    mandate:
      description: This is used for specifying an attribute used on a model for object that will contain
        one or more attributes
      type: object
      required:
      - mandateId
      - mandateType
      - mandateSignatureDate
      properties:
        mandateId:
          description: Identifies an agreement between the consumer, debtor bank (direct debit account
            of the consumer) and the merchant. This agreement (mandate) gives the merchant permission
            to withdraw funds from the consumer's account for some specific financial purpose. Typically
            mandates are used for recurring or installment payments; that is, a fixed amount to be withdrawn
            over a specific period of time (defined by the “Mandate Date”). One-time withdrawals are allowed.
            Mandates are specific to European programs such as Single Euro Payments Area (SEPA) Direct
            Debit (DD) scheme and Bankers' Automated Clearing System (BACS).
          type: string
        mandateType:
          description: Codifies the category of an agreement between the consumer, debtor bank (direct
            debit account of the consumer) and the merchant. This agreement (mandate) gives the merchant
            permission to withdraw funds from the consumer's bank account for some specific financial
            purpose. Typically mandates are used for recurring or installment payments; that is, a fixed
            amount to be withdrawn over a specific period of time (defined by the “Mandate Date”). One-time
            withdrawals are allowed. Mandates are specific to European programs such as Single Euro Payments
            Area (SEPA) Direct Debit (DD) scheme and Bankers' Automated Clearing System (BACS).
          type: string
        mandateSignatureDate:
          description: Designates the year, month and day when the consumer signs an agreement (mandate)
            that gives the merchant permission to withdraw funds from the consumer's bank account for
            some specific financial purpose. Typically mandates are used for recurring or installment
            payments; that is, a fixed amount to be withdrawn over a specific period of time (defined
            by the “Mandate Date”). One-time withdrawals are allowed. Mandates are specific to European
            programs such as Single Euro Payments Area (SEPA) Direct Debit (DD) scheme and Bankers' Automated
            Clearing System (BACS). mandateSignatureDate should be valid date with format YYYY-MM-DD.
          type: string
        mandateReferenceId:
          description: Identifies an unique reference number generated by the consumer profile system
            for the agreement between the consumer, debtor bank (direct debit account of the consumer)
            and the merchant. This agreement (mandate) gives the merchant permission to withdraw funds
            from the consumer's account for some specific financial purpose.
          type: string
          readOnly: true
    addressIdentifier:
      description: Identifies a classification of a geographic area that is captured for a consumer purchasing
        goods or services.
      type: string
    last4AccountNumber:
      description: Identifies the final 4 digits of the Payment Method Account Number. The truncated value
        is used in place of the full number to protect against exposure of confidential information.
      type: string
      readOnly: true
    paymentMethodId:
      description: Identifies a unique occurrence of the type of payment accepted by a level of the hierarchy
