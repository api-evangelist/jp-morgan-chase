            send "JPMC."
          type: string
          example: Payment Company
        productName:
          description: The name of the product used for marketing purposes from a customer perspective.
            I. e. what the customer would recognize.
          type: string
          example: Application Name
        version:
          description: Designates the unique state of computer software as it is developed and released.
            The version identifier can be a word, or a number, or both.
          type: string
          example: '1.235'
    authenticationRequest:
      description: Authentication Request
      type: object
      writeOnly: true
      properties:
