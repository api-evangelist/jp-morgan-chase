    createTimestamp:
      description: Designates the hour, minute and second in a specific day when the record was created.
      type: string
      readOnly: true
    createUserIdentifier:
      description: The identifier (id) of the user who created the object or inserted the row. This could
        be the Firm’s Standard Identifier, or the identifier of a batch/functional process.
      type: string
      readOnly: true
    updateTimestamp:
      description: Designates the hour, minute, and second in a specifc day when the record was last modified.
