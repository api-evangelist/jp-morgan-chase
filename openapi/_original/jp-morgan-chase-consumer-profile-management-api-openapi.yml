        lastName:
          $ref: '#/components/schemas/lastName'
        consumerAssignedAddressName:
          $ref: '#/components/schemas/consumerAssignedAddressName'
        primaryAddressIndicator:
          $ref: '#/components/schemas/primaryAddressIndicator'
