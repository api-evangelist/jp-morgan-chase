      minLength: 3
      maxLength: 12
      example: '19342'
    countryCode:
      description: 'A code that identifies the Country, a Geographic Area, that is recognized as an independent
        political unit in world affairs. Note: This data element is a child of the Country Code CDE and
        valid values are based on ISO standards.'
      type: string
      pattern: ^[a-zA-Z]{2,3}$
      minLength: 3
      maxLength: 3
      example: USA
    consumerAssignedAddressName:
      description: A short label defined by the consumer that will allow them to refer to the address
        by name.  E.g Home , Office , JohnDoe_Home
      type: string
      pattern: ^[^<>]*$
      maxLength: 75
    primaryAddressIndicator:
      description: Indicates the 'TRUE'/'FALSE' value that represents whether or not an address is the
        primary address for a given owner
      type: boolean
