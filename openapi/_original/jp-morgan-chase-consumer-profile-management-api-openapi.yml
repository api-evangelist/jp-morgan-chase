          $ref: '#/components/schemas/threeDSRequestorAuthenticationInfo'
    threeDSPurchaseInfo:
      description: Three DS Purchase Info
      type: object
      properties:
        purchaseDate:
          description: Designates the year, month and day of the most recent purchase which occurred on
            the Cardholder account.
          type: string
          format: date-time
        threeDomainSecureTransactionType:
          description: Identifies the type of transaction being authenticated. The values are derived
            from ISO 8583
          type: string
          enum:
          - CHECK
          - GOODS_SERVICES
          - ACCOUNT_FUNDING
          - QUASI_CASH
          - PREPAID
    threeDSAuthenticatedData:
      description: Three DS Authenticated Data
      type: object
      properties:
        threeDSTransactionId:
          description: Identifies a unique occurrence of a transaction. In this context, this is Universally
            unique transaction identifier to identify a single transaction. If the value does not exist
            or it is not a valid UUID, the 3DS Server will generate a new transaction ID. This value has
            36 characters in a format defined in IETF RFC 4122.
          type: string
          writeOnly: true
        transactionId:
          description: Identifies a unique occurrence of a transaction.
          type: string
          readOnly: true
        threeDSAuthenticationId:
          description: Unique identifier for the  Authentication attempt.
          type: string
        threeDSTransactionDate:
          description: Designates the hour, minute, seconds and date (if timestamp) or year, month, and
            date (if date) when the transaction (monetary or non-monetary) occurred.
          type: string
          format: date-time
    browserInfo:
      description: Browser Information of the consumer
      type: object
      properties:
        browserAcceptHeader:
          description: Exact content of the HTTP accept headers from the cardholder browser.
          type: string
        browserLanguage:
          description: Value representing the cardholder browser language as defined in IETF BCP47. This
            value is limited to 1-8 characters.
          type: string
        browserScreenHeight:
          description: Total height of the cardholder browser screen in pixels.
          type: string
        browserColorDepth:
          description: Value representing the bit depth of the color palette of the cardholder browser
            for displaying images, in bits per pixel.  The field is limited to 1-2 characters.
          type: string
        browserScreenWidth:
          description: Total width of the cardholder browser screen in pixels.
          type: string
        deviceLocalTimeZone:
          description: Represents a unique code assigned by the firm for a geographical area that observes
            a uniform standard time for legal, commercial, and social purposes.
          type: string
        browserUserAgent:
          description: Exact content of the HTTP user-agent header. The field is limited to a maximum
            of 2048 characters.
          type: string
        javaEnabled:
          description: Indicates if the device's application software, used to communicate between users
            of the Internet's World Wide Web, allows java.
          type: boolean
        javaScriptEnabled:
          description: Indicates if the device's application software, used to communicate between users
            of the Internet's World Wide Web, allows javascript.
          type: boolean
        challengeWindowSize:
          description: Provides the dimensions of the challenge window in pixels that has been displayed
            to the consumer. The Acces Control Server (ACS) shall reply with content that is formatted
            to appropriately render in this window to provide the best possible user experience.
          type: string
        deviceIPAddress:
          description: 'A unique string of numbers separated by periods that identifies each device using
            the Internet Protocol (IP) to communicate over a network.  An IP address is assigned to every
            single computer, printer, switch, router or any other device that is part of a TCP/IP-based
            network which allows users to send and receive data. The numerals in an IP address are divided
            into two parts:  1) The network part specifies which networks this address belongs to and
            2) The host part further pinpoints the exact location. In this context, this is the IP address
            of the devices associated with the transaction.'
          type: string
          example: 192.0.2.255
    threeDSRequestorAuthenticationInfo:
      description: Three DS Requestor Authentication Info
      type: object
      properties:
        authenticationPurpose:
          description: Codifies the purpose of the cardholder authentication request.
          type: string
          enum:
          - PAYMENT_TRANSACTION
          - RECURRING_TRANSACTION
          - INSTALLMENT_TRANSACTION
          - ADD_CARD
          - MAINTAIN_CARD
          - CARDHOLDER_VERIFICATION
          - BILLING_AGREEMENT
        threeDSChallengeType:
