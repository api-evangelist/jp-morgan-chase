    externalConsumerProfileIdentifier:
      description: 'Identifies a unique occurrence of a consumer maintained by the merchant or a vendor.
        Consumer profile contains information relevant to processing transactions such as name, address,
        account and payment methods information.Alpha characters are always stored in UPPERCASE. The valid
        characters include: • abcdefghijklmnopqrstuvwxyz • ABCDEFGHIJKLMNOPQRSTUVWXYZ • 0123456789 • -
        , $ @ &amp;  and a space character Notes: • A space character cannot be the leading character.
        • An ampersand must be sent as &amp; • Double ampersands (&amp;&amp;) are not supported.'
      type: string
      maxLength: 36
      writeOnly: true
    bacs:
      description: Object for BACS (Bankers' Automated Clearing System) is an electronic system payment
        method make payments directly from one bank account to another. This payment method mostly used
        in UK.
      type: object
