        line1:
          $ref: '#/components/schemas/line1'
        line2:
          $ref: '#/components/schemas/line2'
        city:
          description: A portion of a party's address which is the geographic area that is a municipality
            with legal power granted by a state/province charter.
          type: string
          maxLength: 40
          pattern: '[\p{L}\d\s\-''.,&() ]*$'
          example: Glen Mills
        state:
          description: 'Classifies a geographic area that represents a first level, legal and political
            subdivision of a country; it should be in the ISO 3166-2 format. For Example: the parish "Andorra
            la Vella" in Andorra will be represented as 07.   similarly the province "Bengo" in Angola
            will be represented as "BGO". state Texas in USA is represnted as "TX" etc.,'
          type: string
