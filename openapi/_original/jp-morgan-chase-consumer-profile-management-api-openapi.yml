          - CHALLENGE_REQUESTED
          - CHALLENGE_MANDATE
          - NO_CHALLENGE_TRA
          - NO_CHALLENGE_DATA
          - NO_CHALLENGE_DA
          - NO_CHALLENGE_TRUSTED
