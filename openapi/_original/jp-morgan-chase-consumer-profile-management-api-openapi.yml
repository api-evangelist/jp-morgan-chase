    firstName:
      description: That part of an individual's full name considered a personal name or given name and
        generally positioned before the last name or family name.
      type: string
      pattern: '[\p{L}\p{P}0-9'' ]*$'
      maxLength: 70
      example: John
    lastName:
      description: 'That part of an individual’s name generally placed at the end of the given name. The
        last name is also known as the surname or family name. (Note: name conventions may be different
        based on practices in different countries. Some countries use two or more last names; in other
        countries, the family name is placed before a person’s given name; in some countries, it is common
        for people to have only one name or a mononym.)'
      type: string
      pattern: '[\p{L}\p{P}0-9'' ]*$'
      maxLength: 70
      example: Babbitt
    profileStatus:
      description: Codifies the current standing of a Party's profile.
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - PENDING
      - ERRORED
    middleName:
