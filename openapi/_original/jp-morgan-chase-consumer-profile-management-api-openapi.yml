        cardExpirationMonthYearNumber:
          $ref: '#/components/schemas/cardExpirationMonthYearNumber'
        last4CardNumber:
          $ref: '#/components/schemas/last4CardNumber'
        first6CardNumber:
          $ref: '#/components/schemas/first6CardNumber'
