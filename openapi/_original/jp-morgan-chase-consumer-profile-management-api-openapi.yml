    addressType:
      description: 'Codifies the classification given to the various addresses captured for a party, such
        as Doing Business As Address, Legal Entity Address, and Tax Address.  Valid values:  ''SHIPPING''
        or ''BILLING'''
      type: string
      enum:
      - SHIPPING
      - BILLING
    line1:
      description: 'A portion of a party''s address which is the line of the unstructured (unparsed) geographic
        street address containing any of the following: house number, street name, street direction, street
        type, dwelling type and number, PO Box number, rural delivery route number.'
      type: string
      pattern: ^[^<>{}]*$
      maxLength: 100
      example: 400 Elton Farm
    line2:
      description: 'A portion of a party''s address which is the line of the unstructured (unparsed) geographic
        street address containing any of the following: house number, street name, street direction, street
        type, dwelling type and number, PO Box number, rural delivery route number.'
      type: string
      pattern: ^[^<>{}]*$
      maxLength: 100
      example: Apt 123
    city:
      description: A portion of a party's address which is the geographic area that is a municipality
        with legal power granted by a state/province charter.
      type: string
      pattern: '[\p{L}\d\s\-''.,&() ]*$'
      maxLength: 40
      example: Glen Mills
    state:
      description: 'Classifies a geographic area that represents a first level, legal and political subdivision
        of a country; it should be in the ISO 3166-2 format. For Example: the parish "Andorra la Vella"
        in Andorra will be represented as 07.   similarly the province "Bengo" in Angola will be represented
        as "BGO". state Texas in USA is represnted as "TX" etc.,'
      type: string
      pattern: ^[A-Za-z0-9]+([\s-]+[A-Za-z0-9]+)*$
      minLength: 1
      maxLength: 3
      example: PA
    postalCode:
      description: The portion of a party’s address that is the encoded representation of a geographic
        area to facilitate mail delivery services.
      type: string
