          description: Provides textual information supplied by the Primary Applicant on the Merchant
            Services Application that describes the products or services that the current or prospective
            client business organization provides to its customers. 
          type: string
    billerDebitCardReferenceNumber:
      description: The Firm identifier assigned to a debit card number at the instantiation of the debit
        card number that persists over time as the debit card number changes through the lost/stolen/fraud
        process. It links replacement debit card numbers with the originally assigned card number.
      type: string
