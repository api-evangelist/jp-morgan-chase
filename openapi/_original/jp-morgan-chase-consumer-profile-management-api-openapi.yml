        walletProvider:
          description: Identifies the organization who manages the e-wallet for a consumer. The actual
            e-wallet management responsibilities may include hosting, accessing, communicating, and/or
            updating all or some of the customer data associated with the e-wallet.  An E-wallet is an
            application that is created on the mobile device to interact with the Point of Sale (POS)
            device as a catalyst for a transaction.  This value may be sent to the Firm (as in Visa Tokenization)
            or created by the Firm.
