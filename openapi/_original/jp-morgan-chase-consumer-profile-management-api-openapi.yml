    profileSepa:
      description: Sepa Payment Information
      type: object
      required:
      - internationalBankAccountNumber
      - internationalBusinessIdentifierCode
      properties:
        internationalBankAccountNumber:
          description: Identifies the International Bank Account Number (IBAN) for the account.  IBAN
            is an internationally agreed system of identifying bank accounts across national borders to
            facilitate the communication and processing of cross border transactions with a reduced risk
            of transcription errors. Based on ISO 13616 standards, the IBAN consists of up to 34 alphanumeric
            characters, comprising a country code, two check digits and a long and detailed bank account-number.
            The check digits enable a sanity check of the bank account number to confirm its integrity
            before submitting a transaction.
          type: string
          writeOnly: true
        internationalBusinessIdentifierCode:
          description: Codifies the unique value that identifies a particular bank in the worldwide economy.
            The 8 to 11 digit code is based on ISO 9362 standards. This code has several aliases including
            SWIFT Code, SWIFT Bank Code and Bank Identification Code (BIC). ISO 9362:2014 specifies the
            elements and structure of a universal identifier code for financial and non-financial institutions
            where an international identifier is required to facilitate automated processing of information
            for financial services.  The BIC is used for addressing messages, routing business transactions
            and identifying business parties. This Standard applies to organizations and excludes individual
            persons.
          type: string
        accountStatus:
          description: Codifies the current status of the card.
          type: string
          example: ACTIVE
          enum:
          - ACTIVE
          - INACTIVE
        mandateList:
          type: array
          minItems: 0
          description: List of mandate information
          items:
            $ref: '#/components/schemas/mandate'
        firstName:
          $ref: '#/components/schemas/firstName'
        middleName:
          $ref: '#/components/schemas/middleName'
        lastName:
          $ref: '#/components/schemas/lastName'
        consumerProfileAddress:
          $ref: '#/components/schemas/consumerProfileAddress'
        last4AccountNumber:
          $ref: '#/components/schemas/last4AccountNumber'
        paymentMethodId:
          $ref: '#/components/schemas/paymentMethodId'
