    softMerchant:
      description: Soft merchant information is passed to the card association along with the transaction.
        This soft merchant information may also be used for cases where smaller businesses or franchise
        outlets are making a sale in which a merchant aggregator or payment facilitatorprocesses the payment
        transaction on their behalf.
      type: object
      properties:
        name:
          description: Name of merchant recognizable to account holder intended to be used in the event
            where the merchant of record is a payment facilitator.
          type: string
        city:
