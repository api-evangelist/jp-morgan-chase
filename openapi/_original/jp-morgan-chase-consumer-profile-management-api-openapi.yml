    financialInstitutionRoutingNumber:
      description: Identifies the routing and transit number assigned by an administrative body to formally
        identify a chartered financial institution (bank) within a given country or common financial market
        for performing domestic transfers of funds to or from that institution's client accounts. Within
        the United States, this is known as the American Bankers Association Routing Number, and within
        Australia, this is known as a Bank State Branch Number. This common data element will house those
        two examples, along with the equivalent for any other country or financial market.
      type: string
    paymentType:
      description: Identifies how accountholders  initiated debits to their accounts .
      type: string
      enum:
      - WEB
      - TEL
      - RECURRING
    accountType:
      description: Codifies a bank account where funds are deposited or stored (e.g., checking and savings
        account). When shared with a financial institution as the client's primary automated payment mechanism
        for a debt, it may also be known as a DDA (Demand Deposit Account). A DDA can have funds withdrawn
        at any time from the depository institution, accessible by a teller, ATM or via online banking.
      type: string
      enum:
      - CHECKING
      - SAVING
      - CORPORATE_CHECKING
    isTransactionMicroEntry:
      description: Indicates the current transaction is an Automated Clearing House (ACH) credit or debit
        Entry used by an Originator for the purpose of verifying a Receiver’s account or an individual's
        access to an account.
      type: boolean
    communicationUpdate:
