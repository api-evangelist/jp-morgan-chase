  /reporting-groups/{groupId}:
    patch:
      summary: Update an existing reporting group.
      operationId: v1ReportingGroupPut
      tags:
      - Reporting Groups
      description: Update an existing reporting group.
      parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of a reporting group
        examples:
          Modify reporting group hierarchy, name, description:
            value: '2409042109467790'
          Deactivate reporting group, update name and description:
            value: '2409042109467790'
          Reactivate reporting group, update name and description:
            value: '2409042109467790'
          Modify heterogeneous reporting group name, description:
            value: '2509052216214359'
      requestBody:
        description: Update an existing reporting group.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateReportingGroup'
            examples:
              Modify reporting group hierarchy, name, description:
                value:
                  reportingGroupType: RGPE
                  reportingGroupName: Test RG 8
                  reportingGroupDescription: New Description for Test RG 8
                  childEntityInfo:
                  - entityType: RGPE
                    entityIds:
                    - '2409042106034913'
              Deactivate reporting group, update name and description:
                value:
                  reportingGroupType: RGPE
                  reportingGroupName: New name for RG
                  reportingGroupDescription: New description for RG
                  reportingGroupStatus: inactive
              Reactivate reporting group, update name and description:
                value:
                  reportingGroupType: RGPE
                  reportingGroupName: Test RG 7
                  reportingGroupDescription: New description for RG..
                  reportingGroupStatus: active
              Modify heterogeneous reporting group name, description:
                value:
                  reportingGroupType: RGH
                  reportingGroupName: RGH Example
                  reportingGroupDescription: Update Heterogeneous Reporting Group
                  childEntityInfo:
                  - entityType: CO
                    entityIds:
                    - '233235'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/reportingGroupResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/adfsError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    healthCheckResource:
      description: Contains health check information about a resource.
      type: object
      required:
      - status
      properties:
        status:
          description: Indicates the status of all resources.
          type: string
          enum:
          - UP
          - DOWN
          - UNKNOWN
          - OUT OF SERVICE
    reportType:
      description: Report Type
      type: object
      required:
      - reportTypeId
      - reportTypeName
      - reportDescription
      - reportGranularityTypeCode
      properties:
        reportTypeId:
          $ref: '#/components/schemas/reportTypeId'
        reportTypeName:
          description: The name of the report type.
          type: string
        reportDescription:
          description: The textual description of the report type.
          type: string
        reportGranularityTypeCode:
          description: The level at which report detail is presented. For example, Fee level, transaction
            level and so on.
          type: string
        gatewayRegionCode:
          description: Indicates the geographical region for which the report type is applicable.  The
            region code is defined using ISO-3166 code. For e.g. USA, CAN, AU and so on
          type: string
          deprecated: true
        gatewayRegion:
          description: Indicates the geographical region for which the report type is applicable.  The
            region code is defined using ISO-3166 code. For e.g. USA, CAN, AU and so on
          type: string
        paymentMethodCodes:
          type: array
          minItems: 0
          description: Indicates the list of Payment Network Code through which card's (Debit or credit)
            account transactions in the report are processed. For e.g. VI, MC, AX and so on.
          deprecated: true
          items:
            type: string
        paymentMethodGroup:
          description: Codifies the category of payment method used for reporting purpose such as local
            payment method, global payment method.
          type: string
    reportTypeNames:
      type: array
      minItems: 0
      description: The names of the report types.
      items:
        type: string
    reportTypeFields:
      description: An array containing Report Type Fields.
      type: object
      required:
      - reportTypeFields
      properties:
        reportTypeFields:
          type: array
          minItems: 0
          description: Report Type Field Array
          items:
            $ref: '#/components/schemas/defaultReportField'
    defaultReportField:
      description: Report Configuration Request
      type: object
      required:
      - reportAttributeName
      - businessDefinitionText
      - defaultIncludeIndicator
      properties:
        reportAttributeName:
          $ref: '#/components/schemas/reportAttributeName'
        businessDefinitionText:
          description: Indicates clear and concise description of the data elements used in the reports
          type: string
        defaultIncludeIndicator:
          description: Indicates the BOOLEAN value to signifiy if the attribute is included in the report.
            TRUE indicates that the attribute is included by default.
          type: boolean
        attributeCategories:
          description: Defines the category of the attribute. Samples values are Card Present, Tax, MRPS,
            IBAN, 3DS.
          type: string
    reportConfigRequest:
