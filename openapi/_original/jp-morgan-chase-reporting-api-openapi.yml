            $ref: '#/components/schemas/filterAttribute'
        sectionReportTypeId:
          description: The report type identifier of the section within the report.
          type: string
    sectionRowCountDisplayIndicator:
      description: Indicates the BOOLEAN value to display row count for each report section. This field
        is only applicable when the report is generated in PDF format.
      type: boolean
    totalRowCountDisplayIndicator:
      description: Indicates the BOOLEAN value to display total number of row count in the report for
        all sections. This field is only applicable when the report is generated in PDF format.
      type: boolean
    reportFormatList:
      type: array
      minItems: 0
      description: Format of the report. Default value is CSV
      items:
        $ref: '#/components/schemas/reportFormat'
    reportTypeIds:
      type: array
      minItems: 0
      description: The unique identifier of the types of reports
      items:
        type: string
    reportFormat:
      description: Codifies the document file format as text or binary file format for storing documents
        on a storage media, especially for use by computers.
      type: string
      default: CSV
      enum:
      - CSV
      - PDF
      - XLSX
    lastPage:
      description: Indicates the BOOLEAN value to signify whether or not the response is the final page
        of results.
      type: boolean
      example: true
    next:
      description: Indicates the reference for the next page for paginated response. Use the value of
        next to fetch the next batch of report configs. If the lastPage = TRUE; then the next attribute
        value is not populated.
      type: string
    selectedFields:
      description: Section Selected Fields
      type: object
      properties:
        reportAttributeName:
          $ref: '#/components/schemas/reportAttributeName'
        alias:
          description: The name of the attribute in the report.
          type: string
        constantValueText:
          description: The static text value of the attribute.
          type: string
        aggregateOperationText:
          description: The category of aggregation analytic functions. Allowed values=> count, avg, min,
            max, and sum
          type: string
        conditionalAggregateIndicator:
          description: Indicates the value for aggregate operation if performed on specific condition.
            Allowed values=> true and false.
          type: boolean
        aggregateConditionAttributeName:
          description: The label of the field on which aggregate condition is defined.
          type: string
        aggregateConditionText:
          description: Textual representation of the aggregate condition value.
          type: string
    entityType:
      description: Codifies the level of the merchant relationship as it relates to the acquiring account.
      type: string
    reportingGroup:
      description: Reporting Group Information
      type: object
      required:
      - reportingGroupName
      - reportingGroupDescription
      - childEntityInfo
      properties:
        reportingGroupId:
          description: Unique identifier of a reporting group.
          type: string
          readOnly: true
        reportingGroupName:
          description: The name of the reporting group.
          type: string
        reportingGroupType:
          description: The category of the reporting group. Allowed values are RGPE, RGTD, RGFTI, RGBU,
            RGCO, RGH.
          type: string
          readOnly: true
        reportingGroupDescription:
          description: The textual description of the reporting group.
          type: string
        childEntityInfo:
          type: array
          minItems: 0
          description: List of child entities.
          items:
            $ref: '#/components/schemas/childEntity'
        reportingGroupStatus:
          description: The current status of the reporting group. Allowed values are active, inactive
          type: string
          readOnly: true
    reportingGroupResponse:
      description: Reporting Group Response
      type: object
      required:
      - next
      - reportingGroupList
      - lastPage
      properties:
        next:
          $ref: '#/components/schemas/next'
        reportingGroupList:
          type: array
          minItems: 0
          description: List of reporting group available
          items:
            $ref: '#/components/schemas/reportingGroup'
        lastPage:
          $ref: '#/components/schemas/lastPage'
    updateReportingGroup:
      description: Report group update information
      type: object
      required:
      - reportingGroupType
      properties:
        reportingGroupType:
          description: The category of the reporting group. Allowed values are RGPE, RGTD, RGFTI, RGBU,
            RGCO, RGH.
          type: string
        reportingGroupName:
          description: The name of the reporting group.
          type: string
        reportingGroupDescription:
          description: The textual description of the reporting group.
          type: string
        reportingGroupStatus:
          description: The current status of the reporting group. Allowed values are active, inactive.
          type: string
        childEntityInfo:
          type: array
          minItems: 0
          description: List of child entities.
          items:
            $ref: '#/components/schemas/childEntity'
    childEntity:
      description: Child Entity Information
      type: object
      properties:
        entityType:
          description: The level of the merchant relationship as it relates to the acquiring account.
            Allowed values are PE, TD, FTI, BU, CO, RGPE, RGTD, RGFTI, RGBU, RGCO, RGH.
          type: string
        entityIds:
          type: array
          minItems: 0
          description: List of child entities for the reporting group.
          items:
            type: string
