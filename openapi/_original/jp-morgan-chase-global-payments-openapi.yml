    PaymentReturn:
      type: object
      title: PaymentReturn
      description: Representation of the payment return instruction
      required:
      - paymentType
      - originalPaymentIdentifiers
      - country
      properties:
        paymentType:
          type: string
          enum:
          - RTP
          description: The type of payment
        originalPaymentIdentifiers:
          type: object
          title: OriginalPaymentIdentifiers
          description: 'Original payment identifiers to locate and facilitate the requested request type


            ***NOTE: Clients MUST satisfy at least one of the below conditions to locate the original
            payment***


            | Condition    | Details                                                                                   |

            | ------------ | ----------------------------------------------------------------------------------------
            |

            | Condition #1 | At least one of the original payment identifiers such as `bankReferenceNumber`
            or `clearingSystemReference` or `paymentId` |

            | Condition #2 | `originalValue`, `valueDate` and originalPaymentIdentifiers.`endToEndId`                 |

            '
          properties:
            bankReferenceNumber:
              type: string
              description: 'JPMC generated unique reference number


                ***NOTE: Clients receive this bankReferenceNumber today via Payment Receipts API that
                delivers credit confirmation notifications***

                '
              minLength: 1
              maxLength: 12
            account:
              type: object
              title: Account
              description: Account details
              required:
              - accountNumber
              - financialInstitutionId
              properties:
                accountNumber:
                  type: string
                  description: Account number
                  minLength: 2
                  maxLength: 14
                financialInstitutionId:
                  type: object
                  title: FinancialInstitutionId
                  description: Financial institution
                  required:
                  - id
                  - idType
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 11
                      description: Financial Institution Identifier
                    idType:
                      type: string
                      minLength: 1
                      maxLength: 35
                      description: Type of identifier
            clearingSystemReference:
              type: string
              description: 'A unique reference assigned by the clearing system such as Central Banks which
                does the payment settlements.

                ***NOTE: Clients receive this clearingSystemReference today via Payment Receipts API that
                delivers credit confirmation notifications***

                '
              minLength: 1
              maxLength: 50
            paymentId:
              type: string
              minLength: 1
              maxLength: 128
              description: Unique payment initiation identification number
            endToEndId:
              $ref: '#/components/schemas/EndToEndId'
            originalValue:
              type: object
              title: OriginalValue
              description: Original payment amount and currency
              required:
              - currency
              - amount
              properties:
                currency:
                  $ref: '#/components/schemas/IsoCurrencyCode'
                amount:
                  $ref: '#/components/schemas/AmountDecimal'
            valueDate:
              type: string
              format: date
              description: Date at which the funds become available to the creditor in ISO 8601 `yyyy-mm-dd`
                format
          minProperties: 1
        paymentIdentifiers:
          type: object
          title: PaymentIdentifiers
          description: Identifiers associated with the Payment Instruction throughout its lifecycle.
          required:
          - endToEndId
          properties:
            endToEndId:
              type: string
              description: Client assigned unique end to end identifier for the return request
              minLength: 1
              maxLength: 128
        country:
          $ref: '#/components/schemas/IsoCountryCode'
        chargeBearer:
          type: string
          description: Party bearing the transaction fees
          enum:
          - CREDITOR
          - DEBTOR
          - SHARED
        returnType:
          type: string
          description: Specifies whether the full amount or partial amount to be returned
          enum:
          - FULL
          - PARTIAL
        value:
          description: Return value
          title: ReturnValue
          type: object
          required:
          - amount
          properties:
            amount:
              $ref: '#/components/schemas/AmountDecimal'
            currency:
              $ref: '#/components/schemas/IsoCurrencyCode'
        reason:
          type: object
          title: ReturnReason
          description: Captures the reason for the return either in coded or proprietary format.
          properties:
            code:
              type: string
              description: Reason code as applicable per market
              minLength: 4
              maxLength: 4
            proprietary:
              type: string
              description: Proprietary value
              minLength: 1
              maxLength: 35
          minProperties: 1
          maxProperties: 1
        additionalInformation:
          type: array
          description: To capture any additional information about the return
          items:
            type: string
            minLength: 1
            maxLength: 105
          minItems: 1
          maxItems: 5
    PaymentReturnDuplicateResponse:
