            \ **Indonesia RTP**\n| **CXBSNS**          \t| General Business Payment    \t|**Hong Kong\
            \ RTP**: Credit transfer\n| **CXMRCH**          \t| FPS Merchant Payment        \t|**Hong\
            \ Kong RTP**: Credit transfer\n| **CXTOPU**          \t| Account Top-up Payment      \t|**Hong\
            \ Kong RTP**: Credit transfer\n| **WEALTH_TRANSFER** \t|                              \t|**Indonesia\
            \ RTP***\n| **INVESTMENT**      \t|                              \t|**Indonesia RTP***\n|\
            \ **PURCHASE**        \t|                              \t|**Indonesia RTP***\n| **ACCTVERIFY**\
            \      \t|                              \t| **US ACH**\n| **RECLAIM**         \t|        \
            \                      \t| **US ACH**\n| **RETRY_PYMT**      \t|                         \
            \     \t| **US ACH**\n| **REVERSA**         \t|                              \t| **US ACH**\n\
            | **HCCLAIMPMT**      \t|                              \t| **US ACH**\n| **OTHER**       \
            \    \t|                              \t|**Indonesia RTP***\n\n**Note**:  Free form text is\
            \ also allowed for **US ACH** but limited to 10 chars"
