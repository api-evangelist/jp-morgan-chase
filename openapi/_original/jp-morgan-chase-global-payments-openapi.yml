          type: object
          title: Links
          description: Links to related resources.
          required:
          - paymentReturn
          properties:
            paymentReturn:
              type: string
              description: URI (Relative URI) of the referenced payment return resource.
              format: uri-reference
              example: /payment/v2/payments/returns/95364018-be32-4c71-9618-f1ceba78f28c
              pattern: ^/[a-zA-Z0-9/_\-\.~:\?#\[\]@!\$&'\(\)\*\+,;=%]+$
        reason:
          type: object
          title: Reason
          description: Details of the duplicate reason.
          required:
          - code
          - location
          - message
          properties:
            code:
              type: string
              example: '11909'
              minLength: 5
              maxLength: 5
              pattern: ^[0-9]+$
            location:
              type: string
              enum:
              - BODY
              - HEADER
              - QUERY
              - PATH
              example: BODY
            message:
              type: string
              example: This is a business duplicate, refer to documentation.
              minLength: 1
              maxLength: 140
