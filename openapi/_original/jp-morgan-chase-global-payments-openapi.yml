      type: array
      minItems: 1
      maxItems: 3
      items:
        title: AgentInstruction
        type: object
        description: Agent instruction details
        properties:
          code:
            description: "Specifies the  agent instruction from a predefined list of codes.\n\n**Creditor\
              \ Agent Instruction Codes EMEA/WHEM**:\n  - **CHQB** : Pay creditor customer only by cheque.\
              \ \n  - **HOLD** : creditor customer/claimant will call; pay upon identification.\n  - **PHOB**\
              \ : Please advise/contact creditor/claimant by phone.\n  - **TELB** : Please advise/contact\
              \ creditor/claimant by the most efficient means of telecommunication.\n\n---\n\n**Debtor\
              \ Agent Instruction Codes EMEA**:\n  - **ACC** : Instructions following are for the creditor\
              \ agent.\n  - **ADVBEN** : Advise Beneficiary\n  - **ADVREM** : Advise Remitter\n  - **BNF**\
              \ : The information that follows is for the creditor agent.\n  - **FXEQUIV** : Instruction\
              \ to pay in FX equivalent\n  - **INS** : The debtor which instructed the Sender to execute\
              \ the transaction.\n  - **INT** : Instructions for the Intermediary Agent of the message.\n\
              \n**Debtor Agent Instruction Codes EMEA/WHEM**:\n- ACC\n- BENONLY \n- BENOUR\n- BNF\n- CHECK\n\
              - CHEQUE\n- DEDUCT\n- FIND\n- HOLD\n- INS\n- INT\n- NOCRDED\n- NODEDUCT\n- NOFIND\n- NOPREADV\n\
              - PHON\n- PHONBEN\n- PHONIBK\n- PREADV\n- PREADVISE\n- REC\n- SENDCNS\n- TELE\n- TELEBEN\n\
              - TELEIBK\n- TELEX\n- TELEXBEN\n- TELEXIBK"
            type: string
            minLength: 1
            maxLength: 140
            example: HOLD
          instruction:
            description: Optional special agent(s) instruction code/text approved for use.
            minLength: 1
            maxLength: 2048
            type: string
