      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/walletResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '408':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
      security:
      - BearerAuth: []
      operationId: postWalletDecryptions
      x-operation-id-source: derived
    servers:
    - url: https://api-ms.payments.jpmorgan.com/api/v2
      description: PRODUCTION - OAUTH
    - url: https://cat-api.merchant.jpmorgan.com/api/v2
      description: CLIENT TESTING - OAUTH
    - url: https://api-mock.payments.jpmorgan.com/api/v2
      description: MOCK
  /transactions:
    servers:
    - url: https://api.payments.jpmorgan.com/embedded/v2
      description: PRODUCTION - MTLS
    - url: https://api-mock.payments.jpmorgan.com/embedded/v2
      description: MOCK
    - url: https://api-sandbox.payments.jpmorgan.com/embedded/v2
      description: CLIENT TESTING - MTLS
    post:
      summary: Create transaction
      description: Creates a new transaction, such as a payment via ACH, Wire or Real Time Payments (RTP).
      operationId: createTransactionV2
      tags:
      - Transactions
      parameters:
      - $ref: '#/components/parameters/token'
      requestBody:
        required: true
        description: Contains the required information to create a payment transaction.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTransactionRequestV2'
            examples:
              Post a payment to a registered recipient using ACH:
                summary: Create Transaction - ACH Payout
                description: Create Transaction - ACH PayOut
                value:
                  transactionReferenceId: hisSuUVnakPD9qSA
                  amount: 3100
                  currency: USD
                  type: ACH
                  recipientId: 616d93a1-ce53-4c71-b03b-02a11396db39
                  debtorAccountId: d3371713f14e423f82065c9486ebe15b
                  memo: Memo for Transaction for 1000010400
              Post a payment to a registered recipient using RTP:
                summary: Create Transaction - RTP Payout
                description: Create Transaction - RTP PayOut
                value:
                  transactionReferenceId: 5wQN9wSJl4rugac4
                  amount: 3100
                  currency: USD
                  type: RTP
                  recipientId: 616d93a1-ce53-4c71-b03b-02a11396db39
                  debtorAccountId: d3371713f14e423f82065c9486ebe15b
                  memo: Memo for Transaction for 1000010400
              Post a payment to a registered recipient using WIRE:
                summary: Create Transaction - WIRE Payout
                description: Create Transaction - WIRE PayOut
                value:
                  transactionReferenceId: iIbqZdlNuuogLaBo
                  amount: 3100
                  currency: USD
                  type: WIRE
                  recipientId: 616d93a1-ce53-4c71-b03b-02a11396db39
                  debtorAccountId: d3371713f14e423f82065c9486ebe15b
                  memo: Memo for Transaction for 1000010400
              Post a payment to an unregistered recipient using ACH:
                summary: Create Transaction - Payout with recipient details
                description: Create Transaction - Payout with recipient details
                value:
                  transactionReferenceId: uilRuUUkakPD9qGF
                  amount: 3100
                  currency: USD
                  type: ACH
                  recipient:
                    partyDetails:
                      address:
                        addressLine1: 345 Wouda St
                        addressLine2: Malibu Point
                        addressLine3: Greater Woking
                        city: Springfield
                        countryCode: US
                        state: ND
                        postalCode: '58008'
                      type: INDIVIDUAL
                      firstName: Jon
                      lastName: Smith
                      businessName: Widget Co.
                      contacts:
                      - contactType: PHONE
                        countryCode: '+1'
                        value: '6316215110'
                    account:
                      number: '021000021'
                      type: CHECKING
                      routingCodeType: USABA
                      routingNumber: '021000021'
                      countryCode: US
                  debtorAccountId: d3371713f14e423f82065c9486ebe15b
                  memo: Memo for Transaction for 1000010400
              Transfer funds from one account to another:
                summary: Create Transaction - V2V
                description: Create Transaction - V2V
                value:
                  transactionReferenceId: 39d222165fb1488c896b940321550f77
                  amount: 3100
                  type: TRANSFER
                  currency: USD
                  creditorAccountId: 616d4c7102a11396db39hjfsd88980
                  debtorAccountId: d3371713f14e423f82065c9486ebe15b
              Post an Fx payment to a registered recipient using ACH:
                summary: Create Fx Transaction - ACH Payout
                description: Create Fx Transaction - ACH PayOut
                value:
                  transactionReferenceId: fx1SuUVnakPD9qFX
                  amount: 3100
                  currency: USD
                  targetCurrency: AUD
                  type: ACH
                  recipientId: 616d93a1-ce53-4c71-b03b-02a11396db39
                  debtorAccountId: d3371713f14e423f82065c9486ebe15b
                  memo: Memo for Transaction for 1000010400
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponseV2'
              examples:
                CreateTransactionRes:
                  $ref: '#/components/examples/CreateTransactionPayoutACHRes'
                CreateTransactionPayoutWIRERes:
                  $ref: '#/components/examples/CreateTransactionPayoutRTPRes'
                CreateTransactionPayoutRTPRes:
                  $ref: '#/components/examples/CreateTransactionPayoutWIRERes'
                CreateTransactionV2VRes:
                  $ref: '#/components/examples/CreateTransactionV2VRes'
                CreateTransactionPayOutBookRes:
                  $ref: '#/components/examples/CreateTransactionPayOutBookRes'
                CreateTransactionPayIntoRes:
                  $ref: '#/components/examples/CreateTransactionPayIntoRes'
                CreateTransactionFxACHRes:
                  $ref: '#/components/examples/CreateTransactionFxACHRes'
        '400':
          $ref: '#/components/responses/400V2'
        '401':
          $ref: '#/components/responses/401V2'
        '403':
          $ref: '#/components/responses/403V2'
        '404':
          $ref: '#/components/responses/404V2'
        '500':
          $ref: '#/components/responses/500V2'
        '503':
          $ref: '#/components/responses/503V2'
  /transactions/{id}:
    servers:
    - url: https://api.payments.jpmorgan.com/embedded/v2
      description: PRODUCTION - MTLS
    - url: https://api-mock.payments.jpmorgan.com/embedded/v2
      description: MOCK
    - url: https://api-sandbox.payments.jpmorgan.com/embedded/v2
      description: CLIENT TESTING - MTLS
    get:
      summary: Get transaction
      description: Returns details for a specific transaction using its unique identifier.
      operationId: getTransactionV2
      tags:
      - Transactions
      parameters:
      - $ref: '#/components/parameters/token'
      - name: id
        in: path
        description: Unique identifier for a transaction.
        required: true
        example: m6p8kqkk5hjne3
        schema:
          type: string
      responses:
        '200':
          description: Ok.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionGetResponseV2'
              examples:
                GetTransactionByIdRes:
                  $ref: '#/components/examples/GetTransactionByIdRes'
        '400':
          $ref: '#/components/responses/400V2'
        '401':
          $ref: '#/components/responses/401V2'
        '403':
          $ref: '#/components/responses/403V2'
        '404':
          $ref: '#/components/responses/404V2'
        '500':
          $ref: '#/components/responses/500V2'
        '503':
          $ref: '#/components/responses/503V2'
components:
  schemas:
    cryptogramDetail:
      description: Cryptogram Detail Information
      type: object
      properties:
        tokenAuthenticationValue:
          description: Cryptogram provided by the wallet provider when authenticated with token
          type: string
        authenticationValue:
          description: Cryptogram provided by the wallet provider when 3DS is used
          type: string
        applicationTransactionCounter:
          description: Enumerates the attempts an authorization request was presented for a single cardholder interaction.
          type: integer
        cryptogramInformationData:
          description: Cryptogram Information
          type: string
        deviceManufacturerId:
          description: Device Manufacturer Id
          type: string
        paymentDataType:
          description: Payment Data Type Code
          type: string
        messageId:
          description: A random generated value for each Google wallet payload
          type: string
        gatewayMerchantId:
          description: Identifies a merchant account maintained by an external party and is used as a reference identifier during transaction processing.
          type: string
        electronicCommerceIndicator:
          description: Describes the Electronic Commerce Indicator used in cardholder authentication on a network token
          type: string
        cryptogramExpirationTimestamp:
          description: Designates the hour, minute, and second in a specific day used to determine when the cryptogram message no longer valid
          type: string
        tokenProvisioningVerificationValue:
          description: Contains Paze wallet authentication value received from payments networks for card on file or network token provisioning transactions. Also knows as dynamic EVC- Enrollment verification value for certain networks.
          type: string
        tokenProvisioningVerificationExpirationTimestamp:
          description: Designates the hour, minute, and second in a specific day used to determine when the Token provisioning Verification value is  no longer valid.
          type: string
    walletResponse:
      description: Wallet response object
      type: object
      properties:
        requestId:
          description: A uniquely generated identifier for a request which the consuming resource uses to recognize subsequent retries of the same request.
          type: string
        walletTransactionId:
          $ref: '#/components/schemas/walletTransactionId'
        messages:
          $ref: '#/components/schemas/messages'
        accountHolder:
          $ref: '#/components/schemas/accountHolder'
        cryptogramDetail:
          $ref: '#/components/schemas/cryptogramDetail'
        multiTokenAuthenticationResponses:
          type: array
          minItems: 0
          description: List of Multi Token Authentication Responses
          items:
            $ref: '#/components/schemas/multiTokenAuthenticationResponse'
    messages:
      description: A list of errors and warnings
      type: object
      properties:
        responseStatus:
          $ref: '#/components/schemas/responseStatus'
        responseCode:
          $ref: '#/components/schemas/responseCode'
        responseMessage:
          $ref: '#/components/schemas/responseMessage'
        validationErrors:
          type: array
          minItems: 0
          description: validationErrors
          items:
            $ref: '#/components/schemas/validationMessage'
    code:
      description: Codifies a raised exception encountered by an internal or external system, sub-system, interface, job, module, system component with which the web service application interfaces.  In this instance it refers to the error raised when reporting job failed.
      type: string
    consumerInfo:
      description: Consumer Information
      type: object
      properties:
        firstName:
          description: First name of the consumer
          type: string
        lastName:
          description: Last name of the consumer
          type: string
        fullName:
          description: Full name of the consumer
          type: string
        emailAddress:
          description: Email address of the consumer
          type: string
        countryCode:
          description: Country code values based on ISO standards
          type: string
        languageCode:
          description: Consumer's prefer language based on ISO standard
          type: string
        mobileTelephoneNumber:
          description: Consumer's mobile number
          type: string
    walletCardData:
      description: additional card information received from digital wallet provider.
      type: object
      properties:
        cardArtList:
          type: array
          minItems: 0
          description: List of Card Art information
          items:
            $ref: '#/components/schemas/cardArt'
        cardMetadata:
          $ref: '#/components/schemas/cardMetadata'
        walletMerchantTokenReferenceId:
          description: 'Identifies uniquely a token provisioning request assigned by token service/vault and provided to Issuer and Wallet Provider. This can be used as a reference to the token number that is assigned for an account when provisioning completes. Example: DNITHE461927644624368716'
          type: string
    multiTokenAuthenticationResponse:
      description: This is used for specifying an attribute used on a model for object that will contain one or more attributes
      type: object
      properties:
        externalMerchantId:
          description: The sub-merchant identifier provided to wallet provider by the merchant.
          type: string
        walletServiceProviderCryptogram:
          description: Cryptogram provided by the wallet provider when authenticated with token
          type: string
        transactionAmount:
          description: Payment network-generated cryptogram for the submerchant.
          type: integer
          format: int64
    responseMessage:
      description: Long explanation of the response code
      type: string
    responseCode:
      description: Short explanation of the response code
      type: string
    cardArt:
      description: Card art information of a payment card.
      type: object
      properties:
        name:
          description: The name of card art that is used to build virtual replication of actual physical card art.
          type: string
        type:
          description: The category of card art that is used to build virtual replication of actual physical card art.
          type: string
        url:
          description: A reference to a web resource on the internet specifying its location on a computer network and a mechanism for retrieving for the card art that is used to build virtual replication of physical card.
          type: string
    expiry:
      description: Expiration for the account number
      type: object
      properties:
        monthNumber:
          description: Identifies a unique occurrence of the month within a calendar year (e.g., 1 = January, 2 = February, 12 = December).
          type: string
        yearNumber:
          description: Identifies the century and year portion of a date. (e.g., 2014, 2015)
          type: string
    cardMetadata:
      description: Card Metadata information
      type: object
      properties:
        expirationDate:
          description: Designates the year, month and day when a card account reaches the end of the current contractual period and ceases allowing transactions.
          type: string
        accountSuffixNumber:
          description: Identifies a sequential number for an account when it is transferred. The Account Suffix Number is incremented and a new record is created within the Account Reference Number when the customer reports the card lost / stolen or when fraud is suspected on the account. This new record contains the fraudulent or potentially fraudulent balance. The 00 suffix is always the non-fraudulent account record.
          type: string
    message:
      description: Provides textual description of a problem that has occurred and is preventing the system from completing a task. Messages can be a confirmation, warning or notification, and can trigger the system to apply a customized default value or override to a field, record or file, halt or postpone processing, skip or reject the entry generating the problem. Messages can be displayed on-screen in the user interface or in reporting.
      type: string
    walletTransactionId:
      description: Value provided by the wallet provider.
      type: string
    address:
      description: Address Information
      type: object
      properties:
        addressType:
          description: Codifies the classification given to the various addresses captured for a party, such as Doing Business As Address, Legal Entity Address, and Tax Address.
          type: string
        line1:
          description: Line 1 of the address
          type: string
        line2:
          description: Line 2 of the address
          type: string
        city:
          description: Name of the city
          type: string
        state:
          description: Name of the state
          type: string
        postalCode:
          description: Zip code for the address
          type: string
        countryCode:
          description: Country code for the address, valid values are based on ISO standards.
          type: string
    walletRequest:
      description: Wallet request object
      type: object
      required:
      - encryptedPayloadText
      properties:
        walletTransactionId:
          $ref: '#/components/schemas/walletTransactionId'
        walletApplicationData:
          description: A Base64-encoded string provided by the wallet provider.
          type: string
          writeOnly: true
        encryptedPayloadText:
          description: Merchant provides the unreadable encrypted payload
          type: string
        publicKey:
          description: The associated cipher key for ApplePay and GooglePay used when encrypts the payload.
          type: string
        version:
          description: Value provided by Apple and Google wallets.
          type: string
        walletProvider:
          description: Identifies the type of wallet being used, ApplePay, GooglePay, or Paze
          type: string
          enum:
          - APPLE_PAY
          - GOOGLE_PAY
          - PAZE
        keyHash:
          description: 'Identifies a hash value based only on primary keys for the dataset.  (Note: It is required for ApplePay)'
          type: string
        digitalSignature:
          description: Value provided by wallet provider.
          type: string
        accountNumberMaskingIndicator:
          description: Optional parameter that allows the integrator to specify whether the API response should include a masked version of the account number. When set to true, the API will return the account number in a format that obscures sensitive information, based on the preference setup at the merchant level. Merchants can choose how the masked PAN (Primary Account Number) is displayed, such as showing the first six and last four digits or only the last four digits. This feature is designed to enhance security by ensuring that full account numbers are not exposed in the API response, while still providing enough information for identification and verification purposes.
          type: boolean
    responseStatus:
      description: 'Status for the request. Valid Values: ERROR,SUCCESS, DENIED'
      type: string
    validationMessage:
      description: Object containing information in the file
      type: object
      properties:
        code:
          $ref: '#/components/schemas/code'
        message:
          $ref: '#/components/schemas/message'
        entity:
          description: The moniker given to the module or program where the error generated.
          type: string
    accountHolder:
      description: Card owner properties
      type: object
      properties:
        accountNumber:
          description: The token (DPAN) provided by wallet provider, please note GooglePay wallet provides PAN for certain use case.
          type: string
        accountNumberType:
          description: The type of card
          type: string
        expiry:
          $ref: '#/components/schemas/expiry'
        authenticationMethod:
          description: Codifies how the Three Domain Secure (3-D Secure or 3DS) Requestor (merchant) authenticated the cardholder before or during the transaction.
          type: string
        transactionAmount:
          description: The amount of the transaction
          type: integer
          format: int64
        currencyCode:
          description: 'Currency code of the transaction. Example: ''USD'''
          type: string
        paymentAccountReference:
          description: A unique identifier associated with a specific cardholder primary account number (PAN) used to link a payment account represented by that PAN to affiliated payment tokens
          type: string
        billingAddress:
          $ref: '#/components/schemas/address'
        consumerInfo:
          $ref: '#/components/schemas/consumerInfo'
        walletCardData:
          $ref: '#/components/schemas/walletCardData'
    PaymentTypeResponse:
      description: 'The transaction type indicates the nature of the transaction. Valid values are:


        | Value | Description |

        |-------|-------------|

        | `RTP` | Realtime Transactions |

        | `ACH` | ACH Transactions |

        | `WIRE` | Wire Transactions |

        | `TRANSFER` | Transactions internal to JPMorgan |

        | `REVERSAL` | Transaction reversal (cannot be initiated through the API) |

        | `RETURN` | Transaction return (cannot be initiated through the API) |

        | `OTHER` | Other transaction types (cannot be initiated through the API) |

        | `CARD` | Push to Card Transactions |

        | `FEE` | Fee transactions (cannot be initiated through the API) |


        **Note:** Certain types cannot be initiated through the API and, as a result, are excluded from the transaction request type field.

        '
      type: string
      enum:
      - RTP
      - WIRE
      - ACH
      - TRANSFER
      - REVERSAL
      - RETURN
      - OTHER
      - CARD
      - FEE
      example: ACH
    AccountType:
      type: string
      enum:
      - CHECKING
      - IBAN
      - SAVINGS
      description: Type of bank account.
      example: CHECKING
    TransactionStatus:
      description: "The current status of the transaction as it is processed:\n * `PENDING` - The transaction is still being processed.\n * `CANCELED` - The transaction has been canceled.\n * `COMPLETED` - The transaction has been completed.\n * `COMPLETED_WITH_EXCEPTIONS` - The transaction has completed, but not all of the requested criteria has been fulfilled.\n * `REJECTED` - The transaction has been rejected and will not be completed.\n * `RETURNED` - The payment rail failed to deliver funds to the recipient, so the payment was returned to the originator. \n * `UNDEFINED` - The status of this transaction cannot be found.\n"
      type: string
      enum:
      - PENDING
      - CANCELED
      - COMPLETED
      - COMPLETED_WITH_EXCEPTIONS
      - COMPLETED_NOT_IN_TARGET_WALLET
      - REJECTED
      - RETURNED
      - PARTIALLY_COMPLETED
      - UNDEFINED
      example: PENDING
    PaymentType:
      description: 'The type of transaction being initiated. Valid values are:


        | Value | Description |

        |-------|-------------|

        | `RTP` | Realtime Transactions |

        | `ACH` | ACH Transactions |

        | `WIRE` | Wire Transactions |

        | `TRANSFER` | Transactions internal to JPMorgan |

        | `CARD` | Push to Card Transactions |

        '
      type: string
      enum:
      - RTP
      - WIRE
      - ACH
      - TRANSFER
      - CARD
      example: ACH
    TransactionRecipientDetailsV2:
      description: Payment recipient, either recipient or recipient id must be provided for Payouts
      type: object
      anyOf:
      - type: object
        required:
        - account
      properties:
        partyDetails:
          $ref: '#/components/schemas/RecipientPartyDetails'
        account:
          $ref: '#/components/schemas/RecipientAccount'
        recipientType:
          $ref: '#/components/schemas/RecipientType'
    PostTransactionV2FxInformation:
      description: Foreign exchange information for cross-border transactions.
      type: object
      properties:
        rateId:
          type: string
          description: Unique identifier for the foreign exchange rate
          example: R1C8E57DF6964F981D6DDB5EEf78D8
        clientSpread:
          type: string
          description: The rate at which you charge for an FX transfer. You must express this as a decimal figure. For example, if you take a commission of 10%, the spread is expressed as 0.1
          example: '0.5'
        purposeCode:
          type: string
          description: The code relating to the purpose of the payment. This is often required by countries into which money is being paid.
          example: P0102
    RoutingNumber:
      type: string
      minLength: 1
      maxLength: 13
      pattern: ^[A-Za-z0-9]([A-Za-z0-9\-]{0,11})[A-Za-z0-9]$
      description: Routing number corresponding to the routing code type
      example: '021000021'
    AccountNumber:
      type: string
      pattern: ^[A-Z0-9]{1,35}$
      description: Demand Deposit Account number or International Account Number (IBAN).
      example: '021000021'
    PostTransactionRequestBase:
      type: object
      required:
      - currency
      - transactionReferenceId
      - amount
      properties:
        transactionReferenceId:
          description: A unique reference ID that you must generate and provide for each transaction.
          type: string
          pattern: '[_0-9A-Za-z]+'
          minLength: 1
          maxLength: 35
          example: Inv-Pay-1234
        type:
          $ref: '#/components/schemas/PaymentType'
        debtorAccountId:
          description: ID of the account to make the payment from.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^(.|\s)*\S(.|\s)*$
          example: dc2eda9084bf40b7a1d8baa8c5e0ea0ax
        creditorAccountId:
          description: ID of the account to make the payment to.
          type: string
          minLength: 1
          maxLength: 35
          pattern: ^(.|\s)*\S(.|\s)*$
          example: dc2eda9084bf40b7a1d8baa8c5e0ea0ax
        amount:
          description: The amount that is moved out or into your account in the currency specified
          type: number
          minimum: 0.01
          example: 100
        currency:
          description: This denotes the currency of the payment in ISO 4217 Alpha-3 Currency Code format
          type: string
          enum:
          - USD
          example: USD
        targetCurrency:
          $ref: '#/components/schemas/TargetCurrency'
        targetAmount:
          description: This is the transaction value in currency (referred by `targetCurrency`) which needs to be credited to the creditor
          type: number
          minimum: 0.01
          example: 100
        recipientId:
          description: The resource Id of the recipient to be used in this transaction.  Must have been pre-registered via the /recipient API
          type: string
          example: a8eb71c9-7bbb-41f2-8d9e-b0f5
        localInstrumentCode:
          description: 'Each ACH payment uses a Standard Entry class code (SEC) to indicate account type and authorization method used. <br>

            Defaults to PPD for consumer, `CCD` for business, and `WEB` for direct debits ACH if no mandate method is specified. <br>

            See documentation for further details <br>


            | LocalInstrumentCode | Meaning                                                                |

            |---------------------|------------------------------------------------------------------------|

            | * `CCD`                 | Urgent Payment Net Settlement Corporate Credit or Debit (CCD)          |

            | * `PPD`                  | Pre-arranged Payments or Deposit Transfer(PPD)                         |

            | * `TEL`                  | TELEPHONE Initiated Entry - Used for authorizing payment via telephone |

            | * `WEB`                  | WEB Initiated Entry - Used for authorizing payment over the internet   |

            '
          type: string
          example: PPD
        memo:
          description: Transaction information that states its purpose for easier tracking
          type: string
          pattern: ^(.|\s)*\S(.|\s)*$
          maxLength: 140
          example: Invoice 1234
        fxInformation:
          $ref: '#/components/schemas/PostTransactionV2FxInformation'
        recipient:
          $ref: '#/components/schemas/TransactionRecipientDetailsV2'
    RoutingCodeType:
      type: string
      enum:
      - USABA
      description: Type of routing code.
      example: USABA
    FeeType:
      description: The type of the fee transaction. Use this to differentiate between the fee transactions that were charged and those that were reversed.<br> * `CHARGE` - the fee that was incurred as a result of a transaction.<br> * `REVERSAL` - the fee was incurred and then voided on a transaction.
      enum:
      - CHARGE
      - REVERSAL
      type: string
      example: CHARGE
    PostTransactionRequestV2:
      type: object
      required:
      - currency
      - transactionReferenceId
      allOf:
      - $ref: '#/components/schemas/PostTransactionRequestBase'
    TransactionRequestResponseBase:
      type: object
      properties:
        id:
          description: The resource Id of your transaction to use when looking up details of this transaction.
          type: string
          example: '123434534'
        transactionReferenceId:
          description: Transaction reference ID provided by client
          type: string
          example: inv-pay-1234
        status:
          $ref: '#/components/schemas/TransactionStatus'
        type:
          $ref: '#/components/schemas/PaymentTypeResponse'
        debtorAccountId:
          description: The Id of the on-us account that the transaction amount will be/has been debited from.
          type: string
          example: dc2eda9084bf40b7a1d8baa8c5e0ea0ax
        creditorAccountId:
          description: The Id of the on-us account that the transaction amount will be/has been credited to.
          type: string
          example: dc2eda9084bf40b7a1d8baa8c5e0ea0ax
        amount:
          description: The value of the transaction
          type: number
          example: 100
        currency:
          description: The currency of the transaction
          type: string
          example: USD
        localInstrumentCode:
          description: The code that was used when creating the transaction..
          type: string
          example: PPD
        createdAt:
          description: The date and time the transaction was created.
          type: string
          format: date-time
          example: '2023-02-22T15:05:46.952Z'
        targetCurrency:
          $ref: '#/components/schemas/TargetCurrency'
        targetAmount:
          description: This is the transaction value in currency (referred by `targetCurrency`) which is credited to the creditor
          type: number
          example: 100
        recipientId:
          description: The resource Id of the recipient that was used in this transaction.  Further details of the recipient can be found via the /recipient API
          type: string
          example: a8eb71c9-7bbb-41f2-8d9e-b0f5
        memo:
          description: Transaction information that states its purpose for easier tracking
          type: string
          example: Invoice 1234
        fxInformation:
          $ref: '#/components/schemas/PostTransactionV2FxInformation'
    ApiErrorV2:
      type: object
      description: Schema representing a version 2 API error, including title, HTTP status, and additional context.
      required:
      - title
      properties:
        title:
          type: string
          description: Short humanly-readable title of the error
          example: BAD_REQUEST
          minLength: 1
          maxLength: 512
        httpStatus:
          type: integer
          description: HTTP status code
          minimum: 100
          maximum: 599
          format: int32
          example: 400
        traceId:
          type: string
          description: Internal assigned traced identifier
          minLength: 0
          maxLength: 512
        requestId:
          type: string
          description: Client provided request identifier
          minLength: 0
          maxLength: 512
        context:
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorReasonV2'
          description: Provides additional context and detail on the validation errors
          minItems: 0
          maxItems: 100
    TransactionGetResponseV2FxInformation:
      description: Foreign exchange information for cross-border transactions.
      type: object
      properties:
        rateId:
          type: string
          description: Unique identifier for the foreign exchange rate
          example: R1C8E57DF6964F981D6DDB5EEf78D8
        contractId:
          type: string
          description: Unique identifier for the foreign exchange contract
          example: '917490357'
        exchangeRate:
          type: string
          description: The exchange rate applied to the transaction
          example: '1.44'
        clientSpread:
          type: string
          description: The rate at which you charge for an FX transfer. You must express this as a decimal figure. For example, if you take a commission of 10%, the spread is expressed as 0.1
          example: '0.5'
    TransactionGetResponseBase:
      type: object
      required:
      - id
      - currency
      - paymentDate
      - type
      - status
      properties:
        id:
          type: string
          description: The resource Id of your transaction to use when looking up details of this transaction.
          example: '123434534'
        transactionReferenceId:
          description: Transaction reference id provided by client
          type: string
          example: inv-pay-1234
        originatingId:
          description: Shows the resource ID of the original transaction when a transaction is reversed or returned.
          type: string
          example: ff1b6152-3ea7-4c59-b4ae-606c6497cd52
        ledgerBalance:
          description: The ledger balance shows the total of all settled transactions at the time the request is made. Transactions which are in a pending state and transactions of type hold are excluded from this balance. The ledger balance is updated only when a transaction is settled.
          type: number
          example: 10000
        debtorClientId:
          type: string
          example: '0030000131'
          description: The clientId of the client whose account is to be debited.
        debtorAccountId:
          description: The Id of the on-us account that the transaction amount will be/has been debited from.
          type: string
          example: dc2eda9084bf40b7a1d8baa8c5e0ea0ax
        debtorName:
          description: The name of the account holder making the payment. This is either the name of the account holder's business or their first and last name.
          type: string
          example: JPMC C2
        debtorAccountNumber:
          description: The last 4 digits of the debtor account number - PRN or DDA. The digits are preceded by ... to show that the account number has been masked.
          type: string
          example: '...6044'
        creditorClientId:
          type: string
          example: '0030000131'
          description: The clientId of the client whose account is to be credited.
        creditorAccountId:
          description: The Id of the on-us account that the transaction amount will be/has been credited to.
          type: string
          example: dc2eda9084bf40b7a1d8baa8c5e0ea0ax
        creditorAccountNumber:
          description: The last 4 digits of the creditor account number - PRN or DDA. The digits are preceded by ... to show that the account number has been masked.
          type: string
          example: '...6044'
        creditorName:
          description: The name of the account holder receiving the payment. This is either the name of the account holder's business or their first and last name.
          type: string
          example: JPMC
        recipientId:
          description: The resource Id of the recipient that was used in this transaction.  Further details of the recipient can be found via the /recipient API
          type: string
          example: a8eb71c9-7bbb-41f2-8d9e-b0f5
        amount:
          description: The value of the transaction
          type: number
          example: 100
        targetAmount:
          description: This is the transaction value in currency (referred by `targetCurrency`) which is credited to the creditor
          type: number
          example: 100
        currency:
          description: The currency of the transaction
          type: string
          example: USD
        targetCurrency:
          description: This denotes the currency of the creditor account i.e destination currency to where the funds are moved
          type: string
          example: CAD
        memo:
          description: Transaction information that states its purpose for easier tracking
          type: string
          example: Invoice 1234
        paymentDate:
          description: The scheduled date for the payment to be initiated
          type: string
          format: date
          example: '2022-01-01'
        createdAt:
          description: The date and time the transaction was created.
          type: string
          format: date-time
          example: '2023-02-22T15:05:46.952Z'
        effectiveDate:
          description: The date when the payment completes, accounting for weekends and bank holidays.
          type: string
          format: date
          example: '2023-02-22'
        postingVersion:
          description: A measure of how many times an account has been updated by a new transaction. The posting version is incremented by 1 whenever there's a an event on the account. It can be used to track the order in which transactions have occurred, so you can present the user with the most recent transactions first.
          type: integer
          example: 1
        localInstrumentCode:
          description: The code that was used when creating the transaction.
          type: string
          example: PPD
        fxInformation:
          $ref: '#/components/schemas/TransactionGetResponseV2FxInformation'
        status:
          $ref: '#/components/schemas/TransactionStatus'
