openapi: 3.2.0
info:
  title: Jp Morgan Chase Transactions API
  version: '1.0'
  description: 'Operations tagged Transactions across 2 of this provider''s published API definitions: jp-morgan-chase-wallet-decryption-api-openapi.yml, jp-morgan-chase-transactions-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-ms.payments.jpmorgan.com/api/v2
  description: PRODUCTION - OAUTH
- url: https://cat-api.merchant.jpmorgan.com/api/v2
  description: CLIENT TESTING - OAUTH
- url: https://api-mock.payments.jpmorgan.com/api/v2
  description: MOCK
- url: https://api.payments.jpmorgan.com/embedded/v2
  description: PRODUCTION - MTLS
- url: https://api-mock.payments.jpmorgan.com/embedded/v2
  description: MOCK
- url: https://api-sandbox.payments.jpmorgan.com/embedded/v2
  description: CLIENT TESTING - MTLS
tags:
- name: Transactions
  description: Initiating and processing a payment
paths:
  /wallet-decryptions:
    post:
      summary: Decrypt a Paze, Google Pay, or Apple Pay encrypted wallet bundle
      tags:
      - Transactions
      description: Returns the payment information from an encrypted wallet
      parameters:
      - name: request-id
        in: header
        schema:
          type: string
          maxLength: 40
        description: Merchant identifier for the request. The value must be unique.
        examples:
          Paze Visa:
            value: b57b4b67-0642-4bf0-ab5f-c4bd48e9c418
          Apple Visa:
            value: 63d18f79-2495-4bc2-b4f2-8c5bdb42d70e
          Google Visa:
            value: 2a0d1f35-b977-4769-8fcc-abe7cb5c602b
          Paze Mastercard:
            value: 5ea10587-ce36-4904-9e60-7117d1f91405
          Apple Mastercard:
            value: ec64a37e-e546-4913-8647-f302b2cd6d40
          Apple MPAN:
            value: 97d85c9f-8196-542d-bbbe-6f4447052dbc
          Apple MultiToken:
            value: 96d74c8f-9195-432d-bbbe-5f3337052dbc
          Masked Apple First Six Last Four:
            value: 5e4459f1-7b96-47ca-ab9b-5c15a32e2319
          Masked PAZE Last Four:
            value: 457c33ec-1391-4cff-972b-1d9150495428
          Paze Mastercard Purchase and Card on file:
            value: bdc4251f-7e9e-478e-b39f-3e34d7e893fd
      - name: merchant-id
        in: header
        schema:
          type: string
          example: '991234567890'
          minLength: 8
          maxLength: 12
        description: Identifier for the merchant account
        examples:
          Paze Visa:
            value: '998482157632'
          Apple Visa:
            value: '998482157633'
          Google Visa:
            value: '998482157634'
          Paze Mastercard:
            value: '998482157635'
          Apple Mastercard:
            value: '998482157636'
          Apple MPAN:
            value: '998482157637'
          Apple MultiToken:
            value: '998482157638'
          Masked Apple First Six Last Four:
            value: '998482157639'
          Masked PAZE Last Four:
            value: '998482157640'
          Paze Mastercard Purchase and Card on file:
            value: '998482157651'
      requestBody:
        description: Wallet decryption request information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/walletRequest'
            examples:
              Paze Visa:
                value:
                  encryptedPayloadText: ..K8EAidhF0cOG_N1HcvmvYyeCHIcsmVB6ACDMxVnnZqIGlusl0ixHnOitap6lfkKAg080WYAzi4Fc2cyU2uDm23L_TiH2mS0CYaCRFvid_1p8SUmtkEkfEgVGLy-dNrYKOuzE9t6d0sfYI8a71OgYg5N9Ef2BMNAtz1kTloS83rAhIhWxNbIUE7OZn7dHir8Yh1dKvk0cYngi8P1t6AvTc6MTR8US-L8mzgjxODqVWnBjW7xGjxnUQatsBuZj-jz9w26OqHkz72182defw6
                  walletProvider: PAZE
