      schema:
        title: Location
        type: string
        format: uri-reference
        pattern: ^/[a-zA-Z0-9/_\-\.~:\?#\[\]@!\$&'\(\)\*\+,;=%]+$
      required: true
      examples:
        PaymentLocation:
          value: /payment/v2/payments/95364018-be32-4c71-9618-f1ceba78f28c
        ReturnLocation:
          value: /payment/v2/payments/returns/95364018-be32-4c71-9618-f1ceba78f28c
