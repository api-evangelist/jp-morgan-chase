      - idType
    DeliveryMethod:
      type: string
      minLength: 1
      maxLength: 4
      title: DeliveryMethod
      description: 'Method used to deliver the remittance advice information


        The following methods are allowed


        | Code | Description                      |

        |------|----------------------------------|

        | EMAL | Email                            |

        | URID | Uniform Resource Identifier      |'
    IsoCurrencyCode:
      title: IsoCurrencyCode
