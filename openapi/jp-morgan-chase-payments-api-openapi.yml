    AccountId:
      title: AccountId
      type: string
      minLength: 1
      maxLength: 128
      description: "This field captures a regular account number .\n\n**Maximum length supported for different instruments and markets**:\n\n  | Market/Instrument               \t| Maximum length limits                                         |\n  |-----------------------------------|---------------------------------------------------------------|\n  | UK FPS                          \t| 8 (7 digit A/C numbers should be padded with a leading zero) \t|\n  | SGP RTP                         \t| 35                                                           \t|\n  | AUS RTP                         \t| 35                                                           \t|\n  | HKG FPS                         \t| 35                                                           \t|\n  | IND IMPS                        \t| 35                                                           \t|\n  | P2C US/CA                       \t| 16                                                           \t|\n  | BRA PIX                         \t| 34                                                           \t|\n  | MEX SPEI                        \t| 16                                                           \t|\n  | USA RTP                         \t| 31                                                           \t|\n  | SEPA Instant                    \t| 34 (IBAN)                                                     |\n  | P2I INTERAC                     \t| 35                                                            |\n  | Blockchain (Kinexys) Payments     | 34                                                            |\n  | Chile ACH                       \t| 34                                                            |\n  | US ACH IAT                       \t| 35                                                            |\n  | US ACH NON-IAT                   \t| 17                                                            |\n  | CAD ACH                          \t| 12                                                            |\n  | ACH (BACS)                       \t| 8                                                             |\n  | ACH (SEPA)                       \t| 34 (IBAN)                                                     |"
    PaymentInitiationDuplicateResponse:
      title: DuplicatePaymentResponse
      type: object
      description: Duplicate payment
      required:
      - duplicateOf
      - links
      properties:
        duplicateOf:
          type: object
          title: DuplicateOf
          description: Details of the original Payment Instruction that is identified as a duplicate.
          required:
          - paymentId
          - paymentIdentifiers
          properties:
            paymentId:
              $ref: '#/components/schemas/PaymentId'
            paymentIdentifiers:
              type: object
              title: PaymentIdentifiers
              description: Identifiers associated with the Payment Instruction throughout its lifecycle.
              properties:
                endToEndId:
                  $ref: '#/components/schemas/EndToEndId'
              required:
              - endToEndId
        links:
          type: object
          title: Links
          description: Links to relevant resources associated with the duplicate payment.
          required:
          - payment
          properties:
            payment:
              type: string
              description: URI (Relative URI) of the referenced payment resource.
              example: /payment/v2/payments/95364018-be32-4c71-9618-f1ceba78f28c
              format: uri-reference
              pattern: ^/[a-zA-Z0-9/_\-\.~:\?#\[\]@!\$&'\(\)\*\+,;=%]+$
        reason:
          type: object
          title: Reason
          description: Details of the duplicate reason.
          required:
          - code
          - location
          - message
          properties:
            code:
              type: string
              example: '11909'
              minLength: 5
              maxLength: 5
              pattern: ^[0-9]+$
            location:
              type: string
              enum:
              - BODY
              - HEADER
              - QUERY
              - PATH
              example: BODY
            message:
              type: string
              example: This is a business duplicate, refer to documentation.
              minLength: 1
              maxLength: 140
    DebtorAccountType:
      type: string
      description: 'Mandatory for `SEPA Instant` - Use IBAN

        Mandatory for Blockchain Payments - `DDA`, `BDA` (Blockchain Deposit Account)

        Field not applicable to Alternate Payments (Wallet, Cards)'
      enum:
      - DDA
      - VAM
      - IBAN
      - BDA
      - CACC
      - SVGS
      - CARD
      - EMBEDDED_DDA
      - LIMITED_DDA
      - WALLET
    Account:
      title: Account
      description: Representation of a bank account. Features of the model may vary between different account types.
      oneOf:
      - $ref: '#/components/schemas/PrimaryAccountDetails'
      - $ref: '#/components/schemas/AlternateAccountDetails'
      - $ref: '#/components/schemas/CardAccountDetails'
      example:
        accountNumber: '2367836484747'
        accountType: DDA
        accountCurrency: AUD
    CreditorFinancialInstitutionId:
      type: object
      title: CreditorFinancialInstitutionId
      description: Creditor Financial InstitutionId
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 11
          description: "**BIC**:\n\nSWIFT BIC. Applicable and Mandatory for RTP markets:\n  - Singapore\n  - Malaysia\n\nOptional markets:\n  - SEPA Instant\n  - Mexico\n\nMandatory for Blockchain(Kinexys) Payments:\n  - US\n  - SEPA\n\n**CLEARING_SYSTEM_ID**:\n\nClearing system identifier/member identifier. Applicable and Mandatory for\nRTP markets:\n\n  - UK\n  - Australia\n  - India\n  - Hong Kong\n  - US\n  - Brazil\n\n**ACH**: \n  - Chile\n  - Canada \n\n**WIRE**:\n  - BRAZIL TED"
        idType:
          $ref: '#/components/schemas/FinancialInstitutionIdType'
        branchNumber:
          type: string
          minLength: 1
          maxLength: 5
          description: Branch of the bank or financial institution.
      required:
      - id
      - idType
    AdditionalCreditorFinancialInstitutionId:
      title: AdditionalCreditorFinancialInstitutionId
      description: Additional Creditor FinancialInstitution Id
      type: object
      properties:
        id:
          type: string
          description: Financial Institution Identifier
          minLength: 1
          maxLength: 11
        idType:
          $ref: '#/components/schemas/FinancialInstitutionIdType'
        branchNumber:
          type: string
          description: 'Branch of the bank or financial institution.

            - Applicable and Mandatory for Brazil PIX only'
          minLength: 1
          maxLength: 5
      required:
      - id
      - idType
    RateDecimal:
      title: RateDecimal
      type: string
      description: 'A String representation of a (potentially) decimal positive rate value. '
      minLength: 1
      maxLength: 6
      pattern: ^\d+(\.\d+)?$
      example: '5.00'
    ClearingSystem:
      type: object
      description: Details of the clearing system used to process the payment instruction
      title: ClearingSystem
      properties:
        name:
          type: string
          description: Name of the clearing system
          minLength: 3
          maxLength: 10
        reference:
          type: string
          description: A unique reference assigned by the clearing system to unambiguously identify the instruction
          minLength: 1
          maxLength: 128
    PaymentContext:
      title: Payment Context
      type: string
      description: 'Specifies the context of the payment flow:

        - **WIRES** Specific payment context:

        |Payment Context  | description

        |-----------------|-----------------

        |**FI**           | Financial Instition initiated flow

        |**CUSTOMER**     | CUSTOMER  Initated flow'
      enum:
      - FI
      - CUSTOMER
    CreditorTaxInformation:
      type: object
      description: Creditor Tax Information
      title: CreditorTaxInformation
      required:
      - taxId
      properties:
        taxId:
          type: string
          minLength: 1
          maxLength: 35
          description: 'Maximum lengths allowed per instrument/market :-

            - **Chile ACH**: 35'
        taxpayerCategory:
          type: string
          enum:
          - INDIVIDUAL
          - CORPORATE
        vatBranchCode:
          $ref: '#/components/schemas/VatBranchCode'
    IndividualId:
      type: object
      title: IndividualId
      required:
      - individualId
      description: "Can be used if organization ID is not populated, when the underlying payer is an Individual. It should be used together with Ultimate Debtor Name and address, and it should contain the payment account number of the underlying payer. In case the transfer has not been initiated from a payment account, the value populated should be a unique transaction identifier of the underlying payer which permits the traceability of the transaction back to them\n\nApplicable RTP markets:\n\n    SEPA \n    Mexico \n    UK\n    United States\n\nACH markets:\n\n    Chile"
      properties:
        individualId:
          type: string
          description: Unique and unambiguous identification of an individual
          minLength: 1
          maxLength: 35
        issuer:
          type: string
          description: Entity that assigns the identification
          minLength: 1
          maxLength: 35
        schemeName:
          description: Name of the identification scheme
          title: SchemeName
          type: object
          minProperties: 1
          maxProperties: 1
          properties:
            code:
              type: string
              description: Name of the identification scheme in a coded form
              minLength: 1
              maxLength: 4
            proprietary:
              type: string
              description: 'Specifies the type of scheme with a proprietary value.

                - **Note**: For AU Superannuation payment (category payment), populate "USI"'
              minLength: 1
              maxLength: 35
    Invoicee:
      type: object
      title: Invoicee
      description: Invoicee party identification
      properties:
        partyId:
          $ref: '#/components/schemas/PartyId'
        name:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of the party
        dateAndPlaceOfBirth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        countryOfResidence:
          $ref: '#/components/schemas/IsoCountryCode'
        postalAddress:
          $ref: '#/components/schemas/Address'
    DebtorAlternateAccountDetails:
      type: object
      description: Alternate account details
      title: AlternateAccountDetails
      required:
      - alternateAccountIdentifier
      properties:
        alternateAccountIdentifier:
          $ref: '#/components/schemas/AlternateAccountIdentifier'
        accountType:
          $ref: '#/components/schemas/DebtorAccountType'
        accountCurrency:
          $ref: '#/components/schemas/IsoCurrencyCode'
    PaymentStatus:
      type: object
      title: PaymentStatus
      description: Representation of the payment status
      properties:
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        valueDate:
          type: string
          format: date
          description: The value date of the payment in YYYY-MM-DD format
        paymentStatus:
          type: string
          enum:
          - RECEIVED
          - ACCEPTED
          - PROCESSING
          - CANCELED
          - REJECTED
          - COMPLETED
          - RETURNED
          description: The payment status indicates the current state of the payment
        paymentSubStatus:
          type: string
          description: The payment sub status provides the granular level payment status
          enum:
          - RECEIVED
          - ACCEPTED
          - PROCESSING_BY_JPM
          - PENDING_CLIENT_ACTION
          - PENDING_COMPLIANCE_REVIEW
          - PENDING_FRAUD_REVIEW
          - PENDING_FUNDING_REVIEW
          - PENDING_JPM_REVIEW
          - SCHEDULED
          - PENDING_POSTING
          - CANCELED
          - REJECTED
          - REJECTED_BY_JPM
          - COMPLETED_BY_JPM
          - SENT_TO_CLEARING
          - DELIVERED_TO_RECIPIENT
          - RETURNED
        statusUpdatedAt:
          type: string
          format: date-time
          description: 'The last updated date and time of the payment status in ISO 8601 format.

            The date &amp; time are expressed in UTC timezone (without offset)'
        gpi:
          type: object
          title: GPIStatusInfo
          description: GPI status as provided by SWIFT network
          properties:
            status:
              type: string
              description: Specifies the status of a single payment transaction
            statusDescription:
              type: string
            reason:
              type: string
              description: Provides the reason for a payment status
        paymentIdentifiers:
          $ref: '#/components/schemas/PaymentIdentifiersReadOnly'
        paymentType:
          $ref: '#/components/schemas/PaymentType'
        transferType:
          $ref: '#/components/schemas/TransferType'
        requestedExecutionDate:
          type: string
          format: date
          description: "Requested execution date of the payment instruction (e.g. value date) in ISO 8601 `yyyy-mm-dd` format,\n must be either the current or future date.\n- This is the value date for EMEA ACH Payments "
        exceptions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ErrorContext'
        fxInformation:
          $ref: '#/components/schemas/FxInformationReadOnly'
        clearingSystem:
          $ref: '#/components/schemas/ClearingSystem'
        paymentRedirection:
          $ref: '#/components/schemas/PaymentRedirection'
      required:
      - paymentId
      - paymentStatus
      - statusUpdatedAt
      - paymentIdentifiers
      - paymentType
      - transferType
      - requestedExecutionDate
      additionalProperties: false
    PreviousInstructingAgentFinancialInstitutionId:
      title: PreviousInstructingAgentFinancialInstitutionId
      description: Previous Instructing Agent Financial Institution Id
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 11
          description: Financial Institution Identifier
        idType:
          $ref: '#/components/schemas/FinancialInstitutionIdType'
        branchNumber:
          type: string
          minLength: 1
          maxLength: 5
          description: 'Branch of the bank or financial institution.

            - Applicable and Mandatory for Brazil PIX only'
      required:
      - id
      - idType
    DebtorAccountId:
      title: DebtorAccountId
      type: string
      minLength: 1
      maxLength: 128
      description: "Applicable and mandatory for RTP, ACH, Wires and Blockchain (Kinexys) Payments only\n\nThis field is to provide the regular account number when it is a pay by\nAccount instruction. if pay by proxy this does not need to be filled.\n\n**Maximum length supported for each instrument and market**:-\n\n  | Market/Instrument               \t| Maximum length limits                                         |\n  |-----------------------------------|---------------------------------------------------------------|\n  | UK FPS                          \t| 8 (7 digit A/C numbers should be padded with a leading zero) \t|\n  | SGP RTP                         \t| 35                                                           \t|\n  | AUS RTP                         \t| 35                                                           \t|\n  | HKG FPS                         \t| 35                                                           \t|\n  | IND IMPS                        \t| 35                                                           \t|\n  | P2C US/CA                       \t| 16                                                           \t|\n  | BRA PIX                         \t| 34                                                           \t|\n  | MEX SPIE                        \t| 16                                                           \t|\n  | USA RTP                         \t| 31                                                           \t|\n  | SEPA Instant                    \t| 34 (IBAN)                                                     |\n  | P2I INTERAC                     \t| 35                                                            |\n  | Blockchain (Kinexys) Payments      \t| 34                                                            |\n  | Chile ACH                       \t| 34                                                            |\n  | US ACH IAT                       \t| 35                                                            |\n  | US ACH NON-IAT                   \t| 17                                                            |\n  | CAD ACH                          \t| 12                                                            |"
    DebtorAccountDetails:
      type: object
      description: Primary account details
      title: PrimaryAccountDetails
      required:
      - accountNumber
      properties:
        accountNumber:
          $ref: '#/components/schemas/DebtorAccountId'
        accountType:
          $ref: '#/components/schemas/DebtorAccountType'
        accountCurrency:
          $ref: '#/components/schemas/IsoCurrencyCode'
        companyId:
          type: string
          description: Applicable to ACH Payments. Special reference on certain payment types for returns routing.
          minLength: 1
          maxLength: 35
    AmountDecimal:
      title: PaymentAmountDecimal
      type: string
      description: A String representation of a (potentially) whole number or decimal positive number. - Amount should be more than 0.01 with maximum of two decimal places allowed in most markets.
      minLength: 1
      maxLength: 40
      pattern: ^\d+(\.\d+)?$
    DateAndPlaceOfBirth:
      title: DateAndPlaceOfBirth
      description: Date and place of birth.
      allOf:
      - $ref: '#/components/schemas/BasicAddress'
      - $ref: '#/components/schemas/BirthDate'
    DebtorTaxInformation:
      type: object
      description: Debtor Tax Information
      title: DebtorTaxInformation
      required:
      - taxId
      properties:
        taxId:
          type: string
          minLength: 1
          maxLength: 35
        taxpayerCategory:
          type: string
          enum:
          - INDIVIDUAL
          - CORPORATE
        vatBranchCode:
          $ref: '#/components/schemas/VatBranchCode'
    Party:
      type: object
      title: Party
      description: Party
      required:
      - account
      additionalProperties: false
      properties:
        account:
          $ref: '#/components/schemas/Account'
        name:
          type: string
          minLength: 1
          maxLength: 140
          description: "Party name \n\n**Creditor Specific Constraints**:\n\nMandatory for RTP Markets :- \n- UK FPS \n- SEPA Instant\n- US RTP\n- Singapore, Australia, Mexico, Hong Kong, Brazil Faster Payments - **mandatory for Pay to Account transactions**.\n\nMandatory For Alternate Payments: \n- **Push To Card** - US, Canada\n\nMandatory for ACH Payments:   \n- Chile\n- US\n\nMaximum length supported per instrument/market:\n\n| Market/Instrument               \t| Maximum length limits |\n|-----------------------------------|-----------------------|\n| UK FPS                          \t| 40 \t                  |\n| SEPA Instant                    \t| 34 (IBAN)             |\n| SGP RTP                         \t| 140                  \t|\n| AUS RTP                         \t| 140                  \t|\n| HKG FPS                         \t| 140                   |\n| IND IMPS                        \t| 140                  \t|\n| P2C US and CA                     | 30                  \t|\n| MEX SPIE                        \t| 40                   \t|\n| ACH CHILE                         | 70                   \t|\n| ACH US               \t            | 22                    |\n\n---\n\n**Debtor specific constraints**:\n\nMandatory and supported by:\n- **ACH Chile**\n- **Push To Card** (P2C)\n- **US RTP**\n- **US FEDNOW**\n- **SARIE IPS**\n- **P2I Interac**\n- **Push To Wallet**\n\nMaximum length supported per instrument/market:\n\n| Market/Instrument     | Maximum length limits |\n|-----------------------|-----------------------|\n| US RTP                | 140\t                  |\n| P2C US and CA         | 30                    |\n| ACH Chile             | 140                   |"
        postalAddress:
          $ref: '#/components/schemas/Address'
        contactDetails:
          $ref: '#/components/schemas/ContactDetails'
        dateAndPlaceOfBirth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        countryOfResidence:
          $ref: '#/components/schemas/IsoCountryCode'
        device:
          $ref: '#/components/schemas/DeviceInfo'
        partyId:
          $ref: '#/components/schemas/PartyId'
    Invoicer:
      type: object
      title: Invoicer
      description: Invoicer party identification
      properties:
        partyId:
          $ref: '#/components/schemas/PartyId'
        name:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of the party
        dateAndPlaceOfBirth:
          $ref: '#/components/schemas/DateAndPlaceOfBirth'
        countryOfResidence:
          $ref: '#/components/schemas/IsoCountryCode'
        postalAddress:
          $ref: '#/components/schemas/Address'
    PreviousInstructingAgent:
      title: PreviousInstructingAgent
      type: object
      description: 'Agent that previously handled the payment instruction. Usage: If more than one previous instructing agent is present, then position must be used to represent their order accordingly.

        - To support RTP adn WIRE payment flows for TP4, TP5 &amp; TPx use cases.'
      additionalProperties: false
      properties:
        position:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          description: Position of the previous instructing agent in the payment chain
        name:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of the previous instructing agent
        account:
          oneOf:
          - $ref: '#/components/schemas/PrimaryAccountDetailsPreviousInstructingAgent'
          - $ref: '#/components/schemas/AlternateAccountDetails'
        financialInstitutionIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/PreviousInstructingAgentFinancialInstitutionId'
        postalAddress:
          $ref: '#/components/schemas/Address'
        isForeignParty:
          type: boolean
      required:
      - name
    PaymentInitiationResponse:
      title: PaymentInitiationResponse
      type: object
      description: Representation of the Payment initiation response
      properties:
        paymentId:
          $ref: '#/components/schemas/PaymentId'
        paymentStatus:
          type: string
          enum:
          - RECEIVED
          - ACCEPTED
          - PROCESSING
          - CANCELED
          - REJECTED
          - COMPLETED
          - RETURNED
          description: The payment status indicates the current state of the payment
        paymentSubStatus:
          type: string
          description: The payment sub status provides the granular level payment status
          enum:
          - RECEIVED
          - ACCEPTED
          - PROCESSING_BY_JPM
          - PENDING_CLIENT_ACTION
          - PENDING_COMPLIANCE_REVIEW
          - PENDING_FRAUD_REVIEW
          - PENDING_FUNDING_REVIEW
          - PENDING_JPM_REVIEW
          - SCHEDULED
          - PENDING_POSTING
          - CANCELED
          - REJECTED
          - REJECTED_BY_JPM
          - COMPLETED_BY_JPM
          - SENT_TO_CLEARING
          - DELIVERED_TO_RECIPIENT
          - RETURNED
        statusUpdatedAt:
          type: string
          format: date-time
          description: 'The last updated date and time of the payment status in ISO 8601 format.

            The date &amp; time are expressed in UTC timezone (without offset)'
        requestedExecutionDate:
          type: string
          format: date
          description: "Requested execution date of the payment instruction (e.g. value date) in ISO 8601 `yyyy-mm-dd` format,\n must be either the current or future date.\n- This is the value date for EMEA ACH Payments"
        paymentIdentifiers:
          type: object
          title: PaymentIdentifiers
          description: Identifiers associated with the Payment Instruction throughout its lifecycle.
          properties:
            endToEndId:
              $ref: '#/components/schemas/EndToEndId'
          required:
          - endToEndId
        paymentBatchId:
          type: string
          minLength: 1
          description: 'JPMC issued batch Id for the payment

            **NOTE: Applicable only for payments batched by JPMC. i.e ACH**'
        transferType:
          $ref: '#/components/schemas/TransferType'
        paymentType:
          $ref: '#/components/schemas/PaymentType'
      required:
      - paymentId
      - paymentStatus
      - statusUpdatedAt
      - requestedExecutionDate
      - paymentIdentifiers
      - transferType
      - paymentType
    PaymentEventData:
      title: Payment Event Data
      description: Representation of Payment Event Data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PaymentEvent'
    AdditionalParties:
      type: object
      title: Additional Parties
      description: Additional parties involved in the money movement.
      properties:
        ultimateDebtor:
          $ref: '#/components/schemas/UltimateParty'
        ultimateCreditor:
          $ref: '#/components/schemas/UltimateParty'
        initiatingParty:
          $ref: '#/components/schemas/InitiatingParty'
        instructedAgent:
          $ref: '#/components/schemas/DebtorFinancialInstitutionId'
        previousInstructingAgents:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/PreviousInstructingAgent'
        additionalCreditors:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/AdditionalCreditor'
        intermediaryAgents:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/IntermediaryAgent'
    DebtorAgent:
      title: DebtorAgent
      type: object
      description: Debtor Agent
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 140
          description: Name of the agent
        financialInstitutionIds:
          type: array
          description: Conditional for WIRE payments (PACS.008/PACS.009) and required for other payment types.
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/DebtorFinancialInstitutionId'
        postalAddress:
          $ref: '#/components/schemas/Address'
        additionalInstitutions:
          $ref: '#/components/schemas/AdditionalInstitutions'
    PaymentTypeInformation:
      type: object
      title: Payment Type information
      description: A set of coded elements that further specifies the type of Payment
      minProperties: 1
      properties:
        serviceLevelCode:
          type: string
          description: 'Specifies an agreed service level under which the payment should be processed based on a set of pre-defined categories.


            |ServiceLevelCode | Meaning

            |-----------------|-----------------

            |**NURG**         | Non Urgent

            |**URGP**         | Urgent

            |**SDVA**         | Same Day Value

            |**URNS**         | Urgent Payment Net Settlement

            |**BKTR**         | Book'
          enum:
          - NURG
          - SEPA
          - SDVA
          - URNS
          - BKTR
          - URGP
        localInstrumentCode:
          $ref: '#/components/schemas/LocalInstrument'
        paymentContext:
          $ref: '#/components/schemas/PaymentContext'
        clearingSystem:
          $ref: '#/components/schemas/ClearingSystemClientVersion'
    PartyId:
      title: PartyId
      description: Party Identification
      oneOf:
      - $ref: '#/components/schemas/OrganizationIdentification'
      - $ref: '#/components/schemas/IndividualIdentification'
      example:
        organizationIds:
        - organizationId: '123456'
          schemeName:
            proprietary: JPMCOID
    ClearingSystemClientVersion:
      type: object
      title: ClearingSystem
      description: Clearing system used for the payment. The clearing system is a network that facilitates the transfer of funds between banks or financial institutions. It acts as an intermediary, ensuring that transactions are processed securely and efficiently.
      properties:
        name:
          type: string
          description: Name of the clearing system
          minLength: 3
          maxLength: 10
    AccountType:
      title: AccountType
      type: string
      enum:
      - DDA
      - BDA
      - CARD
      - LOAN
      - ODFT
      - NREX
      - CACC
      - SVGS
      - CACR
      - NROR
      - SNRR
      - TRAN
      - CLABE
      - VOSTRO
      - IBAN
      - BBAN
      - DFLT
      - SLRY
      - EMBEDDED_DDA
      - LIMITED_DDA
      - WALLET
      - VAM
      - INTERAC
      - PAYPAL
      - VENMO
      - OTHER
      description: "**Mandatory for** :\n - India IMPS\n - Malaysia NPP \n - Brazil RTP (Pay to account only)\n - Blockchain Payments \n - US ACH (IAT and NON IAT)\n\n**India IMPS**:\n  - LOAN - Loan account\n  - ODFT - Overdraft\n  - NREX - NonResidentExternal\n  - OTHER - For Book and cross branch with VRN accounts\n  - CACC - Cash Credit/Current account\n  - DDA - DDA account\n  - SVGS - Savings account\n  - CACR - Cash Credit Account\n  - NROR - Non-Resident Ordinary Account\n  - SNRR - Special Non-Resident Rupee Account\n\n**SEPA Instant**: IBAN\n\n**Hong Kong RTP**: BBAN\n\n**Malaysia NPP**:\n  - LOAN\n  - DFLT\n  - SVGS\n  - CACC\n\n**Brazil RTP**: \n  - CACC\n  - SLRY\n  - TRAN\n  - SVGS\n\n**Mexico RTP**: \n  - CLABE\n  - VOSTRO\n  - DDA\n\n**Blockchain Payments**:\n  - DDA\n  - BDA - Blockchain Deposit Account\n\n**US ACH**: \n  - CACC \n  - SVGS \n  - LOAN\n\nOptional for:\n  - CAD ACH\n\n**Not supported for**:\n- US RTP\n- Alternate Payments (Wallet, Cards)"
    PrimaryAccountDetails:
      type: object
      title: Primary Account Details
      description: Account Details
      required:
      - accountNumber
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountId'
        accountType:
          $ref: '#/components/schemas/AccountType'
        accountCurrency:
          $ref: '#/components/schemas/IsoCurrencyCode'
        companyId:
          type: string
          description: Applicable to ACH Payments. Special reference on certain payment types for returns routing.
          minLength: 1
          maxLength: 35
    ErrorContext_2:
      title: ErrorContext
      type: object
      properties:
        code:
          type: string
          description: JPMC Short code that identifies the error - publicly cataloged and documented
          minLength: 5
          maxLength: 5
        message:
          type: string
          description: Humanly readable textual description of the error
          minLength: 1
          maxLength: 99
        location:
          type: string
          description: The location of the error occurred in the request.
          enum:
          - BODY
          - PATH
          - QUERY
          - HEADER
          minLength: 1
          maxLength: 99
        field:
          type: string
          description: The field which caused the error. Where the location of error occurred is BODY the field would contain the JSON Path expression
          minLength: 1
          maxLength: 99
      required:
      - message
    ISOCurrencyCode:
      title: ISOCurrencyCode
      description: '**Currency of the money movement**: a 3 alpha character ISO 4217 currency code.'
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      example: EUR
    AccountIdType:
      title: AccountIdType
      type: string
      description: The account identifier type
      enum:
      - SORT_CODE
      - IBAN
    ProviderName:
      title: ProviderName
      type: string
      description: "Optional name of a pre-selected Provider (sourced from the providers list). \n              \nProviding this field will skip the bank selection screen for the end-user using the payment link."
      example: uk-santander-oauth2
      minLength: 2
      maxLength: 64
    PaymentAmount:
      title: PaymentAmount
      type: object
      description: "The amount value and currency of a payment amount should be more than 0.01 with maximum of two decimal places allowed.\n\n**Payment amount limits vary depending upon markets and financial institutions.**\n\n**Refer to the table below for current limits.**\n\n  | Market                             | Payment limits (per transaction)| Reference|\n  | -----------------------------------|---------------------------------|----------|\n  | United Kingdom (FASTER_PAYMENTS)   | GBP 1,000,000                   | Refer to [Pay UK FPS Transaction Limits](https://www.wearepay.uk/what-we-do/payment-systems/faster-payment-system/transaction-limits/) for confirmation.|\n  | SEPA (SEPA_INSTANT_CREDIT_TRANSFER)| EUR 100,000                     | Refer to [European Payments Council(EPC) SEPA Instant Transaction Limits](https://www.europeanpaymentscouncil.eu/document-library/rulebooks/maximum-amount-instructions-under-2023-sepa-instant-credit-transfer-0) for confirmation.|\n  | SEPA (SEPA_CREDIT_TRANSFER)        | EUR 999,999,999.99              | Refer to [EPC SCT Rulebook](https://www.europeanpaymentscouncil.eu/what-we-do/epc-payment-schemes/sepa-credit-transfer/sepa-credit-transfer-rulebook-and)"
      properties:
        value:
          $ref: '#/components/schemas/Value_2'
        currency:
          $ref: '#/components/schemas/ISOCurrencyCode'
      required:
      - value
      - currency
    StatusUpdatedAt:
      title: StatusUpdatedAt
      type: string
      format: date-time
      description: The last updated date and time of the status, in ISO 8601 format.
    Value_2:
      title: Value
      type: string
      minLength: 3
      maxLength: 18
      pattern: ^(\d{1,15})\.(\d{2})$
      example: '10.50'
      description: The value representation of a monetary amount. The amount value should be more than 0.01 with maximum of two decimal places allowed.
    Error_2:
      title: Error
      type: object
      description: The error object returned by the API.
      properties:
        title:
          type: string
          description: Short humanly-readable title of the error
          minLength: 1
          maxLength: 99
        httpStatus:
          type: integer
          format: int32
          description: HTTP Status Code
        traceId:
          type: string
          description: JPMC assigned trace identifier
          minLength: 1
          maxLength: 99
        requestId:
          type: string
          description: The client originated requestId
          minLength: 1
          maxLength: 99
        context:
          type: array
          description: Provides additional context and detail on the validation errors
          minItems: 1
          maxItems: 99
          items:
            $ref: '#/components/schemas/ErrorContext_2'
      required:
      - title
    PaymentResponseMetadata:
      title: PaymentResponseMetadata
      type: object
      properties:
        id:
          $ref: '#/components/schemas/PaymentId_2'
        status:
          type: string
          description: "The status of the submitted payment request\n\n**Refer to the table below for the supported statuses**:\n\n  | Status        | Description                                                                         |\n  | --------------|-------------------------------------------------------------------------------------|\n  | **NONE**      | The initial status for a payment. Indicates nothing has happened yet                |\n  | **SENT**      | Payment has been SENT                                                               |\n  | **SETTLED**  | The Payment was seen on recipient's account                                         |\n  | **FAILED**    | Attempt ended with error status. The details can be found in statusMessage field    |\n  | **CANCELLED** | The Payment was unsucessful due to an unexpected error e.g. a user fails to authorize a payment. |"
        statusUpdatedAt:
          $ref: '#/components/schemas/StatusUpdatedAt'
        statusMessage:
          type: string
          description: 'A textual description of the status.


            ***NOTE: Only applicable when the status is FAILED or CANCELLED***'
          minLength: 1
          maxLength: 128
        createdAt:
          type: string
          format: date-time
          description: Indicates when the Payment request was created in the system. Follows ISO date time format.
        paymentLinkURL:
          type: string
          format: uri-reference
          description: An HTTPS URL to make the payment
        paymentQRCode:
          type: string
          description: An HTTPS URL to download the QR code image to make the payment.
        acknowledged:
          type: string
          description: Indicates if the payment has been acknowledged or not.
          readOnly: true
          default: UNKNOWN
          enum:
          - ACKNOWLEDGED
          - NOT_ACKNOWLEDGED
          - UNKNOWN
    Debtor:
      title: Debtor
      type: object
      description: 'The party that pays for goods and services or sends funds.

        *The debtor IBAN can be prefilled by the payment initiator:*

        - If prefilled, the user will not be allowed to change the IBAN afterwards.

        - The account selection experience will be skipped.'
      allOf:
      - $ref: '#/components/schemas/Party_2'
    PaymentId_2:
      allOf:
      - type: string
        description: A unique identifier of the payment
      - $ref: '#/components/schemas/UniqueResourceIdentifier'
    Reference:
      title: Reference
      type: string
      description: A free text field that can be used to provide a meaningful reference for a payment transaction
      minLength: 1
      maxLength: 35
    Market:
      title: Market
      type: string
      description: 'ISO 3166-1 alpha-2 country code for the market where the payment is initiated.


        - **Market Coverage**: `DE`, `ES`, `GB`, `IT`'
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
    AccountId_2:
      title: AccountId
      type: string
      minLength: 6
      maxLength: 34
      description: "Debtor account number as identified by the bank or financial institution.\n\n**Maximum length supported for each instrument and market. Refer to the table below**\n\n  | Market                             | Maximum field length                                          |\n  | -----------------------------------|---------------------------------------------------------------|\n  | United Kingdom |\t14 ( 6 digit Sort Code and 8 digit Account Number - 7 digit A/C numbers should be padded with a leading zero) |\n  | SEPA           |  34 (IBAN)                                                    |"
    PaymentType_2:
      type: string
      description: "The type of payment.\n\n  List of supported payment types, their usage and categorization by region:\n\n  Payment Type             | Description\n  -------------------------|-----------------------------------------------------------------------\n  **REAL_TIME_PAYMENTS**   | *Real-time Payments (Instant)* - `FASTER_PAYMENTS`, `SEPA_INSTANT_CREDIT_TRANSFER`\n  **LOW_VALUE_PAYMENTS**    | *Low-value Retail Payments* -  `BACS`, `SEPA_CREDIT_TRANSFER`\n  **HIGH_VALUE_PAYMENTS** | *High Value Business Payments* -  `CHAPS`\n  ---\n\n | | **Real-time Payments (INSTANT)**       | **Low Value Payments** | **High-Value Payments**    |\n |:-----------------:|:--------------------------------------:|:--------------------------------------:|:----------------------------------:|\n | **UK**            | Faster Payments                        |           BACS                     | CHAPS |\n | **SEPA**          | SEPA Instant Credit Transfer           | SEPA Credit Transfer |                       |\n\n **Real-time payments**: refer to payment solutions that process and settle financial transactions in real-time, typically within seconds, without any waiting period.\n\n **Low-value payments**: pertain to high-volume, low-value transactions mainly conducted by individuals or businesses for day-to-day expenses. These payments are usually processed in batches, not in real-time.\n\n **High Value Payments**: refer to large-sum transactions that are typically exchanged between banks or financial institutions."
      enum:
      - REAL_TIME_PAYMENTS
      - LOW_VALUE_PAYMENTS
      - HIGH_VALUE_PAYMENTS
    Creditor:
      title: Creditor
      type: object
      description: The recipient of funds in the context of a payment.
      allOf:
      - $ref: '#/components/schemas/Party_2'
      required:
      - name
      - account
    PaymentResponse:
      allOf:
      - $ref: '#/components/schemas/PaymentResponseMetadata'
      - $ref: '#/components/schemas/Payments'
    Party_2:
      title: Party
      type: object
      description: Representation of a **Sender** or **Recipient** of funds within the context of a payment.
      properties:
        name:
          $ref: '#/components/schemas/Name'
        account:
          $ref: '#/components/schemas/Account_2'
    Account_2:
      title: Account
      type: object
      description: Captures account information
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId_2'
        accountIdType:
          $ref: '#/components/schemas/AccountIdType'
      required:
      - accountId
      - accountIdType
    Payments:
      title: Payments
      type: object
      properties:
        paymentAmount:
          $ref: '#/components/schemas/PaymentAmount'
        paymentType:
          $ref: '#/components/schemas/PaymentType_2'
        market:
          $ref: '#/components/schemas/Market'
        redirectURL:
          type: string
          format: uri-reference
          description: An optional re-direct URL of the merchant where the end-user will be redirected to once they have successfully authorized the payment with their bank or financial institution.
        debtor:
          $ref: '#/components/schemas/Debtor'
        creditor:
          $ref: '#/components/schemas/Creditor'
        reference:
          $ref: '#/components/schemas/Reference'
        providerName:
          $ref: '#/components/schemas/ProviderName'
      required:
      - paymentAmount
      - paymentType
      - market
      - creditor
      - reference
