                - DISCOUNT_APPLIED
                - CREDIT_NOTE
                - REMITTED
                - TAX
                - TRANSACTION_FOREIGN_CURRENCY
                - COMMISSION
                - OTHER_CHARGES
                - ADJUSTED_AMOUNT
              value:
                $ref: '#/components/schemas/Value'
              additionalInformation:
                type: string
                description: Additional information about the referred document amount.
                minLength: 1
                maxLength: 140
        invoicer:
