      parameters:
      - name: merchantId
        in: header
        required: true
        schema:
          type: string
          example: '991234567890'
          minLength: 8
          maxLength: 12
        description: Identifier for the merchant account.
        examples:
          Success:
            value: '991234567890'
          Error:
            value: '991234567891'
      - name: requestId
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: Merchant identifier for the request. The value must be unique.
        examples:
          Success:
            value: 10cc0270-7bed-11e9-a188-1763956dd7f6
          Error:
            value: 20cc0270-7bed-11e9-a188-1763956dd7f6
      - name: token-reference-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Reference identifier for a specific token.
        examples:
          Success:
            value: fb0dabc0-da2c-46b6-b3a3-8fc6d3190e88
          Error:
            value: fb0dabc0-da2c-46b6-b3a3-8fc6d3190e98
      - name: asset-reference-id
        in: path
        required: true
        schema:
          type: string
        description: Reference identifier for a specific asset.
