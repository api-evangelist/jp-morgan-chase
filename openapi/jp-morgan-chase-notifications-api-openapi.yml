          description: Provides textual information regarding an recipient update that requires the user's
            attention.
          type: string
        transactionType:
          description: Codifies the option that enables a merchant to indicate how funds and/or fees are
            to be transferred (credited or debited) to their bank account.
          type: string
    merchantAccountPendingForClosure:
      description: Information regarding merchant status when account is pending closure
      type: object
      properties:
        clientId:
          $ref: '#/components/schemas/clientId'
        merchantId:
          $ref: '#/components/schemas/merchantId'
        status:
          description: Codifies the overall merchant account status of the Product Onboarding. Possible
            value
          type: string
          enum:
          - PENDING-CLOSURE
    fxInformation:
      description: This is used for specifying Foreign Exchange related information for a transaction
      type: object
      properties:
        exchangeRate:
          description: The measure of conversion between one nations currency (e.g. USD) and a second
            form of currency (e.g. GBP, CHF, Euro).  This field may also be referred to as a currency
            quotation, the foreign exchange rate or forex rate.
          type: string
        rateId:
          description: Identifies a unique occurrence of the rate associated with the conversion between
            one nations currency (e.g. USD) and a second form of currency (e.g. GBP, CHF, Euro) as determined
            by the Firm's Investment Bank. If the merchant is entitled for the Firm's Foreign Exchange
            (FX) rate distribution application, they can lock in the exchange rate at the time of authorization.
          type: string
        contractId:
          description: Identifies a unique occurrence of Contract id associated with the conversion between
            one nations currency (e.g. USD) and a second form of currency (e.g. GBP, CHF, Euro) as determined
            by the Firm's Investment Bank. If the merchant is entitled for the Firm's Foreign Exchange
            (FX) rate distribution application, they can lock in the exchange rate at the time of authorization.
          type: string
        clientSpread:
          description: Specifies the client-specified mark-up to be applied to the FX transaction amount
          type: string
    paymentPurpose:
      description: This is used for specifying the reason for the payment associated with the transaction.
      type: object
      properties:
        code:
          description: Code to denote the purpose of the transaction record.
          type: string
        customCode:
          description: Custom Code to denote the purpose of the transaction record.
          type: string
    debtor:
      description: Debtor details of the transaction.
      type: object
      properties:
        id:
          description: Identifies a specific payee or receiver of the funds.
          type: string
        clientId:
          description: Unique identifier created by the Firm as a small medium business for the merchant
            and platform.
          type: string
        type:
          description: Provides textual information about the category of the customer.
          type: string
        partyDetails:
          $ref: '#/components/schemas/partyDetails'
        account:
          $ref: '#/components/schemas/debtorAccount'
    creditor:
      description: Creditor details of the transaction.
      type: object
      properties:
        id:
          description: Identifies a specific payee or receiver of the funds.
          type: string
        clientId:
          description: Unique identifier created by the Firm as a small medium business for the merchant
            and platform.
          type: string
        type:
          description: Provides textual information about the category of the customer.
          type: string
        partyDetails:
          $ref: '#/components/schemas/partyDetails'
        account:
          $ref: '#/components/schemas/creditorAccount'
    card:
      description: Card Details.
      type: object
      properties:
        name:
          description: Name of the cardholder using the card instrument.
          type: string
        number:
          description: Identifies a concealed number associated with the card number recognized by various
            payment systems. This is typically concealed by storing only the first 6 and/or last 4 digits
            of the card number or some variation.
          type: string
        expiryDate:
          description: Designates the year, month and day when a card account reaches the end of the current
            contractual period and ceases allowing transactions.
          type: string
    partyDetails:
      description: Provides detailed information about the party involved in the transaction.
      type: object
      properties:
        type:
          description: 'Designates if the party is a carbon based entity or an organization. Example:
            I = Individual, N = Non-Individual.  (ICDW existing definition: Party Type classifies Parties
            according to their inherent characteristics and structure; for example, Individual, Organization
            or Organization Unit.)'
          type: string
        name:
          description: The party's name as provided at the time the party is onboarded or updated based
            on firm policies and business rules that allow for such updates. For an individual this field
            includes the first, middle, and last name. The full name can also include prefixes such as
            Dr. or Hon. and suffixes such as Jr or III. For non carbon entities, the field reflects the
            complete legal name by which an entity is registered with a state, local or federal government.
          type: string
        address:
          $ref: '#/components/schemas/partyAddress'
        contacts:
          $ref: '#/components/schemas/contacts'
        identitiesList:
          type: array
          minItems: 0
          description: This is used for specifying an attribute used on a model for collection object
            that will contain one or more attributes.
          items:
            $ref: '#/components/schemas/identity'
    identity:
      description: This is used for specifying the various identities associated with the party involved
        in the transaction such as Tax ID, National ID, etc.
      type: object
      properties:
        idType:
          description: Type of the identity identifier.
          type: string
        idValue:
          description: The value of the identity identifier.
          type: string
    partyAddress:
      description: This denotes the physical location details of the party involved in the transaction.
      type: object
      properties:
        type:
          description: Label / decode of the various addresses captured for a party, such as Doing Business
            As Address, Legal Entity Address, and Tax Address
          type: string
        streetName:
          description: The name of the street of a party's address
          type: string
        buildingNumber:
          description: Number that identifies the position of a building on a street.
          type: string
        city:
          description: The name of the City, a Geographic Area, that is a municipality with legal power
            granted by a state charter.
          type: string
        countrySubDivision:
          description: Codifies the representation of principal administrative divisions' names, or those
            of similar areas, for the countries and geopolitical entities included in ISO 3166-1.
          type: string
        country:
          description: A code that identifies the Country, a Geographic Area, that is recognized as an
            independent political unit in world affairs. Note, This data element is a child of the Country
            Code CDE and valid values are based on ISO standards.
          type: string
        postalCode:
          description: A code that identifies the Postcode Area, a Geographic Area defined by postal authorities
            to facilitate mail delivery services; for example, the area defined by a Zip Code in the U.
            S.
          type: string
    contacts:
      description: This object provides key contact information for the party involed in the transaction.
      type: object
      properties:
        emailAddress:
          description: A mail system that allows a party to send and receive messages electronically.
            An email address is composed of a local part and a domain part. The local part is unique to
            the individual while the domain or host name must meet specific standards required by the
            host that administers the email service.
          type: string
        website:
          description: A reference to a specific location on a computer network for the website associated
            with a particular data record or entity.
          type: string
        phoneNumber:
          description: 'A locator whose value identifies the formatted numeric address for routing voice
            or data communications via telephony, to reach a party. NOTE: Telephone number formats may
            vary; this field can include domestic and international telephone numbers.'
          type: string
        alternateName:
          description: The party's Alternate name as provided at the time the party is onboarded or updated
            based on firm policies and business rules that allow for such updates. The field reflects
            the complete Other legal name by which an entity is registered with a state, local or federal
            government.
          type: string
    creditorAccount:
      description: Creditor Account
      type: object
      properties:
        type:
          description: Codifies a bank account where funds are deposited or stored (e.g., checking and
            savings account). When shared with a financial institution as the client's primary automated
            payment mechanism for a debt, it may also be known as a DDA (Demand Deposit Account). A DDA
            can have funds withdrawn at any time from the depository institution, accessible by a teller,
            ATM or via online banking.
          type: string
        externalAccount:
          $ref: '#/components/schemas/externalAccount'
        registeredAccount:
          $ref: '#/components/schemas/registeredAccount'
        card:
          $ref: '#/components/schemas/card'
        alternateAccount:
          $ref: '#/components/schemas/alternateAccount'
    debtorAccount:
      description: Debtor Account
      type: object
      properties:
        type:
          description: Codifies a bank account where funds are deposited or stored (e.g., checking and
            savings account). When shared with a financial institution as the client's primary automated
            payment mechanism for a debt, it may also be known as a DDA (Demand Deposit Account). A DDA
            can have funds withdrawn at any time from the depository institution, accessible by a teller,
            ATM or via online banking.
          type: string
        externalAccount:
          $ref: '#/components/schemas/externalAccount'
        registeredAccount:
          $ref: '#/components/schemas/registeredAccount'
        card:
          $ref: '#/components/schemas/card'
    registeredAccount:
      description: This object provides registered account information.
      type: object
      properties:
        id:
          description: Account identifier generated by Embedded Finance.
          type: string
        number:
          description: This is the last 4 digits  Direct Debit Account(DDA) that is credited. The truncated
            value is used in place of the full number to protect against exposure of confidential information.
          type: string
        ledgerBalance:
          description: A monetary figure representing the difference between credits and debits in a product
            account, at a point in time.
          type: string
        postingVersion:
          description: Tracks the version number of a posting record. This attribute is used to identify
            and manage changes or updates to posting entries associated with accounts.Each time a posting
            is modified, the version number is incremented to ensure data integrity and support audit
            requirements.
          type: string
    externalAccount:
      description: This object provides external account information.
      type: object
      properties:
        number:
          description: This is the last 4 digits  Direct Debit Account(DDA) that is credited. The truncated
            value is used in place of the full number to protect against exposure of confidential information.
          type: string
        bankName:
          description: The label given to a financial institution authorized by a government to accept
            deposits, make loans, pay interest, clear checks, and provide other financial services to
            its customers.
          type: string
        branchCode:
          description: Uniquely identifies the brick and mortar retail branch location.
          type: string
        currency:
          description: Codifies the monetary unit that was associated with the financial transaction (such
            as sale, returns, chargebacks etc.).
          type: string
        country:
          description: 'A code that identifies the Country, a Geographic Area, that is recognized as an
            independent political unit in world affairs. Note: This data element is a child of the Country
            Code CDE and valid values are based on ISO standards.  In this context, it is the Merchant''s
            mailing address country code as it would appear on an international mailing label.'
          type: string
        routingInformationList:
          type: array
          minItems: 0
          description: This is used for specifying an attribute used on a model for collection object
            that will contain one or more attributes
          items:
            $ref: '#/components/schemas/routingInformation'
    originatingTransaction:
      description: This is used for specifying the details of the original transaction that is being referenced
        in the context of a return transaction.
      type: object
      properties:
        id:
          description: Identifies a unique occurrence of a transaction.
          type: string
        type:
          description: Codifies how the merchant receives their monies from payment processing.
          type: string
    alternateAccount:
      description: This object provides alternate account details.
      type: object
      properties:
        idType:
          description: Type of the alternate account identifier.
          type: string
        id:
          description: Identifier of the alternate account.
          type: string
    allocationOrderNotification:
