        expirationDate:
          description: The year month and day on which the forms, and information used by the Firm to
            make decisions on customer requests are no longer valid
          type: string
        activeDate:
          description: 'Designates the century, year (YYYY), month and day on which the data row is first
            operative, in full force, or available for use. (Example: The value is effective as of YYYY/MM/DD).'
          type: string
        publicKeyUrl:
          description: A reference to a web resource on the internet specifying its location on a computer
            network and a mechanism for retrieving.
          type: string
        keyId:
          description: A unique number assigned to a data file containing one or more records that is
