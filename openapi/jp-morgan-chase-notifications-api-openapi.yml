    ConsentStatus:
      title: ConsentStatus
      type: string
      description: 'Type of consent status


        | Consent Status     | Description                                                                 |

        |:---------------------|:--------------------------------------------------------------------------|

        | `SUCCESS`            | Consent process completed successfully.                                   |

        | `PARTIAL_SUCCESS`    | Consent completed successful. Consent data retrieval partial successful.  |

        | `FAILED`             | Consent process failed.                                                   |

        | `REVOKED_BY_USER`    | Consent was revoked by the user.                                          |

        | `REVOKED_BY_CLIENT`  | Consent was revoked by the client.                                        |

        | `REVOKED_BY_SYSTEM`  | Consent was revoked by the system.                                        |

        | `REVOKED_EXPIRED` | Consent has expired and is no longer valid.                                  |

        | `PENDING`            | Consent process is still in progress.                                     |

        '
      enum:
      - SUCCESS
      - PARTIAL_SUCCESS
      - FAILED
      - REVOKED_BY_USER
      - REVOKED_BY_CLIENT
      - REVOKED_BY_SYSTEM
      - REVOKED_EXPIRED
      - PENDING
    ConsentLinkType:
      title: ConsentLinkType
      type: string
      description: 'Type of consent link that defines how account connects.


        | Consent Link Type | Description                                       |

        |:------------------|:--------------------------------------------------|

        | `INSTANT`         | Consumer links account instantly via Open Banking.|

        | `MANUAL`          | Consumer links account manually.                  |

        '
      enum:
      - INSTANT
      - MANUAL
