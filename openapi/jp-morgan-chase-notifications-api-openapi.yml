      properties:
        kid:
          description: Key ID - a unique identifier for the key, used to match a specific key in a set.
          type: string
        kty:
          description: Key Type - specifies the cryptographic algorithm family used with the key (e.g., RSA, EC).
          type: string
        key_ops:
          type: array
          minItems: 0
          description: Key Operations - lists the permitted operations for the key (e.g., sign, verify, encrypt, decrypt).
          items:
            type: string
        alg:
          description: Algorithm - specifies the algorithm intended for use with the key (e.g., RS256, ES256).
          type: string
        crv:
          description: Curve - identifies the cryptographic curve used with an elliptic curve key (e.g., P-256, P-384).
          type: string
        x5u:
          description: X.509 URL - a URL that points to an X.509 public key certificate or certificate chain.
          type: string
        x5t:
          description: X.509 Certificate SHA-1 Thumbprint - a base64url-encoded SHA-1 thumbprint of the DER encoding of the X.509 certificate.
          type: string
        x5t#S256:
          description: X.509 Certificate SHA-256 Thumbprint - a base64url-encoded SHA-256 thumbprint of the DER encoding of the X.509 certificate.
          type: string
        n:
          description: Modulus - the modulus value for an RSA public key, base64url-encoded.
          type: string
        e:
          description: Exponent - the exponent value for an RSA public key, base64url-encoded.
          type: string
        x:
          description: X Coordinate - the x coordinate for an elliptic curve point, base64url-encoded.
          type: string
        y:
          description: Y Coordinate - the y coordinate for an elliptic curve point, base64url-encoded.
          type: string
        d:
          description: Private Key - the private key value, base64url-encoded (usually not included in public JWKS).
          type: string
        use:
          description: Public Key Use - indicates the intended use of the public key (e.g., sig for signature, enc for encryption).
          type: string
        exp:
          description: Expiration Time - Designates the hour, minute, and second on a specific day when the key will expire.
          type: string
        x5c:
          type: array
          minItems: 0
          description: X.509 Certificate Chain - contains the X.509 public key certificate or certificate chain in base64-encoded format.
          items:
            type: string
