    paymentAccount:
      description: Payment Account Information
      type: object
      properties:
        referenceAccountId:
          description: The identifier of the payment account maintained in the account consent process
            and referenced in the pay by bank payment process.
          type: string
        accountStatus:
          description: Codifies status of the account as it pertains to system of record synchronization
            and for online visibility.
          type: string
        tokenStatusType:
          description: Codifies the current state of the secure surrogate value (a.k.a. token) used to
            represent the card in this authorization request (e.g., A = Token Authorization, D = Token
            deleted or deactivated, L = Token locked).
          type: string
        tokenNumber:
          description: The token number is a SECURE surrogate value for the account number utilized in
            mobile payment. Token is created at enrollment into the Mobile Programs, such as Chase Pay,
            Apple Pay... For any transaction that is using the Mobile Program the Token Number will be
            attached as part of the transaction. The Token Number is a surrogate based on the Credit Card
            number, DDA Checking or other payments accounts may also be utilized as they can behave as
            a Credit Card for payment purposes. The token number is consistent with ISO 8583 message requirements,
            and is a 13 to 19-digit numeric value that must pass basic validation rules of an account
            number, including the LUHN check(Mod 10). The LUHN check is a test used by some card companies
            to distinguish valid card numbers from what could be a random selection of digits.  Token
            domains are different classifications that a token can fall under, usually describing different
            domains of digital payment transactions. There can be many Token Numbers to a single Card
            Number, DDA Checking Number, or Other payment accounts based on the Mobile Program the Token
            Number was created. Tokens must not have the same value as, or conflict with a Card number,
            DDA Check Number or Other payment Accounts.
          type: string
        tokenReferenceIdentifier:
          description: 'Identifies uniquely a token provisioning request assigned by token service/vault
            and provided to Issuer and Wallet Provider. This can be used as a reference to the token number
            that is assigned for an account when provisioning completes. Example: DNITHE461927644624368716'
          type: string
        last4AccountNumber:
          description: Identifies the final 4 digits of the 16 digit card number. The truncated value
            is used in place of the full number to protect against exposure of confidential information.
          type: string
        accountType:
          description: Denotes whether an account is considered a personal (consumer) or a business account.
          type: string
        accountOpenDate:
          description: Designates the year, month, and day when the account was first opened on the system.
          type: string
        accountNickname:
          description: The moniker chosen by the customer to identify the account.
          type: string
        paymentScore:
          $ref: '#/components/schemas/paymentScore'
        accountBalance:
          $ref: '#/components/schemas/accountBalance'
        accountholderInfo:
          $ref: '#/components/schemas/accountholderInfo'
        financialInstitutionName:
          description: Name of the Financial Institution linked by the Consumer and to be used for ECP
            payments.
          type: string
    paymentScore:
      description: Payment Score information
      type: object
      properties:
        schedulePaymentDate:
          description: Designates the year (YYYY), month (MM) and day (DD) when a consumer remitted funds
            to the merchant which will be used in exchange for goods or services provided.
          type: string
        settlementAmount:
          description: Specifies the monetary value used to resolve the outstanding transaction between
            two parties (such as Merchant Accounts, Company, Cardholder Accounts, etc.). This is the amount
            of a financial activity (payment or fee) that is included in a funds transfer.
          type: integer
          format: int64
        settlementCountryCode:
          description: Codifies the Country, a Geographic Area, that is recognized as an independent political
            unit in world affairs. This is the country where the funds were sent for resolving an outstanding
            transaction between two parties. (such as Merchant Accounts, Company, Cardholder Accounts,
            etc.)
          type: string
        checkingorSavingsAvailableBalanceAmount:
          description: Specifies the monetary value of available balance which is the checking or savings
            current balance minus permanent holds. This balance does not include overdraft protection
            funds or the sweep investment balance in the calculation.
          type: integer
          format: int64
        scoreByDay:
          $ref: '#/components/schemas/scoreByDay'
    accountBalance:
      description: Account Balance Information
      type: object
      properties:
        checkingorSavingsAvailableBalanceAmount:
          description: Specifies the monetary value of available balance which is the checking or savings
            current balance minus permanent holds. This balance does not include overdraft protection
            funds or the sweep investment balance in the calculation.
          type: integer
          format: int64
        amount:
          description: Specifies the monetary value of the transaction performed.
          type: integer
          format: int64
        currencyCode:
          description: Codifies the monetary unit that was associated with the financial transaction (such
            as sale, returns, chargebacks etc.).
          type: string
        lastUpdateDate:
          description: Designates the year (YYYY), month and day when the table or record was most recently
            updated.
          type: string
    accountholderInformation:
      description: Accountholder Information
      type: object
      properties:
        fullName:
          $ref: '#/components/schemas/fullName'
        firstName:
          description: That part of an individual's full name considered a personal name or given name
            and generally positioned before the last name or family name.
          type: string
        lastName:
          description: 'That part of an individual’s name generally placed at the end of the given name.
            The last name is also known as the surname or family name. (Note: name conventions may be
            different based on practices in different countries. Some countries use two or more last names;
            in other countries, the family name is placed before a person’s given name; in some countries,
            it is common for people to have only one name or a mononym.)'
          type: string
        middleName:
          description: 'That part of an individual''s name generally positioned between the first and
            family names, as a second given name or a maternal surname. (NOTE: in some instances, an individual
            may have multiple middle names)'
          type: string
        address:
          type: array
          minItems: 0
          description: List of addresses for the accountholder
          items:
            $ref: '#/components/schemas/address'
        emailList:
          type: array
          minItems: 0
          description: List of email information
          items:
            $ref: '#/components/schemas/email'
        phoneList:
          type: array
          minItems: 0
          description: List of phone information
          items:
            $ref: '#/components/schemas/phone'
    accountholderInfo:
      type: array
      minItems: 0
      description: Array of Accountholder Information
      items:
        $ref: '#/components/schemas/accountholderInformation'
    address:
      description: Accountholder Address Information
      type: object
      properties:
        addressType:
          description: Codifies the classification given to the various addresses captured for a party,
            such as Doing Business As Address, Legal Entity Address, and Tax Address.
          type: string
        fullAddress:
          description: 'A portion of a party''s address which is the line of the unstructured (unparsed)
            geographic street address containing any of the following: house number, street name, street
            direction, street type, dwelling type and number, PO Box number, rural delivery route number.'
          type: string
        line1:
          description: 'A portion of a party''s address which is the line of the unstructured (unparsed)
            geographic street address containing any of the following: house number, street name, street
            direction, street type, dwelling type and number, PO Box number, rural delivery route number.'
          type: string
        line2:
          description: 'A portion of a party''s address which is the line of the unstructured (unparsed)
            geographic street address containing any of the following: house number, street name, street
            direction, street type, dwelling type and number, PO Box number, rural delivery route number.'
          type: string
        city:
          description: A portion of a party's address which is the geographic area that is a municipality
            with legal power granted by a state/province charter.
          type: string
        state:
          description: Classifies a geographic area that represents a first level, legal and political
            subdivision of a country; for example, Virginia, Bavaria.
          type: string
        postalCode:
          description: The portion of a party’s address that is the encoded representation of a geographic
            area to facilitate mail delivery services.
          type: string
        countryCode:
          description: 'A code that identifies the Country, a Geographic Area, that is recognized as an
            independent political unit in world affairs. Note: This data element is a child of the Country
            Code CDE and valid values are based on ISO standards.'
          type: string
    scoreByDay:
      type: array
      minItems: 0
      description: Array of Day Score
      items:
        $ref: '#/components/schemas/dayScore'
    dayScore:
      description: Day Score
      type: object
      properties:
        potentialSettlementDate:
          description: The date on which a periodic summary of account activity with a beginning date
            and an ending date was issued.
          type: string
        compositScore:
          description: Specifies the weighted value representing the estimated confidence of a consumer
            payment using a bank account as of specific date. A confidence indicator that provides a 0-3602
            score per day (day 0-9)
          type: string
        compositeScoreCategory:
          description: Codifies the category of the weighted value representing the estimated confidence
            of a consumer payment using a bank account as of specific date. A confidence indicator that
            provides a 0-3602 score per day (day 0-9)
          type: string
        scoreDetails:
          $ref: '#/components/schemas/scoreDetails'
    scoreDetail:
      description: Score Details for a day
      type: object
      properties:
        accountSpendScore:
          description: Specifies the monetary value representing the estimated spend amount of a consumer
            from provided bank account as of specific date.
          type: string
        accountDepositScore:
          description: Specifies the weighted value representing the estimated deposit amount of a consumer
            on provided bank account as of specific date.
          type: string
        accountBalanceScore:
          description: Specifies the weighted value representing the account balance a consumer for a
            provided bank account as of specific date.
          type: string
        accountNonSufficientFundScore:
          description: Specifies the weighted value representing the non sufficient fund count of a consumer
            for a provided bank account as of specific date.
          type: string
    scoreDetails:
      type: array
      minItems: 0
      description: Array of score detail
      items:
        $ref: '#/components/schemas/scoreDetail'
    accountLinkException:
      description: Information on account link exception.
      type: object
      properties:
        accountReferenceNumber:
          description: A unique identifier associated with a specific cardholder primary account number
            (PAN) used to link a payment account represented by that PAN to affiliated payment tokens.
            This 29 character identification number can be used in place of sensitive consumer identification
            fields, and transmitted across the payments ecosystem to facilitate consumer identification.
          type: string
        clientSessionId:
          description: Identifies an interaction between a customer and a representative with the Firm
            within a given application tool.
          type: string
        consumerProfileId:
          description: Identifies a unique occurrence of a consumer's information maintained by the Firm
            on behalf of the merchant. The consumer profile contains information relevant to processing
            transactions such as name, address, account and potentially information for multiple payment
            methods.
          type: string
        consumerUserName:
          description: The unique moniker given to the individual who are customer of a merchant and maintained
            by merchant or a vendor for various purposes. In this context, this is maintained by pay by
            bank partner.
          type: string
        referenceAccountId:
          description: The identifier of the payment account maintained in the account consent process
            and referenced in the pay by bank payment process.
          type: string
        accountStatus:
          description: Codifies status of the account as it pertains to system of record synchronization
            and for online visibility.
          type: string
        responseCode:
          $ref: '#/components/schemas/responseCode'
        responseMessage:
          $ref: '#/components/schemas/responseMessage'
        accountBalance:
          $ref: '#/components/schemas/accountBalance'
        thirdPartyResponseCode:
          $ref: '#/components/schemas/responseCode'
        thirdPartyResponseMessage:
          $ref: '#/components/schemas/responseMessage'
    merchantOrderNumber:
      description: A unique identifier assigned by the merchant or on behalf of the merchant for the intention
        to purchase goods and/or services. The merchant order provides the merchant a reference to the
        prices, quantity and description of goods and/or services to be delivered for all transactions
        included in the sale.
      type: string
    hostMessage:
      description: Message received from Issuer, network or processor. Can be blank
      type: string
    hostResponseCode:
      description: Codifies the payment processor’s representation of the authorization response code
        being sent back to the merchant during credit card authorization.
      type: string
    consumerProfileNotificationType:
      description: Codifies the subscription type to consumer profile notifications
      type: string
      enum:
      - Created
      - PaymentMethodCreated
      - PaymentMethodDeleted
      - BulkConsumerProfileUpdate
      - All
    consumerProfileNotification:
