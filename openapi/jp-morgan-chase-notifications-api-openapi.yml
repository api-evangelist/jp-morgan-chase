          type: string
        referenceId:
          description: Return of Funds ID created by the client
          type: string
        refundAmount:
          $ref: '#/components/schemas/refundAmount'
        refundDateTimestamp:
          description: Refund request creation time stamp. Format - YYYY-MM-DDThh:mm:ss+/-time offset
            to UTC
          type: string
        refundSettledDateTimestamp:
          description: Refund request settlement time stamp. Format - YYYY-MM-DDThh:mm:ss+/-time offset
            to UTC
          type: string
        reason:
          description: 'The reason that originated the refund, that can be: “MED Operation Failure” or
            “MED Fraud” or “Client Initiated” or “Automatic Return of Funds”'
          type: string
        description:
          description:  Refund description provided by person/application that initiated the refund
          type: string
        refundStatus:
          description: Indicates if the refund was concluded successfully or not.
          type: string
        refundError:
          description: The reason of the error occurred during the refund processing.
          type: string
    paymentAmount:
      description: The value representation of a monetary amount. The amount value should be more than
        0.01 with maximum of two decimal places allowed
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/amount'
        currency:
          $ref: '#/components/schemas/currency'
    paidAmount:
