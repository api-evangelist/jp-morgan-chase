          description: The unique moniker created and maintained by the merchant or a vendor for accessing
            user interfaces with acquirer for login and other merchant related purposes.
          type: string
        userInterfaceSystemName:
          description: The label given to the user interaction system betwen acquirer and merchant.
          type: string
    payoutPostedTimestamp:
