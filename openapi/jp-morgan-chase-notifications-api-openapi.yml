    sourceResponseMessage:
      description: Long explanation of response Message from source system
      type: string
    sourceResponseStatus:
      description: Response status from source system
      type: string
    consumerProfileId:
      description: Identifies a unique occurrence of a consumer's information maintained by the Firm on
        behalf of the merchant. The consumer profile contains information relevant to processing transactions
        such as name, address, account and potentially information for multiple payment methods.
      type: string
    requestId:
      description: Merchant identifier for the request. The value must be unique.
      type: string
    email:
      description: Email Information
      type: object
      properties:
        emailAddress:
          description: A mail system that allows a party to send and receive messages electronically.
            An email address is composed of a local part and a domain part. The local part is unique to
            the individual while the domain or host name must meet specific standards required by the
            host that administers the email service.
          type: string
        isPrimary:
          description: Indicates the email address is the first point of communication in instances where
            there are multiple email addresses.
          type: boolean
        emailAddressType:
          description: Codifies the type of formatted numeric address for routing electronic message communications
            via email to reach a party.
          type: string
    phone:
      description: Phone Information
      type: object
      properties:
        phoneNumber:
          description: 'A locator whose value identifies the formatted numeric address for routing voice
            or data communications via telephony, to reach a party. NOTE: Telephone number formats may
            vary; this field can include domestic and international telephone numbers.'
          type: string
        countryCode:
          description: The telephone dialing prefix for a member country in the International Telecommunication
            Union (ITU) that is defined by the ITU-T E.164 standard. The code is a combination of one,
            two or three digits identifying a specific country, countries in an integrated numbering plan,
            or a specific geographic area.
          type: string
        phoneNumberType:
          description: Codifies the type of formatted numeric address for routing voice or data communications
            via telephony to reach a party.
          type: string
    publicKey:
      description: (***DEPRECATED***) Public Key information
      type: object
      readOnly: true
      deprecated: true
      properties:
        publicKeyIdentifier:
          description: Unique Identifier of the cipher key for exchanging data via an associated string
            or byte image. This is a public key generated by the producer of the data and shared with
            the consumer.
          type: string
        publicKeyText:
          description: Provides textual information about a cipher key for exchanging data via an associated
            string or byte image. This is a public key generated by the producer of the data and shared
            with the consumer.
          type: string
        publicKeyExpirationDate:
          description: Designates the year, month and day when a cipher key for exchanging data via an
            associated string or byte image is terminated.
          type: string
