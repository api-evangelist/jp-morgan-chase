          $ref: '#/components/schemas/qrCodePaid'
    qrCodeCancelled:
      description: Information regarding the cancelled state of QR Code
      type: object
      properties:
        status:
          description: 'Payment request and associated QR code status depicting the current status. Codifies
            the state when payment request is cancelled . Possible value : ''CANCELLED'''
          type: string
    qrCodeCreated:
      description: Information regarding the created state of QR Code
      type: object
      properties:
        status:
          description: 'Payment request and associated QR code status depicting the current status. Codifies
            the state when payment request is settled . Possible value : ''SETTLED'''
          type: string
        paymentDueDate:
          description: Payment Due Date. Format - YYYY-MM-DD . Applicable and mandatory  for Dynamic -
            Due Date QR Codes
          type: string
        expiresAt:
          description: Payment request expiration time stamp
          type: string
        gracePeriod:
          description: Number of consecutive calender days after payment due date, by which payment can
            be still be made. Beyond this date, QR code will be expired and it impacts any applicable
            discounts and might results in penalty. Applicable for Dynamic QR Code with due date expiration
          type: string
        isAmountAdjustable:
          description: If this value is true, it allows debtor to pay a different amount than the original
            payment amount specified by the creditor. Default:FALSE
          type: boolean
        paymentDetails:
          $ref: '#/components/schemas/paymentDetails'
    qrCodeExpired:
      description: Information regarding the expired state of QR Code
      type: object
      properties:
        status:
          description: 'Payment request and associated QR code status depicting the current status. Codifies
            the state when payment request is expired . Possible value : ''EXPIRED'''
          type: string
    qrCodePaid:
