    hasOutstandingInformation:
      description: Indicates whether there are outstanding items for the client to complete certain task
        and steps.
      type: boolean
    identificationStatus:
      description: Codifies the current state of the workflow for customer identification process during
        onboarding.
      type: string
      enum:
      - APPROVED
      - INFORMATION_REQUESTED
      - NOT_STARTED
      - REVIEW_IN_PROGRESS
    organizationName:
      description: Labels an entity as identified in its formation documents and, where applicable, as
        registered with a state, local, or federal government, or other chartering, or licensing authority.
      type: string
    fullName:
      description: The party's name as provided at the time the party is onboarded or updated based on
        firm policies and business rules that allow for such updates. For an individual this field includes
        the first, middle, and last name. The full name can also include prefixes such as Dr. or Hon.
        and suffixes such as Jr or III. For non carbon entities, the field reflects the complete legal
        name by which an entity is registered with a state, local or federal government.
      type: string
    merchantSuspendedAutoblock:
