  /notifications/{notification-id}:
    get:
      summary: Get a notification by notification Id
      operationId: v1GetNotificationByNotificationId
      tags:
      - Notifications
      description: Retrieves a specific notification using the notification Id
      parameters:
      - name: merchant-id
        in: header
        deprecated: true
        schema:
          type: string
          pattern: ^[0-9]{8,12}$
        description: Identifier for the merchant account.
        examples:
          Success:
            value: '9876543210'
          Authentication failure:
            value: '9876543211'
          Authorization failure:
            value: '9876543212'
          Notification not found:
            value: '9876543213'
      - name: request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
        description: A unique identifier provided by the requestor for each request.
        examples:
          Success:
            value: 7611d1bf-325c-4795-a828-ac21f9bea5dc
          Authentication failure:
            value: 7611d1bf-325c-4795-a828-ac21f9bea7ab
          Authorization failure:
            value: 7611d1bf-325c-4795-a828-ac21f9bea8dc
          Notification not found:
            value: 7611d1bf-325c-4795-a828-ac21f9bea6ab
      - name: notification-id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: A unique identifier provided by the requestor for each request.
        examples:
          Success:
            value: 44444444-4017-11e9-b649-8de064221544
          Authentication failure:
            value: 44444444-4017-11e9-b649-8de064221234
          Authorization failure:
            value: 44444444-4017-11e9-b649-8de064224567
          Notification not found:
            value: 44444444-4017-11e9-b649-8de064227890
      - name: entity-id
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{8,12}$
        description: Identifier for the entity.
        examples:
          Success:
            value: '9876543210'
          Authentication failure:
            value: '9876543211'
          Authorization failure:
            value: '9876543212'
          Notification not found:
            value: '9876543213'
      - name: entity-type
        in: header
        required: true
        schema:
          type: string
          enum:
          - MERCHANT
          - PLATFORM
          - CLIENT
          - ACCOUNT
          - EMBEDDED_PLATFORM
          - CONSUMER
        description: Type of entity  identifier.
        examples:
          Success:
            value: MERCHANT
          Authentication failure:
            value: PLATFORM
          Authorization failure:
            value: CLIENT
          Notification not found:
            value: ACCOUNT
      - name: subscription-channel
        in: header
        schema:
          type: string
          enum:
          - WEBHOOK
          - EMAIL
          - IN-APP-COMMERCE-CENTER
        description: List of medium through which event notifications will be delivered to recipient.
        examples:
          Success:
            value: WEBHOOK
          Authentication failure:
            value: EMAIL
          Authorization failure:
            value: WEBHOOK
          Notification not found:
            value: EMAIL
      - name: parent-entity-id
        in: header
        schema:
          type: string
          pattern: ^[0-9]{8,12}$
        description: Identifies the Parent Entity in the merchant hierarchy applicable to this request
          (e.g. platform ID in ISV use cases).
        examples:
          Success:
            value: 0123456797
          Authentication failure:
            value: 0123456798
          Authorization failure:
            value: 0123456799
      - name: parent-entity-type
        in: header
        schema:
          type: string
          enum:
          - PLATFORM
          - EMBEDDED_PLATFORM
        description: Code for the Parent Entity Type in the merchant hierarchy applicable to this request
          (e.g. platform in ISV use cases).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notificationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/adfsError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/messages'
