          $ref: '#/components/schemas/paymentRoutingInformation'
        balanceLimits:
          $ref: '#/components/schemas/balanceLimits'
        restrictions:
          $ref: '#/components/schemas/restrictions'
        createdAt:
          description: The date and time the account was created
          type: string
        updatedAt:
          description: Designates the hour, minute and second in a specific day when the record was most
            recently updated.
          type: string
        requestId:
          description: A uniquely generated identifier for a request which the consuming resource uses
            to recognize subsequent retries of the same request
          type: string
        parentAccountId:
          description: This Field indicates the  account Identifier for the Parent Client. Field that
            will carry the value of a previously established SUMMARY_ACCOUNT for TRANSACTION_ACCOUNT or
            SUMMARY_ACCOUNT only.
          type: string
    balanceLimits:
      description: Balance Limits
      type: object
      properties:
        minimumBalance:
          description: Specifies the monetary value of the minimum balance on a customer account.Specifies
            the minimum monetary balance the account is allowed to have. The account balance will not
            be allowed to go below this limit
          type: string
        maximumBalance:
          description: Specifies the maximum monetary balance the account is allowed to have. The account
            balance will not be allowed to go above this limit
          type: string
    restrictionAdded:
      description: Restriction Added
      type: object
      properties:
        id:
          description: Account identifier generated by Embedded Finance
          type: string
        restrictionId:
          description: An identifier whose value is sequentially or randomly assigned in a non-intelligent
            manner to represent a row in the Payment Medium Purchase Restriction table.Unique identifier
            for the restriction
          type: string
        restrictionReason:
          description: Textual form of  specific restriction on financial resources. Reason for restriction
            on account
          type: string
        restrictionType:
          description: Codifies the specific restriction  on financial resources. The type of restriction
            to apply to the account, Can be DEBITS, CREDITS, DEBIT_CREDIT or DIRECT_DEBIT
          type: string
        restrictionStatus:
          description: Codifies the status of a limiting condition placed on a brokerage investment account.
            The condition (restriction) limits transactions that can be performed on the account.Current
            status of the restriction, Can be ACTIVE, INACTIVE, IN_REVIEW, IN_PLACE, CANCELLED, REJECTED,
            REMOVE_IN_REVIEW, REMOVED, EXPIRED, PENDING
          type: string
        holdAmount:
          description: Amount kept in an account which was setup to protect the firm against anticipated
            risks arising out of (or relating to) a merchant's processing. This amount is meant to cover
            any unbilled processing costs and estimated exposure based on anticipated risks.
          type: string
        amount:
          description: Amount kept in an account which was setup to protect the firm against anticipated
            risks arising out of (or relating to) a merchant's processing. This amount is meant to cover
            any unbilled processing costs and estimated exposure based on anticipated risks.
          type: string
        effectiveFrom:
          description: Designates the hour, minute and second in a specific day when an account was placed
            in restriction.
          type: string
        effectiveUntil:
          description: Designates the hour, minute and second in a specific day when an account was released
            from restriction. A restriction is to freeze an account to prevent any transactional activities.
          type: string
        requestId:
          description: A uniquely generated identifier for a request which the consuming resource uses
            to recognize subsequent retries of the same request
          type: string
