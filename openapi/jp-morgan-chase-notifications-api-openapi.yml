        entityId:
          description: Identifies an account that processes transactions on any of the Firm's payment
            processing systems or a profile (configuration) for an external client or internal service
            of the Firm that facilitates how it interacts with the Firm's services such as onboarding,
            transaction processing, embedded banking, etc.
          type: string
        enterprisePartyId:
          description: The Firm-declared authoritative unique identifier assigned to an external party
            involved in some manner with the Firm. This is a system-generated element that uses party
            name, address, and Tax Government Issued Identifier to define a unique individual or non-individual.
            The identifier is used for operational purposes. This critical data element is commonly referred
            to as the ECI (Enterprise Customer ID) or ECID and was formerly called the Enterprise Customer
            Identifier.
          type: string
        entityCountry:
          description: Codifies the three digit value used to define country per ISO 3166 standard (e.g.
            840=United States, 124=Canada).
          type: string
        entityType:
          description: Codifies the category of entity used for setup a configuration for various purposed
            such as reporting group, notification and so on.
          type: string
        applicationProgramInterfaceIdentifierList:
          type: array
          minItems: 0
          description: List if identifiers which are unique occurrence of an Application Program Interface
            (API) available within the Firm.
          items:
            type: string
        contactDetails:
          $ref: '#/components/schemas/contactDetails'
        platformId:
          description: (***DEPRECATED***)  A unique identifier representing the profile (configuration)
            for an external client or internal service of the Firm that facilitates how it interacts with
            the Firm's services such as onboarding, transaction processing, embedded banking, etc.
          type: string
          deprecated: true
        firmSubLineBusinessName:
          description: 'Identifier of the business to which entity belongs. Possible values :'
          type: string
          enum:
          - merchant-services
          - embedded-payments
        parentEntityId:
          description: Identifies the Parent Entity in the merchant hierarchy applicable to this request
            (e.g. platform ID in ISV use cases)
          type: string
        parentEntityType:
          description: Code for the Parent Entity Type in the merchant hierarchy applicable to this request
            (e.g. platform in ISV use cases)
          type: string
    contactDetails:
      description: Contact Details ( this object is required only for Default/Mandatory Notifications)
      type: object
      properties:
        callbackURL:
          $ref: '#/components/schemas/callbackURL'
        emailAddress:
          description: A mail system that allows a party to send and receive messages electronically.
            An email address is composed of a local part and a domain part. The local part is unique to
            the individual while the domain or host name must meet specific standards required by the
            host that administers the email service.
          type: string
        uiLogin:
          $ref: '#/components/schemas/uiLogin'
        phone:
          $ref: '#/components/schemas/phone'
    uiLogin:
      description: UI Login information.
      type: object
