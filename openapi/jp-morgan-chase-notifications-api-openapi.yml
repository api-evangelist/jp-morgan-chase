      type: object
      properties:
        merchantId:
          description: Identifies a unique entity for transaction processing at the lowest level of the
            account hierarchy of the backend proprietary merchant acquiring processing platform. This
            level organizes transaction types for submission, funding, and reporting.
          type: string
        batchId:
