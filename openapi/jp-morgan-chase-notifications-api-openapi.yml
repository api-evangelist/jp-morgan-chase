          description: Internally generated identifier for an Allocation.
          type: string
        accountId:
          description: Account identifier for an allocation against which the money would be settled.
          type: string
        amount:
          description: Specifies the monetary value of the transaction performed.
          type: string
        currency:
          description: (***DEPRECATED***) Codifies the monetary unit that was associated with the financial
            transaction (such as sale, returns, chargebacks etc.).
          type: string
          deprecated: true
        type:
          description: Defines the type of an allocation. Values can be SPLIT, BUSINESS_FUNCTION_CODE.
          type: string
        businessFunctionCode:
          description: (***DEPRECATED***) Business function code value for the allocation. Business function
            can be PLATFORM_FEE, PLATFORM_FEE_REVERSED for example.
          type: string
          deprecated: true
        state:
          description: Represents the current state of an Allocation.
          type: string
        chargeCode:
          description: Business function code value for the allocation. Business function can be PLATFORM_FEE,
            PLATFORM_FEE_REVERSED for example.
          type: string
    pspSettlementRef:
      description: Defines an provider settlement reference which is contained in an Allocation Order.
      type: object
      properties:
        id:
          description: Identifies a unique occurrence of a transaction at rest maintained by the application
