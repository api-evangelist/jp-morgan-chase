    authenticationNotificationType:
      description: 'Codifies the categories of messages the firm uses to communicate with the merchant.
        Sample values are: chargeback, alerts, funding. In this context, this is for the notifications
        for the pay by bank feature. The possible values are  "AuthenticationComplete"'
      type: string
      enum:
      - AuthenticationComplete
    authenticationUpdateNotification:
      description: The Cardholder Authentication updates information.
      type: object
      properties:
        authenticationComplete:
          $ref: '#/components/schemas/authenticationComplete'
    authenticationComplete:
      description: Information on authentication response received.
      type: object
      properties:
        threeDSVersion:
          description: Codifies the verson of the Three Domain Secure (3-D Secure or 3DS) software that
            is used by the merchant. 3DS is a protocol designed to be an additional multi-factor security
            layer and is performed for online debit and credit card authorization requests. The acquirer
            domain initiates the transaction for 3DS authentication. The interoperability domain sends
            a message to the corresponding issuing bank based on the Bank Identification Number (BIN)
            range. The issuing bank domain authenticates the card user.
          type: string
        authenticationValue:
          description: Base 64 encoded cryptogram received during authorization to verify that  the integrity
            of data contained within a payment request matches what was originally authorized during authentication.
            This field is specifically used for card authorizations.
          type: string
        electronicCommerceIndicator:
          description: Describes the Electronic Commerce Indicator used in cardholder authentication on
            a network token
          type: string
        authenticationStatusReasonText:
          description: Codifies a detailed rationale for authentication success or failure of the Three
            Domain Secure (3-D Secure or 3DS) Transaction Status. 3DS is a protocol designed to be an
            additional multi-factor security layer and is performed for online debit and credit card authorization
            requests. The acquirer domain initiates the transaction for 3DS authentication. The interoperability
            domain sends a message to the corresponding issuing bank based on the Bank Identification
            Number (BIN) range. The issuing bank domain authenticates the card user.
          type: string
        updateTimestamp:
          description: Designates the hour, minute, and second in a specifc day when the record was last
            modified.
          type: string
        authenticationTransactionId:
          description: Universally unique transaction identifier to identify a single transaction generated
            by the Three Domain Secure Server. This value has 36 characters in a format defined in IETF
            RFC 4122.
          type: string
        threeDSTransactionStatus:
          description: Codifies the authentication response of the Three Domain Secure (3-D Secure or
            3DS) transaction based on the value returned in Authentication Response Message (ARes). The
            ARes message is the Issuer's Access Control Server (ACS) response to the Authorization Request
            Message (AReq). 3DS is a protocol designed to be an additional multi-factor security layer
            and is performed for online debit and credit card authorization requests. The acquirer domain
            initiates the transaction for 3DS authentication. The interoperability domain sends a message
            to the corresponding issuing bank based on the Bank Identification Number (BIN) range. The
            issuing bank domain authenticates the card user.
          type: string
        authenticationId:
          description: A unique identifier for the card owner authentication provided by a global authentication
            solution such as Three Domain Secure (3DS) designed to make eCommerce transactions more secure
            and reduce fraud.
          type: string
