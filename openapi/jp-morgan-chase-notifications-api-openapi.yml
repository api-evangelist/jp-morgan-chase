    accountUpdated:
      description: Account Updated
      type: object
      properties:
        id:
          description: Account identifier generated by Embedded Finance
          type: string
        clientId:
          description: Unique identifier created by the Firm as a small medium business for the merchant
            and platform.
          type: string
        category:
          description: The category of account based on high level grouping like Checking, Investments
            or Assets. A grouping of the account according to broader industry attributes may be identified
            by an Aggregator. Possible values include Banking, Investment, Insurance, and Loan. Categories
            contain more granular account types, while types can only have one category.Category of the
            account. Possible values are - CLIENT_DDA, CLIENT_OFFSET, DDA, DEFAULT, EMBEDDED_DDA, LIMITED_DDA,
            LIMITED_DDA_COMMERCE, MANAGEMENT, OPERATING, PROCESSING, PROCESSING_OFFSET, SUMMARY_ACCOUNT,
            TRANSACTION_ACCOUNT
          type: string
        state:
          description: Current status of the account. Possible values are - OPEN, PENDING_CLOSE, CLOSED,
            PENDING_OPEN
          type: string
        label:
          description: Account Name
          type: string
