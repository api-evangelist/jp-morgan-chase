                      source: API
              HoldAmendedWireTransfer:
                description: 'com.jpmorgan.payments.payment.hold.ammended.v1 notification for a wire transfer hold that was rejected as fraud.

                  '
                summary: Hold Updated – Wire Transfer Rejected (Fraud)
                value:
                  specversion: '1.0'
                  id: a1c9e3d7-82f4-4b6a-9d1e-3f7c8a2b5e90
                  time: '2026-02-03T09:30:00Z'
                  type: com.jpmorgan.payments.payment.hold.ammended.v1
                  source: api.payments.jpmorgan.com/trust-safety/v1
                  dataschema: urn:com.jpmorgan.payments/payment-hold
                  data:
                    id: 06bca14f-1fc0-4cd7-9e0b-8bb7e06334f7
                    status: REJECTED
                    substatus: REJECTED_FRAUD_JPM
                    decision:
                      source: API
                      rejectReason: FRAUD
                      fraud:
                        type: OTHER
                        additionalInformation: Suspicious wire transfer to unknown beneficiary
              HoldAmendedRtp:
                description: 'com.jpmorgan.payments.payment.hold.ammended.v1 notification for a US RTP hold that was auto-cancelled due to expiration.

                  '
                summary: Hold Updated – RTP Auto-Cancelled
                value:
                  specversion: '1.0'
                  id: e9f1a3b5-c7d9-4e2f-b0a4-6d8c1e3f5a72
                  time: '2026-02-12T17:20:01Z'
                  type: com.jpmorgan.payments.payment.hold.ammended.v1
                  source: api.payments.jpmorgan.com/trust-safety/v1
                  dataschema: urn:com.jpmorgan.payments/payment-hold
                  data:
                    id: d7e3f1a9-4c82-4b6d-9a0e-5f2c8d1b3e70
                    status: REJECTED
                    substatus: REJECTED_AUTO_CANCELLED_JPM
                    decision:
                      source: JPMC_UI
                      rejectReason: TRANSACTION_NO_LONGER_NEEDED
              HoldClosedByJpmReview:
                description: 'com.jpmorgan.payments.payment.hold.closed.v1 notification when a hold is closed by JPM review.

                  '
                summary: Hold Closed – Closed by JPM Review
                value:
                  specversion: '1.0'
                  id: b4d82e1f-6a93-4c7b-8e2d-9f1a3c5d7b60
                  time: '2026-02-05T11:20:00Z'
                  type: com.jpmorgan.payments.payment.hold.closed.v1
                  source: api.payments.jpmorgan.com/trust-safety/v1
                  dataschema: urn:com.jpmorgan.payments/payment-hold
                  data:
                    id: 06bca14f-1fc0-4cd7-9e0b-8bb7e06334f7
                    status: REJECTED
                    substatus: REJECTED_FRAUD_JPM
                    decision:
                      source: API
                      rejectReason: FRAUD
                      fraud:
                        type: BUSINESS_EMAIL_COMPROMISE
              HoldClosedTrueFraudAfterDistribution:
                description: 'com.jpmorgan.payments.payment.hold.closed.v1 notification when true fraud is reported after payment distribution.

                  '
                summary: Hold Closed – True Fraud Reported After Payment Distribution
                value:
                  specversion: '1.0'
                  id: e7f19c4a-2d85-4b3e-a6c1-8d4f2e9b7a13
                  time: '2026-02-08T14:45:00Z'
                  type: com.jpmorgan.payments.payment.hold.closed.v1
                  source: api.payments.jpmorgan.com/trust-safety/v1
                  dataschema: urn:com.jpmorgan.payments/payment-hold
                  data:
                    id: 06bca14f-1fc0-4cd7-9e0b-8bb7e06334f7
                    status: REJECTED
                    substatus: REJECTED_FRAUD_JPM
                    decision:
                      source: API
                      rejectReason: FRAUD
                      fraud:
                        type: BUSINESS_EMAIL_COMPROMISE
      responses:
        '204':
          description: Return a 204 status to indicate that the data was received successfully by client
    servers:
    - url: https://api.payments.jpmorgan.com/trust-safety/v1
      description: PRODUCTION - MTLS
    - url: https://api-cat.payments.jpmorgan.com/trust-safety/v1
      description: CLIENT TESTING - MTLS
    - url: https://api-mock.payments.jpmorgan.com/trust-safety/v1
      description: MOCK
components:
  schemas:
    AccountType:
      title: AccountType
      type: string
      enum:
      - DDA
      - BDA
      - CARD
      - LOAN
      - ODFT
      - NREX
      - CACC
      - SVGS
      - TRAN
      - CLABE
      - VOSTRO
      - IBAN
      - BBAN
      - DFLT
      - SLRY
      - EMBEDDED_DDA
      - LIMITED_DDA
      - WALLET
      - VAM
      - INTERAC
      - PAYPAL
      - VENMO
      - OTHER
      description: Account Type
    PaymentValue:
      title: PaymentValue
      description: A positive amount of value.
      type: object
      required:
      - currency
      - amount
      properties:
        currency:
          $ref: '#/components/schemas/IsoCurrencyCode'
        amount:
          $ref: '#/components/schemas/AmountDecimal'
    UnstructuredAddress:
      title: UnstructuredAddress
      type: array
      description: Unstructured Addresses
      minItems: 1
      maxItems: 7
      items:
        type: string
        minLength: 1
        maxLength: 70
    PartyId:
      title: PartyId
      description: Party Identification
      oneOf:
      - $ref: '#/components/schemas/OrganizationIdentification'
      - $ref: '#/components/schemas/IndividualIdentification'
      example:
        organizationIds:
        - organizationId: '123456'
          schemeName:
            proprietary: JPMCOID
    Uuid:
      title: Uuid
      type: string
      description: Unique payment hold identifier generated by JPMC
      minLength: 32
      maxLength: 36
      x-faker: random.uuid
      example: 253f67f3-b640-44cb-aabd-2cc348b52658
    CreditorAgent:
      title: CreditorAgent
      type: object
      description: The Bank or financial institution of the creditor (the party receiving the payment).
      required:
      - financialInstitutionIds
      additionalProperties: false
      properties:
        name:
          type: string
          description: Name of the agent
          minLength: 1
          maxLength: 140
          example: JPM CHASE NEW YORK
        financialInstitutionIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/FinancialInstitutionId'
        postalAddress:
          $ref: '#/components/schemas/Address'
        additionalInstitutions:
          $ref: '#/components/schemas/AdditionalInstitutions'
    TransferType:
      title: TransferType
      type: string
      enum:
      - CREDIT
      - DEBIT
      description: 'Indicates the direction of the money movement. The transaction is either a `credit` push transfer or a direct `debit` pull transfer.


        | Market/Instrument | Transfer Type |

        |-------------------|---------------|

        | Credit Transfers | CREDIT |

        | Direct-Debits | DEBIT |

        '
    PaymentType:
      title: PaymentType
      type: string
      enum:
      - WIRE
      - ACH
      - RTP
      description: The type of payment being initiated - **WIRE** for Wire Payments, **ACH** for ACH Payments, **RTP** for Real-Time Payments
    PostalCode:
      title: PostalCode
      type: string
      description: Postal code
      minLength: 1
      maxLength: 20
      example: '10001'
    NotificationBase:
      title: Notification Base
      description: 'Common CloudEvents envelope properties shared by all payment hold notification events.

        See [CloudEvents Specification v1.0](https://github.com/cloudevents/spec/blob/v1.0/spec.md).

        '
      type: object
      required:
      - id
      - specversion
      - time
      - source
      - data
      properties:
        specversion:
          type: string
          description: 'The version of the CloudEvents specification which the event uses

            '
          default: '1.0'
        id:
          $ref: '#/components/schemas/Uuid'
        time:
          description: Event occurrence timestamp. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC
          type: string
          format: date-time
        source:
          description: Identifies the context in which an event happened. Often this will include information such as the type of the event source, the organization publishing the event or the process that produced the event.
          type: string
          format: uri-reference
        dataschema:
          description: URI of the event data schema
          type: string
          format: uri
    AmountDecimal:
      title: PaymentAmountDecimal
      type: string
      description: A String representation of a (potentially) whole number or decimal positive number. - Amount should be more than 0.01 with maximum of two decimal places allowed in most markets.
      minLength: 1
      maxLength: 40
      pattern: ^\d+(\.\d+)?$
    AdditionalParties:
      title: AdditionalParties
      type: object
      description: Additional parties involved in the payment transaction.
      properties:
        ultimateCreditor:
          $ref: '#/components/schemas/UltimateCreditor'
        ultimateDebtor:
          $ref: '#/components/schemas/UltimateDebtor'
        initiatingParty:
          $ref: '#/components/schemas/InitiatingParty'
        instructedAgent:
          $ref: '#/components/schemas/FinancialInstitutionId'
        intermediaryAgents:
          type: array
          description: Intermediary agents between the debtor's agent and the creditor's agent.
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/IntermediaryAgent'
        previousInstructingAgent:
          $ref: '#/components/schemas/PreviousInstructingAgent'
    OrganizationId:
      title: OrganizationId
      type: object
      required:
      - organizationId
      description: "Collection of registration information held against the party.\nIt can be used when the underlying payer is a Legal Entity. It should be used together with Ultimate Debtor Name and address, and it should contain the payment account number of the underlying payer. In case the transfer has not been initiated from a payment account, the value populated should be a unique transaction identifier of the underlying payer which permits the traceability of the transaction back to them.\n\nApplicable markets and rules: - Can be used for ultimateDebtor and ultimateCreditor for the following RTP markets:\n  - SEPA \n  - Mexico \n  - UK\n  - United States\n\n***Australia Faster Payments - Only to be used for ultimateCreditor. For Australia Faster Payments, only id and schemeName.proprietary fields are applicable\nWIRE Payments:\n  - WHEM\n  - LATAM\n  - EMEA\n  - APAC"
      properties:
        organizationId:
          type: string
          minLength: 1
          maxLength: 35
          description: 'Formally Issued Organization Identifier - **Note**: For AU Superannuation payment (category payment), populate with USI number for the Superannuation fund.'
        bic:
          type: string
          description: "Business Identifier Code, mean a unique code to identify \nany business as defined by the ISO9362 standard. "
          minLength: 8
          maxLength: 11
        lei:
          type: string
          description: Legal entity identifier
          minLength: 20
          maxLength: 20
        issuer:
          type: string
          description: Entity that assigns the identification
          minLength: 1
          maxLength: 35
        schemeName:
          description: Name of the identification scheme
          title: SchemeName
          type: object
          minProperties: 1
          maxProperties: 1
          properties:
            code:
              type: string
              description: Name of the identification scheme in a coded form
              minLength: 1
              maxLength: 4
            proprietary:
              type: string
              description: Specifies the type of scheme with a proprietary value. For AU Superannuation payment (category payment), populate "USI"
              minLength: 1
              maxLength: 35
    Creditor:
      title: Creditor
      type: object
      description: The creditor (payee) of the payment instruction.
      allOf:
      - $ref: '#/components/schemas/Party'
    Party:
      title: Party
      allOf:
      - $ref: '#/components/schemas/BasicParty'
      - title: PartyDetails
        type: object
        description: Additional details of the party including account, contact details, and party identifier.
        properties:
          account:
            $ref: '#/components/schemas/Account'
          contactDetails:
            title: ContactDetails
            type: object
            description: Contact details of the party
            properties:
              emailAddress:
                type: string
                format: email
                description: Email address
                example: john.doe@email.com
              phoneNumber:
                type: string
                description: Phone number
                minLength: 1
                maxLength: 35
          partyId:
            $ref: '#/components/schemas/PartyId'
    OrganizationIdentification:
      type: object
      title: Organization Identification
      description: Organization Identification Schemes
      required:
      - organizationIds
      properties:
        organizationIds:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/OrganizationId'
    FraudType:
      type: string
      description: 'Type of fraud


        | Enum Value | Description |

        |------------|-------------|

        | BUSINESS_EMAIL_COMPROMISE | Fraudulent email schemes targeting business transactions |

        | JPM_PLATFORM_ACCOUNT_TAKEOVER | Unauthorized access to JPMorgan platform accounts |

        | SCAM | Various types of fraudulent schemes and deceptive practices |

        | OTHER | Any other type of fraud (free format description can be provided) |

        '
      enum:
      - BUSINESS_EMAIL_COMPROMISE
      - JPM_PLATFORM_ACCOUNT_TAKEOVER
      - SCAM
      - OTHER
    PaymentHoldAmendedData:
      title: PaymentHoldAmendedData
      description: 'Data payload for com.jpmorgan.payments.payment.hold.ammended.`v1` events.

        A payment hold has been updated (decisioned, distributed, reassigned). The payload includes the updated status/substatus, decision and distribution, if applicable.

        '
      allOf:
      - $ref: '#/components/schemas/PaymentHoldNotificationData'
      - title: Payment Hold Amended Data Attributes
        description: Properties specific to the com.jpmorgan.payments.payment.hold.ammended.v1 event data payload.
        type: object
        properties:
          decision:
            $ref: '#/components/schemas/Decision'
          distribution:
            allOf:
            - $ref: '#/components/schemas/Distribution'
            description: 'ACH distribution details for the payment hold. Only present when `paymentType` is `ACH`;

              this object will not be present for other payment types.

              '
    DecisionStatus:
      title: DecisionStatus
      type: string
      description: 'Status of the payment hold


        | Enum Value | Description |

        |------------|-------------|

        | PENDING | Payment hold is pending review and decision |

        | APPROVED | Payment hold has been approved and will be processed |

        | REJECTED | Payment hold has been rejected and will not be processed |

        '
      enum:
      - PENDING
      - APPROVED
      - REJECTED
    AddressType:
      title: AddressType
      type: string
      description: Type of address
      enum:
      - ADDR
      - BIZZ
      - DLVY
      - HOME
      - MLTO
      - PBOX
      example: HOME
    UltimateDebtor:
      title: UltimateDebtor
      type: object
      description: Represents the ultimate party responsible for the payment, who is the original source of funds in the transaction, even if the payment is made on their behalf by another party. This schema captures all relevant identifying and account details of the ultimate debtor.
      allOf:
      - $ref: '#/components/schemas/Party'
    IndividualId:
      type: object
      title: IndividualId
      required:
      - individualId
      description: "Can be used if organization ID is not populated, when the underlying payer is an Individual. It should be used together with Ultimate Debtor Name and address, and it should contain the payment account number of the underlying payer. In case the transfer has not been initiated from a payment account, the value populated should be a unique transaction identifier of the underlying payer which permits the traceability of the transaction back to them\n\nApplicable RTP markets:\n\n    SEPA \n    Mexico \n    UK\n    United States"
      properties:
        individualId:
          type: string
          description: Unique and unambiguous identification of an individual
          minLength: 1
          maxLength: 35
        issuer:
          type: string
          description: Entity that assigns the identification
          minLength: 1
          maxLength: 35
        schemeName:
          description: Name of the identification scheme
          title: SchemeName
          type: object
          minProperties: 1
          maxProperties: 1
          properties:
            code:
              type: string
              description: Name of the identification scheme in a coded form
              minLength: 1
              maxLength: 4
            proprietary:
              type: string
              description: Specifies the type of scheme with a proprietary value. For AU Superannuation payment (category payment), populate "USI"
              minLength: 1
              maxLength: 35
    EndToEndId:
      type: string
      title: EndToEndId
      minLength: 1
      maxLength: 128
      x-faker: random.uuid
      description: 'Customer assigned Unique identifier to unambiguously identify the Payment transaction.

        This identification is passed on, unchanged, throughout the entire end-to-end chain.'
      example: AD202109311354152
    Fraud:
      type: object
      title: Fraud
      description: 'Fraud details associated with a rejected payment hold. Only present when `rejectReason` is `FRAUD`.

        '
      properties:
        type:
          $ref: '#/components/schemas/FraudType'
        additionalInformation:
          type: string
          description: Free-form text providing additional context about the fraud. Recommended when `type` is `OTHER`.
          minLength: 1
          maxLength: 500
    Rule:
      type: object
      title: Rule
      description: Client defined rule
      properties:
        id:
          type: string
          description: Unique rule identifier
          minLength: 1
          maxLength: 50
        name:
          type: string
          description: Rule Name
          minLength: 1
          maxLength: 250
        description:
          type: string
          description: Rule Description
          minLength: 0
          maxLength: 500
        effectiveAt:
          type: string
          description: Rule Effective Date
          format: date
    Debtor:
      title: Debtor
      type: object
      description: The party that owes money and is responsible for repaying the debt.
      allOf:
      - $ref: '#/components/schemas/Party'
    IsoCurrencyCode:
      title: IsoCurrencyCode
      type: string
      description: ISO 4217 Alpha-3 Currency Code
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      example: AUD
    IndividualIdentification:
      type: object
      title: Individual Identification
      description: Individual Identification Schemes
      required:
      - individualIds
      properties:
        individualIds:
          type: array
          minItems: 1
          maxItems: 16
          items:
            $ref: '#/components/schemas/IndividualId'
    DebtorAgent:
      title: DebtorAgent
      type: object
      description: An agent is a financial institution that acts on behalf of the debtor in a financial transaction. The agent facilitates the transaction by processing payments, managing accounts, and ensuring the transfer of funds between parties.
      required:
      - financialInstitutionIds
      additionalProperties: false
      properties:
        name:
          type: string
          description: Name of the agent
          minLength: 1
          maxLength: 140
          example: JPM CHASE NEW YORK
        financialInstitutionIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/FinancialInstitutionId'
        postalAddress:
          $ref: '#/components/schemas/Address'
        additionalInstitutions:
          $ref: '#/components/schemas/AdditionalInstitutions'
    IsoCountryCode:
      title: IsoCountryCode
      type: string
      description: ISO 3166-1 Alpha-2 Country Code
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
      example: AU
    PaymentHeldData:
      title: PaymentHeldData
      description: 'Data payload for com.jpmorgan.payments.payment.hold.placed.`v1` events.

        A payment has been held for review. The payload contains the complete hold including the payment details.

        '
      allOf:
      - $ref: '#/components/schemas/PaymentHoldNotificationData'
      - title: Payment Held Data Attributes
        description: Properties specific to the com.jpmorgan.payments.payment.hold.placed.v1 event data payload.
        type: object
        properties:
          reasons:
            type: array
            description: 'One or more reasons the payment was held by the bank. Reasons may be provided when `exceptionType` is `BANK_RULE` or `CUSTOM_RULE_AND_BANK_RULE`, describing why JPMorgan''s fraud screening program flagged the payment. However, reasons are not guaranteed — this array may be empty or absent even when a bank rule triggered the hold.

              '
            minItems: 0
            maxItems: 25
            items:
              type: string
              minLength: 1
              maxLength: 550
          cutOffAt:
            type: string
            description: 'The date and time at which the hold will expire and be automatically cancelled. The cutoff is calculated based on the transaction type and how long the hold has been active. After the cutoff time passes, the hold expires and payment is auto-cancelled, producing a substatus of `REJECTED_AUTO_CANCELLED_JPM` for the hold. No further action can be taken on an expired hold.

              '
            format: date-time
          rules:
            description: 'Rules/Criteria that initiated the payment hold. When `exceptionType` is `CUSTOM_RULE` or `CUSTOM_RULE_AND_BANK_RULE`.  This array will contain an entry for each client-defined (custom) rule associated with the hold.

              '
            type: array
            minItems: 0
            maxItems: 100
            items:
              $ref: '#/components/schemas/Rule'
          payment:
            $ref: '#/components/schemas/Payment'
          distribution:
            allOf:
            - $ref: '#/components/schemas/Distribution'
            description: 'ACH distribution details for the payment hold. Only present when `paymentType` is `ACH`;

              this object will not be present for other payment types.

              '
    AdditionalInstitution:
      type: object
      title: AdditionalInstitution
      description: Additional Institution
      properties:
        id:
          type: string
        idType:
          $ref: '#/components/schemas/FinancialInstitutionIdType'
        name:
          type: string
        postalAddress:
          $ref: '#/components/schemas/Address'
      required:
      - id
      - idType
    BasicParty:
      title: BasicParty
      type: object
      description: A party is an entity involved in a financial transaction. This entity can be an individual, a corporation, or any other organization that participates in the transaction.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 140
          description: Party name
        postalAddress:
          $ref: '#/components/schemas/Address'
        dateAndPlaceOfBirth:
          type: object
          title: DateAndPlaceOfBirth
          description: Date and place of birth
          properties:
            birthDate:
              type: string
              format: date
              description: Date of birth
            city:
              type: string
              minLength: 1
              maxLength: 35
              description: City of birth
            country:
              $ref: '#/components/schemas/IsoCountryCode'
        countryOfResidence:
          $ref: '#/components/schemas/IsoCountryCode'
    Notification:
      title: Notification
      description: 'Payment hold notification event (CloudEvents v1.0).

        The `type` field indicates whether the payload represents a newly held

        payment, an update to an existing hold, or a hold closure.

        '
      allOf:
      - $ref: '#/components/schemas/NotificationBase'
      - title: Notification Attributes
        description: Properties specific to the payment hold notification event.
        type: object
        required:
        - type
        - data
        properties:
          type:
            type: string
            description: 'Type of event being published.


              | Event Type | Description |

              |------------|-------------|

              | com.jpmorgan.payments.payment.hold.placed.v1 | A payment has been held for review. The payload contains the complete hold including the payment details. |

              | com.jpmorgan.payments.payment.hold.ammended.v1 | A payment hold has been updated (decisioned, distributed, reassigned). The payload includes the updated status/substatus, decision and distribution, if applicable. |

              | com.jpmorgan.payments.payment.hold.closed.v1 | A payment hold has been closed. This event occurs when the hold is decisioned by the bank or when the decision is changed after payment distribution to notify JPMC about true fraud.  NOTE:  This event is only emitted when JPMC changes hold status/substatus and is NOT emitted when you decision a hold via API. |

              '
          data:
            anyOf:
            - $ref: '#/components/schemas/PaymentHeldData'
            - $ref: '#/components/schemas/PaymentHoldAmendedData'
            - $ref: '#/components/schemas/PaymentHoldClosedData'
    FinancialInstitutionIdType:
      type: string
      enum:
      - BIC
      - USABA
      - SORT_CODE
      - CLEARING_SYSTEM_ID
    PaymentHoldNotificationData:
      title: PaymentHoldNotificationData
      description: 'Common properties shared by all payment hold notification event payloads.

        This is the supertype for `PaymentHeldData` and `PaymentHoldAmendedData`.

        '
      type: object
      required:
      - id
      - status
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/Uuid'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DecisionStatus'
          readOnly: true
        substatus:
          $ref: '#/components/schemas/DecisionSubstatus'
    IntermediaryAgent:
      title: IntermediaryAgent
      type: object
      description: 'An agent between the debtor''s agent and the creditor''s agent. Usage: If more than one intermediary agent is present, then IntermediaryAgent1 identifies the agent between the DebtorAgent and the IntermediaryAgent2.'
      properties:
        name:
          type: string
          description: Name of the agent
          minLength: 1
          maxLength: 140
        financialInstitutionIds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/FinancialInstitutionId'
        postalAddress:
          $ref: '#/components/schemas/Address'
    Distribution:
      title: Distribution
      description: 'Describes distribution details for ACH payment hold.  JPM might distribute the payment after a hold is created,but

        before the hold is decisioned.  You should still decision the hold.  If you choose `REJECT`, that will kick off a

        back office process to recover the funds.


        This field is only present when `paymentType` is `ACH`

        '
      type: object
      properties:
        isDistributed:
          type: boolean
          description: Indicates whether the ACH payment has been distributed.
          default: false
        distributedAt:
          type: string
          description: The date and time at which the ACH payment was distributed. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC. Only present when `isDistributed` is `true`.
          format: date-time
    PaymentHoldClosedData:
      title: PaymentHoldClosedData
      description: 'Data payload for com.jpmorgan.payments.payment.hold.closed.`v1` events.

        Contains the hold details when the hold is decisioned by the bank or when the decision is changed after payment distribution to notify JPMC about true fraud.  NOTE:  This event is only emitted when JPMC changes hold status/substatus and is NOT emitted when you decision a hold via API.

        '
      allOf:
      - $ref: '#/components/schemas/PaymentHoldNotificationData'
      - title: Payment Hold Closed Data Attributes
        description: Properties specific to the com.jpmorgan.payments.payment.hold.closed.v1 event data payload.
        type: object
        properties:
          decision:
            $ref: '#/components/schemas/Decision'
          distribution:
            allOf:
            - $ref: '#/components/schemas/Distribution'
            description: 'ACH distribution details for the payment hold. Only present when `paymentType` is `ACH`;

              this object will not be present for other payment types.

              '
    PaymentIdentifiers:
      type: object
      title: PaymentIdentifiers
      description: Identifiers associated with the Payment Instruction throughout its lifecycle.
      required:
      - endToEndId
      properties:
        endToEndId:
          $ref: '#/components/schemas/EndToEndId'
        otherPaymentReferences:
          type: object
          title: OtherPaymentReferences
          description: Other Payment Reference Identifiers
          properties:
            relatedReferenceId:
              type: string
              description: Related reference Identifier, applicable for ACH and WIRES only.
            uetr:
              type: string
              description: A Unique End-to-end Transaction Reference (commonly known as a UETR) is a string of 36 unique characters featured in all payment instruction messages carried over SWIFT.
          minProperties: 1
    AccountId:
      title: AccountId
      type: string
      minLength: 1
      maxLength: 128
      description: Account number.
    Decision:
      type: object
      title: Decision
      description: 'Details of how the hold was resolved. Present only for holds that have already been decisioned.

        '
      properties:
        source:
          $ref: '#/components/schemas/Source'
        rejectReason:
          $ref: '#/components/schemas/DecisionRejectReason'
        fraud:
          allOf:
          - $ref: '#/components/schemas/Fraud'
          description: 'Fraud details for the decision. Only present when `rejectReason` is `FRAUD`.

            '
    DecisionRejectReason:
      type: string
      description: 'Reason for REJECT action. Only populated for action=REJECT and when status=REJECTED.


        If the reason is "Fraud", additional fraud details should be provided in the `fraud` field.


        | Enum Value | Description |

        |------------|-------------|

        | TRANSACTION_NO_LONGER_NEEDED | The transaction is no longer required by the client |

        | DUPLICATE_TRANSACTION | The transaction is a duplicate of another payment |

        | INCORRECT_BENEFICIARY | The beneficiary details are incorrect or invalid |

        | FRAUD | Fraud is suspected; requires `fraud` field |

        '
      enum:
      - TRANSACTION_NO_LONGER_NEEDED
      - DUPLICATE_TRANSACTION
      - INCORRECT_BENEFICIARY
      - FRAUD
