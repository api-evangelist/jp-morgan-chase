        facing application.
      type: boolean
    clientDefinedMappingRequired:
      description: Indicates if client-defined mapping is required for this subscription or entity configuration.
      type: boolean
    disputeClosed:
      description: Information on the dispute case that was closed on the network side.
      type: object
