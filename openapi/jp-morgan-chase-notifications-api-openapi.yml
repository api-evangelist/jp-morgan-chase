      type: object
      properties:
        documentGenerated:
          $ref: '#/components/schemas/documentGenerated'
        documentFailed:
          $ref: '#/components/schemas/documentFailed'
    documentGenerated:
      description: Generated document details
      type: object
      properties:
        requestId:
          description: A uniquely generated identifier for a request which the consuming resource uses
            to recognize subsequent retries of the same request. Used to identify the request that initiated
            generation of this document.
          type: string
        documentId:
          description: A Firm-defined unique data key that Identifies an occurrence of a document within
            the Firm's data stores. Documents can be a hard copy (physical printout), or a soft copy (electronic
            version of a document). Depending on the application system, these identifiers will be either
            system-generated or manually created, and can be used by the host application or other linked
            systems to pull the correct document and put it on the display screen for the user.
          type: string
        documentType:
          description: Codifies the different kinds of images/documentation items that are sent or received
            by the Firm to or from a party. For example, the party can be the customer, credit bureau,
            investor, internal revenue service, vendor, originator, attorney, etc. Characteristics of
            the document can change per document type. Characteristics include but are not limited to
            Government Issued Identifier, customer name, address, income, investor info, product type,
            liabilities, assets, etc.
          type: string
        parameters:
          $ref: '#/components/schemas/parameters'
    documentFailed:
      description: Document failure details
      type: object
      properties:
        requestId:
          description: A uniquely generated identifier for a request which the consuming resource uses
            to recognize subsequent retries of the same request. Used to identify the request that initiated
            generation of this document.
          type: string
        documentId:
          description: A Firm-defined unique data key that Identifies an occurrence of a document within
            the Firm's data stores. Documents can be a hard copy (physical printout), or a soft copy (electronic
            version of a document). Depending on the application system, these identifiers will be either
            system-generated or manually created, and can be used by the host application or other linked
            systems to pull the correct document and put it on the display screen for the user.
          type: string
        documentType:
          description: Codifies the different kinds of images/documentation items that are sent or received
            by the Firm to or from a party. For example, the party can be the customer, credit bureau,
            investor, internal revenue service, vendor, originator, attorney, etc. Characteristics of
            the document can change per document type. Characteristics include but are not limited to
            Government Issued Identifier, customer name, address, income, investor info, product type,
            liabilities, assets, etc.
          type: string
        parameters:
          $ref: '#/components/schemas/parameters'
        error:
          $ref: '#/components/schemas/error'
