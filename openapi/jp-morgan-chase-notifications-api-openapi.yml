      properties:
        name:
          type: string
          description: Name of the financial institution.
          minLength: 2
          maxLength: 100
        logoUrl:
          type: string
          description: URL of the financial institution's logo.
          format: uri
          pattern: ^https?:\/\/[^\s$.?#].[^\s]*$
      required:
      - name
      additionalProperties: false
    USABA:
      title: USABA
      type: object
      description: Account Identifier in US Banking account number format
      required:
      - accountIdType
      properties:
        accountIdType:
          type: string
          default: USABA
        routingNumber:
          type: string
          description: Represents routing number of financial institution, that account belongs to.
          minLength: 1
          maxLength: 128
        accountNumber:
          type: string
          description: Represents account number assigned by financial institution.
          minLength: 1
          maxLength: 128
        maskedAccountNumber:
          type: string
          description: Account number assigned by financial institution in masked format e.g.  XXXXXXXXXXXX1234
          maxLength: 20
          pattern: ^(X{1,}[0-9]{4})$
        tokenizedAccountNumber:
          type: string
          description: Tokenized representation of the US bank account number.
          minLength: 1
          maxLength: 128
      additionalProperties: false
    SORTCODE:
      type: object
      title: SORTCODE
      description: Account identifier specific to the SORT_CODE account numbering scheme.
      required:
      - accountIdType
      properties:
        accountIdType:
          type: string
          default: SORT_CODE
        accountNumber:
          type: string
          description: The account number of the account.
          minLength: 1
          maxLength: 128
        sortCode:
          type: string
          description: The sort code of the account.
          minLength: 1
          maxLength: 128
      additionalProperties: false
    IBAN:
      type: object
      title: IBAN
      description: International bank account number (**IBAN**) standard numbering system.
      required:
      - accountIdType
      properties:
        accountIdType:
          type: string
          default: IBAN
        bban:
          type: string
          description: BBAN represents a country-specific bank account number.
          minLength: 1
          maxLength: 128
        bic:
          type: string
          description: BIC bank number. This can be inferred from the IBAN, but some banks might require
            it for adding a beneficiary or will display it for existing accounts owned by the user.
          minLength: 1
          maxLength: 128
        iban:
          type: string
          description: IBAN represents an international bank account number.
          minLength: 1
          maxLength: 128
      additionalProperties: false
    AccountType:
      title: AccountType
      type: string
      description: 'Specifies the type of account.


        | Account Type   | Description            |

        |----------------|------------------------|

        | **CHECKING**   | A Checking account.    |

        | **SAVINGS**    | A Savings account.     |

        | **CREDIT_CARD**| A Credit Card account. |

        '
      enum:
      - CHECKING
      - SAVINGS
      - CREDIT_CARD
      - OTHER
    ISOCurrencyCode:
      title: ISOCurrencyCode
      description: '**Currency of the money movement**: a 3 alpha character ISO 4217 currency code.'
      type: string
      minLength: 3
      maxLength: 3
      pattern: ^[A-Z]{3}$
      example: EUR
    AccountStatus:
      type: string
      description: Account Status
      enum:
      - ACTIVE
      - INACTIVE
      - UNKNOWN
    AccountBasic:
      title: AccountBasic
      description: Basic representation of a financial account.
      type: object
      properties:
        financialInstitution:
          $ref: '#/components/schemas/FinancialInstitution'
        accountIdentifiers:
          description: Unique account identifiers assigned by the financial institution for identification
            and transaction processing.
          type: object
          oneOf:
          - $ref: '#/components/schemas/USABA'
          - $ref: '#/components/schemas/SORTCODE'
          - $ref: '#/components/schemas/IBAN'
          discriminator:
            propertyName: accountIdType
            mapping:
              USABA: '#/components/schemas/USABA'
              SORTCODE: '#/components/schemas/SORTCODE'
              IBAN: '#/components/schemas/IBAN'
        accountType:
          $ref: '#/components/schemas/AccountType'
        currencyCode:
          $ref: '#/components/schemas/ISOCurrencyCode'
        name:
          type: string
          maxLength: 250
          description: Name of the account assigned by the account holder or by the financial institution.
            This field is typically what the user recognises in their online banking app.
        segment:
          type: string
          description: Customer segment
          enum:
          - PERSONAL
          - BUSINESS
          - UNKNOWN
        status:
          $ref: '#/components/schemas/AccountStatus'
      additionalProperties: false
    PartyRole:
      type: string
      enum:
      - PRIMARY
      - PRIMARY_JOINT
      - PRIMARY_JOINT_TENANTS
      - PRIMARY_BORROWER
      - SECONDARY
      - SECONDARY_JOINT
      - SECONDARY_BORROWER
      - SECONDARY_JOINT_TENANTS
      - SOLE_OWNER
      - TRUSTEE
      - UNIFORM_TRANSFER_TO_MINOR
      - AUTHORIZED_USER
      - BUSINESS
      - POWER_OF_ATTORNEY
      - FOR_BENEFIT_OF_PRIMARY
      - FOR_BENEFIT_OF_PRIMARY_JOINT_RESTRICTED
      - FOR_BENEFIT_OF_SECONDARY
      - FOR_BENEFIT_OF_SECONDARY_JOINT_RESTRICTED
      - FOR_BENEFIT_OF_SOLE_OWNER_RESTRICTED
      - OTHER
      - UNKNOWN
      description: 'The role of the party to the account.

        '
    ISOCountryCode:
      title: ISOCountryCode
      type: string
      description: ISO 3166-1 Alpha-2 Country Code
      minLength: 2
      maxLength: 2
      pattern: ^[A-Z]{2}$
      example: AU
    AddressInfo:
      title: Address
      type: object
      description: Representation of an address object.
      properties:
        fullAddress:
          type: string
          description: Full Address.
          minLength: 3
          maxLength: 256
        addressType:
          type: string
          description: Type of the address.
          enum:
          - BUSINESS
          - CORRESPONDENCE
          - DELIVERY_TO
          - MAIL_TO
          - PO_BOX
          - RESIDENTIAL
          - POSTAL
          - UNKNOWN
        addressLines:
          type: array
          description: 1 to many address lines.
          items:
            type: string
            minLength: 1
            maxLength: 70
          minItems: 1
          maxItems: 7
        city:
          type: string
          description: City name.
          minLength: 1
          maxLength: 100
        state:
          type: string
          description: State or region name.
          minLength: 1
          maxLength: 100
        postalCode:
          type: string
          description: Postal or ZIP code.
          minLength: 1
          maxLength: 20
          pattern: ^[0-9A-Za-z\- ]+$
        countryCode:
          $ref: '#/components/schemas/ISOCountryCode'
    PartyIdentity:
      title: PartyIdentity
      type: object
      description: Representation of a party with its role, identity, and verification status.
      properties:
        name:
          type: string
          description: Party name.
          maxLength: 200
        addresses:
          type: array
          description: Addresses of the party.
          items:
            $ref: '#/components/schemas/AddressInfo'
          minItems: 0
          maxItems: 7
        emails:
          type: array
          description: Email addresses of the user.
          items:
            $ref: '#/components/schemas/EmailInfo'
          minItems: 0
          maxItems: 5
        phones:
          type: array
          description: Phone numbers of the user.
          items:
            $ref: '#/components/schemas/PhoneInfo'
          minItems: 0
          maxItems: 5
    Party:
      title: Party
      type: object
      description: Representation of a party with its role, identity, and verification status.
      properties:
        role:
          $ref: '#/components/schemas/PartyRole'
        identity:
          $ref: '#/components/schemas/PartyIdentity'
        dateOfBirth:
          type: string
          description: Date of birth of the party, ISO 8601 date format `YYYY-MM-DD`.
          format: date
        verificationStatus:
          type: string
          description: Verification status of the party.
          enum:
          - VERIFIED
          - PARTIALLY_VERIFIED
          - UNVERIFIED
          - UNKNOWN
      required:
      - role
      - identity
    Amount:
      title: Amount
      type: string
      minLength: 3
      maxLength: 18
      pattern: ^(\d{1,15})\.(\d{2})$
      example: '10.50'
      description: The value representation of a monetary amount. The amount value should be more than
        0.01 with maximum of two decimal places allowed.
    Value:
      title: Value
      description: Value
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Amount'
        currency:
          $ref: '#/components/schemas/ISOCurrencyCode'
      required:
      - amount
      - currency
    Balance:
      title: Balance
      description: Balance Information
      type: object
      properties:
        balanceType:
          type: string
          description: "Balance types\n\n  | Balance Type      | Description             |\n  |:-----------------\
            \ |:------------------------|\n  | BOOKED_BALANCE    | The current balance of the account\
            \ at the end of an account reporting period|\n  | AVAILABLE_BALANCE | The amount of funds\
            \ the customer is able to withdraw from the account|"
          enum:
          - BOOKED_BALANCE
          - AVAILABLE_BALANCE
        value:
          $ref: '#/components/schemas/Value'
        lastRefreshedAt:
          type: string
          format: date-time
          description: The timestamp of when the balance data was last refreshed.
      required:
      - balanceType
      - value
      additionalProperties: false
    AccountDetail:
      title: AccountDetail
      description: Consented accounts details
      type: object
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        account:
          $ref: '#/components/schemas/AccountBasic'
        parties:
          type: array
          description: List of parties associated with the account.
          items:
            $ref: '#/components/schemas/Party'
          minItems: 0
          maxItems: 5
        balances:
          type: array
          description: List of balances associated with the account.
          items:
            $ref: '#/components/schemas/Balance'
          minItems: 0
          maxItems: 2
      required:
      - accountId
      additionalProperties: false
    ConsentDetail:
      title: Consent
      description: Representation of a User's consent detail with account information.
      type: object
      allOf:
      - $ref: '#/components/schemas/ConsentBasic'
      - type: object
        properties:
          accounts:
            type: array
            description: List of accounts associated with the consent.
            items:
              $ref: '#/components/schemas/AccountDetail'
            minItems: 1
            maxItems: 10
    WebHook:
      title: AccountInformationServiceNotification
      description: Webhook Data
      type: object
      required:
      - notificationId
      - notificationType
      - notificationSubType
      - messageCreateTimestamp
      - clientId
      - accountInformationServiceNotification
      properties:
        notificationType:
          type: string
          description: Notification type
          enum:
          - accountInformationServiceNotification
          default: accountInformationServiceNotification
        notificationId:
          type: string
          description: Unique Notification Identifier
        notificationSubType:
          type: string
          description: Type of notification being published
          enum:
          - ConsentLinkInitiated
          - ConsentLinkOpened
          - ConsentLinkSuccessful
          - ConsentLinkCancelled
          - ConsentLinkExpired
          - ConsentLinkAbandoned
          - ConsentLinkPending
          - ConsentLinkFailed
          - ConsentSuccessful
          - ConsentFailed
          - ConsentRevoked
          - ConsentPending
          - ConsentReadyToValidate
          - ConsentFixSuccessful
          - ConsentFixFailed
        messageCreateTimestamp:
          description: Notification occurrence timestamp. An RFC-3339 compliant date-time format.
          type: string
          format: date-time
        clientId:
          type: string
          description: Client identifier
        platformId:
          type: string
          description: Platform identifier
        accountInformationServiceNotification:
          type: object
          description: Account Information Service Notification event data
          oneOf:
          - title: Consent Link Initiated Event
            type: object
            required:
            - consentLinkInitiated
            properties:
              consentLinkInitiated:
                $ref: '#/components/schemas/ConsentLinkInitiated'
          - title: Consent Link Opened Event
            type: object
            required:
            - consentLinkOpened
            properties:
              consentLinkOpened:
                $ref: '#/components/schemas/ConsentLink'
          - title: Consent Link Successful Event
            type: object
            required:
            - consentLinkSuccessful
            properties:
              consentLinkSuccessful:
                $ref: '#/components/schemas/ConsentLink'
          - title: Consent Link Cancelled Event
            type: object
            required:
            - consentLinkCancelled
            properties:
              consentLinkCancelled:
                $ref: '#/components/schemas/ConsentLinkWithView'
          - title: Consent Link Expired Event
            type: object
            required:
            - consentLinkExpired
            properties:
              consentLinkExpired:
                $ref: '#/components/schemas/ConsentLink'
          - title: Consent Link Abandoned Event
            type: object
            required:
            - consentLinkAbandoned
            properties:
              consentLinkAbandoned:
                $ref: '#/components/schemas/ConsentLinkWithView'
          - title: Consent Link Pending Event
            type: object
            required:
            - consentLinkPending
            properties:
              consentLinkPending:
                $ref: '#/components/schemas/ConsentLink'
          - title: Consent Link Failed Event
            type: object
            required:
            - consentLinkFailed
            properties:
              consentLinkFailed:
                $ref: '#/components/schemas/ConsentLinkFailed'
          - title: Consent Successful Event
            type: object
            required:
            - consentSuccessful
            properties:
              consentSuccessful:
                $ref: '#/components/schemas/ConsentDetail'
          - title: Consent Failed Event
            type: object
            required:
            - consentFailed
            properties:
              consentFailed:
                $ref: '#/components/schemas/ConsentBasic'
          - title: Consent Revoked Event
            type: object
            required:
            - consentRevoked
            properties:
              consentRevoked:
                $ref: '#/components/schemas/ConsentBasic'
          - title: Consent Fix Successful Event
            type: object
            required:
            - consentFixSuccessful
            properties:
              consentFixSuccessful:
                $ref: '#/components/schemas/ConsentDetail'
          - title: Consent Fix Failed Event
            type: object
            required:
            - consentFixFailed
            properties:
              consentFixFailed:
                $ref: '#/components/schemas/ConsentBasic'
          - title: Consent Pending Event
            type: object
            required:
            - consentPending
            properties:
              consentPending:
                $ref: '#/components/schemas/ConsentDetail'
          - title: Consent Ready To Validate Event
            type: object
            required:
            - consentReadyToValidate
            properties:
              consentReadyToValidate:
                $ref: '#/components/schemas/ConsentDetail'
    ConsentRenew:
      type: object
      title: ConsentRenew
      description: 'Consent renew or re-consent request for continuous access to existing consented information

        '
      properties:
        redirectUrl:
          type: string
          format: uri
          description: 'Callback URL to be redirected upon consent completion

            '
        locale:
          type: string
          description: 'Locale indicating the language and regional settings for the consent initiation

            '
          default: en_US
          maxLength: 5
    UpdateConsentLinkResponse:
      title: UpdateConsentLinkResponse
      description: Representation of the details necessary to start and track the consent journey.
      type: object
      allOf:
      - $ref: '#/components/schemas/ConsentLink'
      - type: object
        properties:
          updatedAt:
            type: string
            description: The timestamp indicating when the consent updated, formatted in ISO 8601 format.
            format: date-time
          consentLink:
            type: string
            description: A URL link used to initiate user interaction for granting and authorizing consent.
            format: uri
          consentLinkExpiringAt:
            type: string
            description: The timestamp indicating when the consent link will expire, formatted in ISO
              8601 format.
            format: date-time
        required:
        - consentLink
        - updatedAt
        - consentLinkExpiringAt
    AccountSummary:
      title: AccountSummary
      description: Sufficient account details to identify the account
      type: object
      properties:
        accounts:
          type: array
          items:
            properties:
              accountId:
                $ref: '#/components/schemas/AccountId'
              account:
                $ref: '#/components/schemas/AccountBasic'
              parties:
                type: array
                description: List of parties associated with the account.
                items:
                  $ref: '#/components/schemas/Party'
                minItems: 0
                maxItems: 5
            required:
            - accountId
            - account
            - parties
            additionalProperties: false
          minItems: 1
          maxItems: 3
    BalanceDetail:
      title: BalanceDetail
      description: Balance Information
      type: object
      properties:
        accounts:
          type: array
          items:
            properties:
              accountId:
                $ref: '#/components/schemas/AccountId'
              account:
                $ref: '#/components/schemas/AccountBasic'
              parties:
                type: array
                description: List of parties associated with the account.
                items:
                  $ref: '#/components/schemas/Party'
                minItems: 0
                maxItems: 5
              balances:
                type: array
                description: List of balances associated with the account.
                items:
                  $ref: '#/components/schemas/Balance'
                minItems: 0
                maxItems: 2
            required:
            - accountId
            - account
            - balances
          minItems: 1
          maxItems: 3
    TransactionCounterParty:
      title: TransactionCounterParty
      description: Creditor/Debtor counter party details in the context of transaction
      type: object
      properties:
        name:
          description: Name provided by creditor/Debtor's financial institution
          type: string
          minLength: 1
          maxLength: 128
        accountNumber:
          type: string
          description: Internal account identifier provided by creditor/debtor's financial institution
          minLength: 1
          maxLength: 128
    AccountTransaction:
      title: Transaction
      description: Transaction details of an verified account
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the transaction
        providerTransactionId:
          description: Provider's Transaction Identifier
          type: string
        transactionInitiatedAt:
          description: The time and date when the transaction event was first initiated. For example when
            a payment card was authorized at the point of sale (before it was booked) or when a money
            transfer was first initiated (before it was executed). Format - `YYYY-MM-DDThh:mm:ss`+/-time
            offset to UTC
          type: string
          format: date-time
        bookedAt:
          description: Transaction Date ( Booked). For BOOKED transaction this indicates the date and
            time when the transaction was posted on the financial institution’s books. For PENDING transactions
            indicates the expected booking date and time. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset
            to UTC
          type: string
          format: date-time
        valuedAt:
          description: The date and time when assets either become available or cease to be available
            to the account owner. Format - `YYYY-MM-DDThh:mm:ss`+/-time offset to UTC
          type: string
          format: date-time
        transactionType:
          type: string
          description: "Transaction Type. Possible values as below\n| Type              | Description\
            \                |\n|:------------------|:---------------------------|\n|CREDIT_CARD     \
            \   | Credit card                | \n|TRANSFER           | Transfer                   |\n\
            |WITHDRAWAL         | Withdrawal                 |\n|PAYMENT            | Payment        \
            \            |\n|DEFAULT            | Default                    |\n|UNDEFINED          |\
            \ Undefined Type             |"
        value:
          description: Transaction Amount
          allOf:
          - $ref: '#/components/schemas/Value'
        originalDescription:
          description: Transaction Description - Original
          type: string
        displayDescription:
          description: Transaction Description - Display
          type: string
        merchantCategory:
          description: Merchant Category Code (MCC) as indicated by financial institution
          type: string
        merchantName:
          description: Name of merchant, as indicated by financial institution
          type: string
        status:
          description: Transaction booking Status
          type: string
          enum:
          - PENDING
          - BOOKED
          - UNDEFINED
        debtor:
          description: Debtor details in the context of transaction
          $ref: '#/components/schemas/TransactionCounterParty'
        creditor:
          description: Creditor details in the context of transaction
          $ref: '#/components/schemas/TransactionCounterParty'
        referenceId:
          type: string
          description: Transaction reference as provided by the financial institution.
    AccountTransactionDetail:
      title: TransactionDetail
      description: Transactions List
      type: object
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        account:
          $ref: '#/components/schemas/AccountBasic'
        balances:
          type: array
          description: List of balances associated with the account.
          items:
            $ref: '#/components/schemas/Balance'
          minItems: 0
          maxItems: 2
        transactions:
          type: array
          description: List of transaction associated with the account.
          items:
            $ref: '#/components/schemas/AccountTransaction'
          minItems: 0
          maxItems: 100
      required:
      - accountId
      - account
      - balances
      - transactions
    ConsentIncludes:
      title: Includes
      type: string
      description: "Option to retrieve either the complete set or specific portions of the consented information.\n\
        \n |View                   |Description                                                      \
        \                       |\n |:----------------------|:-------------------------------------------\
        \ -------------------------------------------|\n |FULL                   |Retrieve full details\
        \ of authorized accounts                                            |\n |ACCOUNT             \
        \   |Retrieve basic details of authorized accounts                                           |\n\
        \ |PARTIES                |Retrieve all account parties and their corresponding roles        \
        \                      |\n |BALANCES               |Retrieve the balances of active accounts|\n"
      enum:
      - FULL
      - ACCOUNT
      - PARTIES
      - BALANCES
    AccountView:
      type: array
      items:
        $ref: '#/components/schemas/ConsentIncludes'
      minItems: 0
      maxItems: 3
    AccountInformation:
      title: AccountInformation
      description: Account Information account , balances, etc....
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountDetail'
          minItems: 1
          maxItems: 3
        error:
          $ref: '#/components/schemas/ErrorInfo'
      additionalProperties: false
    keyManagementNotification:
