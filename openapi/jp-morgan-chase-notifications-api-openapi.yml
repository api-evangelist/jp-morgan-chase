    aggregateOverdrawn:
      description: This is used for specifying an attribute used on a model for object that will contain
        one or more attributes
      type: object
      properties:
        amount:
          description: Specifies the monetary value of the account's balance that exceeds the credit limit
            amount.
          type: string
        maxAmount:
          description: Specifies the maximum monetary value which an account can go into overdraft before
            debit transactions against account will be declined.
          type: string
        percent:
          description: The overdraft percent relative to the maximum overdrawn amount is the ratio of
            the current overdraft to the highest permissible overdraft limit, expressed as a percentage.
          type: string
        alertPercent:
          description: This field is the predefined percentage threshold at which a merchant/client receives
            an alert indicating that their account's overdraft level is approaching or has exceeded a
            specified limit.
          type: string
        alertResetPercent:
          description: This field is the percentage threshold at which restrictions on a merchant's account
            are lifted, indicating that the overdraft level has been sufficiently reduced below the allowed
            restrictive limit.
          type: string
        restrictPercent:
          description: This field is the percentage limit at which restrictions are applied to a merchant's
            account due to excessive overdraft, preventing further transactions until the overdraft is
            reduced below this threshold.
          type: string
        restrictResetPercent:
          description: This field is the percentage threshold at which restrictions on a merchant's account
            are lifted, indicating that the overdraft level has been sufficiently reduced below the allowed
            restrictive limit.
          type: string
