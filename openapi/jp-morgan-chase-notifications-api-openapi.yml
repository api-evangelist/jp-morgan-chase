            name, address, and Tax Government Issued Identifier to define a unique individual or non-individual.
            The identifier is used for operational purposes. This critical data element is commonly referred
            to as the ECI (Enterprise Customer ID) or ECID and was formerly called the Enterprise Customer
            Identifier.
          type: string
          example: '12345678910'
          deprecated: true
        organizationLegalName:
          description: The official name under which a business is registered and recognized by the government
          type: string
          example: Chase Paymentech
          deprecated: true
        enterprisePlatformIdentifier:
          description: A unique identifier representing the profile (configuration) for an external client
            or internal service of the Firm that facilitates how it interacts with the Firm's services
            such as onboarding, transaction processing, embedded banking, etc.
