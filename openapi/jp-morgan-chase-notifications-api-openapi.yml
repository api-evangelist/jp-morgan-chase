        disputeReasonCode:
          $ref: '#/components/schemas/disputeReasonCode'
        disputeType:
          $ref: '#/components/schemas/disputeType'
        disputeReasonDescription:
          $ref: '#/components/schemas/disputeReasonDescription'
    disputeMerchantResponseRequested:
      description: Information on the dispute case that requires response from the merchant.
      type: object
      properties:
        transactionDate:
          $ref: '#/components/schemas/transactionDate'
        disputeType:
          $ref: '#/components/schemas/disputeType'
        disputeReasonDescription:
          $ref: '#/components/schemas/disputeReasonDescription'
        messageToMerchant:
          $ref: '#/components/schemas/messageToMerchant'
        responseDueDate:
          $ref: '#/components/schemas/responseDueDate'
        disputeReasonCode:
          $ref: '#/components/schemas/disputeReasonCode'
    disputeInitiatedDate:
      description: Designates the date, hour, minute and second the dispute case record was substantiated
        or established.
      type: string
    firmDisputeCaseID:
      description: Identifies a unique post deposit event that occured after the merchant has been funded
        for the original transaction.
      type: string
    commerceCenterRegistrationUrlText:
      description: A reference to a web resource on the internet specifying its location on a computer
        network and a mechanism for retrieving.
      type: string
    individualFirstName:
      description: That part of an individual's full name considered a personal name or given name and
        generally positioned before the last name or family name.
      type: string
    individualLastName:
      description: That part of an individual's name generally placed at the end of the given name. The
        last name is also known as the surname or family name.
      type: string
    methodOfPayment:
      description: 'Codifies the method used to pay for the exchange of money, goods or services between
        a merchant and their customer. Examples: Visa, MasterCard, PayPal, Bill Me Later etc. Also known
        with the Firm as method of payment or MOP.'
      type: string
    acquirerReferenceNumber:
      description: Identifies a unique number assigned by the payment brand to a credit card transaction
        for use when it goes from the Firm acting as the acquiring bank through the payment processing
        network during settlement to the cardholders bank (the issuer). This number can be used by issuing
        banks to trace a transaction with an acquirer. This reference number is an industry standard and
        has a specific format defined by the payment brand.
      type: string
    disputeStatus:
      description: Label given to the current standing of the Dispute. Sample values would be New, Needs
        Response, Challenged - JPMC, Accept, Expired, Challenged - Merchant, Challenged Denied, Need Additional
        Information, Under Issuer Review, Closed
      type: string
    disputeType:
      description: The label given to a current step or stage of the case in the dispute case resolution
        life cycle.
      type: string
    disputeReasonDescription:
      description: Textual description of the chargeback reason for the disputed case.
      type: string
    messageToMerchant:
      description: Provides textual information entered by the Firm, pertinent to a chargeback dispute.
      type: string
    responseDueDate:
      description: Designates the date, hour, minute, and second when a task must be completed.
      type: string
    disputeReasonCode:
      description: Codifies the chargeback reason for the disputed case.
      type: string
    disputeRuling:
      description: The label given to the verdict or decision or a dispute. Indicates if the case has
        been won or lost by the merchant.
      type: string
    caseCompleteDate:
      description: Designates the hour, minute and second of the day the case is stipulated to be resolved
        by the firm.
      type: string
    reportingPeriodStartTiemstamp:
      description: (*** DEPRECATED ***) Designates the hour, minute, seconds and date (if timestamp) or
        year, month, and date (if date) for which data will be selected. This date establishes the beginning
        point date range parameter for selecting data.
      type: string
    transactionState:
      description: Current state transaction is in. "Authorized" - transaction not yet captured. "Captured"
        - can no longer be augmented. "Closed" - payout process initiated.
      type: string
      enum:
      - AUTHORIZED
      - VOIDED
      - PENDING
      - DECLINED
      - COMPLETED
      - CLOSED
      - ERROR
    refundUpdateNotificationType:
      description: Codifies the refund notification subscription type to merchant for recommendations
        from firm.
      type: string
      enum:
      - RefundApproved
      - RefundDeclined
      - RefundErrored
      - RefundClosed
      - All
