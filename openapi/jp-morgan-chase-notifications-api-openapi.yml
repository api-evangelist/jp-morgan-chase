          description: Codifies the state in which a job is in while processing a bulk transaction file.
            Possible states include RECEIVED, PROCESSING, PROCESSED, COMPLETED, RESPONDED, and ERROR.
          type: string
        fileProcessedTimestamp:
          description: Designates the hour, minute, and second in a specific day when the file was processed
            by the processing system.
          type: string
    tokenProvisionUpdate:
      description: Information on asynchronously provisioned token for future processing.
      type: object
      properties:
        merchantRequestIdentifier:
          description: Merchant identifier for the request. The value must be unique.
          type: string
        tokenRequestorIdentifier:
          description: 'Identifies a unique occurrence of the pairing of the token requestor with the
            token domain. The Transaction Processing Network/Token service provider (VISA/Mastercard)
            utilizes the Token Requestor Identifier to: 1. Map the PAN (Primary Account Number) to payment
            token, and 2. Identify any other attributes of the token requestor, determined at the time
            of registration (AKA token domains). The token requestor is typically an acquirer, merchant
            or digital wallet provider that will use the payment token to replace the PAN in its transaction
            processing. Token Requestor Identifier is sent to the Firm by the Transaction Processing Network.'
          type: string
        tokenReferenceIdentifier:
          description: 'Identifies uniquely a token provisioning request assigned by token service/vault
            and provided to Issuer and Wallet Provider. This can be used as a reference to the token number
            that is assigned for an account when provisioning completes. Example: DNITHE461927644624368716'
          type: string
        validationIdentifier:
          description: Unique identifier for account holder validation.
          type: string
        tokenNumber:
          description: The token number is a SECURE surrogate value for the account number utilized in
            mobile payment. Token is created at enrollment into the Mobile Programs, such as Chase Pay,
            Apple Pay... For any transaction that is using the Mobile Program the Token Number will be
            attached as part of the transaction. The Token Number is a surrogate based on the Credit Card
            number, DDA Checking or other payments accounts may also be utilized as they can behave as
            a Credit Card for payment purposes. The token number is consistent with ISO 8583 message requirements,
            and is a 13 to 19-digit numeric value that must pass basic validation rules of an account
            number, including the LUHN check(Mod 10). The LUHN check is a test used by some card companies
            to distinguish valid card numbers from what could be a random selection of digits.  Token
            domains are different classifications that a token can fall under, usually describing different
            domains of digital payment transactions. There can be many Token Numbers to a single Card
            Number, DDA Checking Number, or Other payment accounts based on the Mobile Program the Token
            Number was created. Tokens must not have the same value as, or conflict with a Card number,
            DDA Check Number or Other payment Accounts.
          type: string
        tokenExpiry:
          $ref: '#/components/schemas/tokenExpiry'
