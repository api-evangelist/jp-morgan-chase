            facilitating accurate tracking and reconciliation.
          type: string
        amount:
          description: Specifies the monetary value of the transaction performed.
          type: string
        currency:
          description: Codifies the monetary unit that was associated with the financial transaction (such
            as sale, returns, chargebacks etc.).
          type: string
        state:
          description: Represents the current state of the Payment Service Provider Settlement reference.
          type: string
        accountId:
          description: Account identifier for against which the money would be settled.
          type: string
    icPlusStatementCompleted:
