          $ref: '#/components/schemas/postalCode'
        countryCode:
          $ref: '#/components/schemas/countryCode'
        addressStatus:
          $ref: '#/components/schemas/addressStatus'
    merchantSoftware:
      description: Contains information related to the merchant software
      type: object
      properties:
        companyName:
          description: Company name of software integrated to this API. If merchant is directly integrated, send "JPMC."
          type: string
          example: Payment Company
        productName:
          description: The name of the product used for marketing purposes from a customer perspective. I. e. what the customer would recognize.
          type: string
          example: Application Name
        version:
          description: Designates the unique state of computer software as it is developed and released. The version identifier can be a word, or a number, or both.
          type: string
          example: '1.235'
    paymentType:
      description: Identifies how accountholders  initiated debits to their accounts .
      type: string
      enum:
      - WEB
      - TEL
      - RECURRING
    line2:
      description: 'A portion of a party''s address which is the line of the unstructured (unparsed) geographic street address containing any of the following: house number, street name, street direction, street type, dwelling type and number, PO Box number, rural delivery route number.'
      type: string
      pattern: ^[^<>{}]*$
      maxLength: 100
      example: Apt 123
    updateUserIdentifier:
      description: The identifier (id) of the user who last updated the object or the row. This could be the Firm’s Standard Identifier, or the identifier of a batch/functional process.
      type: string
      readOnly: true
    message:
      description: Provides textual description of a problem that has occurred and which is preventing the system from completing a task. Messages can be a  confirmation, warning or notification, and can trigger the system to apply a customized default value or override to a field, record or file, halt or postpone processing, or skip or reject the entry generating the problem. Messages can be displayed on-screen in the user interface or in reporting.
      type: string
    financialInstitutionRoutingNumber:
      description: Identifies the routing and transit number assigned by an administrative body to formally identify a chartered financial institution (bank) within a given country or common financial market for performing domestic transfers of funds to or from that institution's client accounts. Within the United States, this is known as the American Bankers Association Routing Number, and within Australia, this is known as a Bank State Branch Number. This common data element will house those two examples, along with the equivalent for any other country or financial market.
      type: string
    responseMessage:
      description: Long explanation of the response message.
      type: string
      readOnly: true
      example: Request Accepted
    threeDSAuthenticatedData:
      description: Three DS Authenticated Data
      type: object
      properties:
        threeDSTransactionId:
          description: Identifies a unique occurrence of a transaction. In this context, this is Universally unique transaction identifier to identify a single transaction. If the value does not exist or it is not a valid UUID, the 3DS Server will generate a new transaction ID. This value has 36 characters in a format defined in IETF RFC 4122.
          type: string
          writeOnly: true
        transactionId:
          description: Identifies a unique occurrence of a transaction.
          type: string
          readOnly: true
        threeDSAuthenticationId:
          description: Unique identifier for the  Authentication attempt.
          type: string
        threeDSTransactionDate:
          description: Designates the hour, minute, seconds and date (if timestamp) or year, month, and date (if date) when the transaction (monetary or non-monetary) occurred.
          type: string
          format: date-time
    first6CardNumber:
      description: Identifies the first six digits of the primary account number of a credit, debit or pre-paid card. As of 2017, this does not necessarily align to the Issuer Identification Number (IIN).  IIN is also referred to as Bank Identification Number (BIN).
      type: string
      readOnly: true
    createUserIdentifier:
      description: The identifier (id) of the user who created the object or inserted the row. This could be the Firm’s Standard Identifier, or the identifier of a batch/functional process.
      type: string
      readOnly: true
    authenticationRequest:
      description: Authentication Request
      type: object
      writeOnly: true
      properties:
        authenticationReturnUrl:
          description: Once authentication is complete this is the URL the customer will be sent to.
          type: string
        threeDSPurchaseInfo:
          $ref: '#/components/schemas/threeDSPurchaseInfo'
        threeDSRequestorAuthenticationInfo:
          $ref: '#/components/schemas/threeDSRequestorAuthenticationInfo'
    communicationUpdate:
      description: Communication Update information
      type: object
      properties:
        email:
          $ref: '#/components/schemas/email'
        phone:
          $ref: '#/components/schemas/phone'
    updateTimestamp:
      description: Designates the hour, minute, and second in a specifc day when the record was last modified.
      type: string
      readOnly: true
    lastName:
      description: 'That part of an individual’s name generally placed at the end of the given name. The last name is also known as the surname or family name. (Note: name conventions may be different based on practices in different countries. Some countries use two or more last names; in other countries, the family name is placed before a person’s given name; in some countries, it is common for people to have only one name or a mononym.)'
      type: string
      pattern: '[\p{L}\p{P}0-9'' ]*$'
      maxLength: 70
      example: Babbitt
    paymentMethodType:
      description: Payment Method Object
      type: object
      properties:
        cardList:
          type: array
          minItems: 0
          description: List of card payment methods
          items:
            $ref: '#/components/schemas/card'
        sepaList:
