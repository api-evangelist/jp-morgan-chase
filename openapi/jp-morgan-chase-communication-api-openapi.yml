      type: string
      pattern: ^[^<>{}]*$
      maxLength: 100
      example: 400 Elton Farm
    accountNumberType:
      description: Specifies the type of payment method used by the account number in payment transaction.
      type: string
      default: PAN
      enum:
      - PAN
      - NETWORK_TOKEN
      - DEVICE_TOKEN
      writeOnly: true
    orderOverrideCode:
      description: Codifies the option merchant has chosen to perform a non-systemic override on a payment order.
      type: string
      enum:
      - NO_MAPPING
      - CONSUMER_REFNUM_ORDERID
      - CONSUMER_REFNUM_COMMENTS
      - CONSUMER_REFNUM_ORDERID_COMMENTS
    mandate:
      description: This is used for specifying an attribute used on a model for object that will contain one or more attributes
      type: object
      required:
      - mandateId
      - mandateType
      - mandateSignatureDate
      properties:
        mandateId:
          description: Identifies an agreement between the consumer, debtor bank (direct debit account of the consumer) and the merchant. This agreement (mandate) gives the merchant permission to withdraw funds from the consumer's account for some specific financial purpose. Typically mandates are used for recurring or installment payments; that is, a fixed amount to be withdrawn over a specific period of time (defined by the “Mandate Date”). One-time withdrawals are allowed. Mandates are specific to European programs such as Single Euro Payments Area (SEPA) Direct Debit (DD) scheme and Bankers' Automated Clearing System (BACS).
          type: string
        mandateType:
          description: Codifies the category of an agreement between the consumer, debtor bank (direct debit account of the consumer) and the merchant. This agreement (mandate) gives the merchant permission to withdraw funds from the consumer's bank account for some specific financial purpose. Typically mandates are used for recurring or installment payments; that is, a fixed amount to be withdrawn over a specific period of time (defined by the “Mandate Date”). One-time withdrawals are allowed. Mandates are specific to European programs such as Single Euro Payments Area (SEPA) Direct Debit (DD) scheme and Bankers' Automated Clearing System (BACS).
          type: string
        mandateSignatureDate:
          description: Designates the year, month and day when the consumer signs an agreement (mandate) that gives the merchant permission to withdraw funds from the consumer's bank account for some specific financial purpose. Typically mandates are used for recurring or installment payments; that is, a fixed amount to be withdrawn over a specific period of time (defined by the “Mandate Date”). One-time withdrawals are allowed. Mandates are specific to European programs such as Single Euro Payments Area (SEPA) Direct Debit (DD) scheme and Bankers' Automated Clearing System (BACS). mandateSignatureDate should be valid date with format YYYY-MM-DD.
          type: string
        mandateReferenceId:
          description: Identifies an unique reference number generated by the consumer profile system for the agreement between the consumer, debtor bank (direct debit account of the consumer) and the merchant. This agreement (mandate) gives the merchant permission to withdraw funds from the consumer's account for some specific financial purpose.
          type: string
          readOnly: true
    isTransactionMicroEntry:
      description: Indicates the current transaction is an Automated Clearing House (ACH) credit or debit Entry used by an Originator for the purpose of verifying a Receiver’s account or an individual's access to an account.
      type: boolean
    last4AccountNumber:
      description: Identifies the final 4 digits of the Payment Method Account Number. The truncated value is used in place of the full number to protect against exposure of confidential information.
