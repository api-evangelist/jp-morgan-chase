          items:
            type: string
    threeDSRequestorAuthenticationInfo:
      description: Three DS Requestor Authentication Info
      type: object
      properties:
        authenticationPurpose:
          description: Codifies the purpose of the cardholder authentication request.
          type: string
          enum:
          - PAYMENT_TRANSACTION
          - RECURRING_TRANSACTION
          - INSTALLMENT_TRANSACTION
          - ADD_CARD
          - MAINTAIN_CARD
          - CARDHOLDER_VERIFICATION
          - BILLING_AGREEMENT
        threeDSChallengeType:
          description: Indicates whether a challenge is requested for this transaction.
          type: string
          enum:
          - NO_PREFERENCE
          - NO_CHALLENGE
          - CHALLENGE_REQUESTED
          - CHALLENGE_MANDATE
          - NO_CHALLENGE_TRA
          - NO_CHALLENGE_DATA
          - NO_CHALLENGE_DA
          - NO_CHALLENGE_TRUSTED
    authenticationResult:
      description: Cardholder Authentication Result from the Payment request.
      type: object
      readOnly: true
      properties:
        authenticationId:
          $ref: '#/components/schemas/authenticationId'
        authenticationOrchestrationUrl:
          description: This is the URL a merchant will need to launch to support 3ds authentication.
          type: string
        authenticationReturnUrl:
          description: Once authentication is complete this is the URL the customer will be sent to.
          type: string
    threeDSPurchaseInfo:
      description: Three DS Purchase Info
      type: object
      properties:
        purchaseDate:
          description: Designates the year, month and day of the most recent purchase which occurred on the Cardholder account.
          type: string
          format: date-time
        threeDomainSecureTransactionType:
          description: Identifies the type of transaction being authenticated. The values are derived from ISO 8583
          type: string
          enum:
          - CHECK
          - GOODS_SERVICES
          - ACCOUNT_FUNDING
          - QUASI_CASH
          - PREPAID
    state:
      description: 'Classifies a geographic area that represents a first level, legal and political subdivision of a country; it should be in the ISO 3166-2 format. For Example: the parish "Andorra la Vella" in Andorra will be represented as 07.   similarly the province "Bengo" in Angola will be represented as "BGO". state Texas in USA is represnted as "TX" etc.,'
      type: string
      pattern: ^[A-Za-z0-9]+([\s-]+[A-Za-z0-9]+)*$
      minLength: 1
      maxLength: 3
      example: PA
    primaryAddressIndicator:
      description: Indicates the 'TRUE'/'FALSE' value that represents whether or not an address is the primary address for a given owner
      type: boolean
      example: true
    city:
      description: A portion of a party's address which is the geographic area that is a municipality with legal power granted by a state/province charter.
      type: string
      pattern: '[\p{L}\d\s\-''.,&() ]*$'
      maxLength: 40
      example: Glen Mills
    cardType:
      description: Codifies the method used to pay for the exchange of money, goods or services between a merchant and their customer such as VI,MC, AX.
      type: string
      pattern: '[A-Za-z]*'
      minLength: 1
      maxLength: 50
      example: VI
      enum:
      - VI
      - MC
      - AX
      - HC
      - EO
      - DI
      - JC
      - DC
      - CC
      - CZ
      - CR
      - OX
      - IM
      - SP
      - PP
      - AP
      - NP
      - VR
      - MR
      - EP
      - CB
      - DP
      - PM
    merchant:
      description: Information about the merchant
      type: object
      properties:
        merchantSoftware:
          $ref: '#/components/schemas/merchantSoftware'
    authenticationId:
      description: A unique identifier for the card owner authentication provided by a global authentication solution such as Three Domain Secure (3DS) designed to make eCommerce transactions more secure and reduce fraud.
      type: string
    consumerPreferredPaymentNetwork:
      description: The consumer’s chosen card network to route eligible transactions when multiple networks are available. Valid Values are VI,MC, CB
      type: string
      enum:
      - VI
      - MC
      - CB
    addressIdentifier:
      description: Identifies a classification of a geographic area that is captured for a consumer purchasing goods or services.
      type: string
    createTimestamp:
      description: Designates the hour, minute and second in a specific day when the record was created.
      type: string
      readOnly: true
    last4CardNumber:
      description: Identifies the final 4 digits of the 16 digit card number. The truncated value is used in place of the full number to protect against exposure of confidential information.
      type: string
      readOnly: true
    responseCode:
      description: Short explanation of the response code.
      type: string
      readOnly: true
      minLength: 2
      maxLength: 50
      example: ACCEPTED
    cardExpirationMonthYearNumber:
      description: A number in the form of Month/Year that is displayed on a card (Debit/Credit).  This number is used for the date which is no longer in effect for transactions being processed at the Point of Sale.
      type: string
      pattern: (0[1-9]|1[0-2])[/][0-9][0-9][0-9][0-9]
      example: 02/2024
    accountStatus:
      description: Codifies the current status of the card.
      type: string
      example: ACTIVE
      enum:
      - ACTIVE
      - INACTIVE
      - PENDING
      - ERRORED
      - SUSPENDED
      - VERIFICATION_FAILED
    accountType:
      description: Codifies a bank account where funds are deposited or stored (e.g., checking and savings account). When shared with a financial institution as the client's primary automated payment mechanism for a debt, it may also be known as a DDA (Demand Deposit Account). A DDA can have funds withdrawn at any time from the depository institution, accessible by a teller, ATM or via online banking.
      type: string
      enum:
      - CHECKING
      - SAVING
      - CORPORATE_CHECKING
    consumerAssignedAddressName:
      description: A short label defined by the consumer that will allow them to refer to the address by name.  E.g Home , Office , JohnDoe_Home
      type: string
      pattern: ^[^<>]*$
      maxLength: 75
    paymentMethodId:
      description: Identifies a unique occurrence of the type of payment accepted by a level of the hierarchy of the merchant acquiring account.
      type: string
      readOnly: true
    code:
      description: Codifies a raised exception encountered by an internal or external system, sub-system, interface, job, module, or system component with which the web service application interfaces. In this instance it refers to the error raised when the reporting job failed.
      type: string
    consumerProfileUniqueId:
      description: Identifies a unique occurrence of a consumer's information maintained by the Firm acorss merchant.
      type: string
    defaultMOP:
      description: Default payment method
      type: object
      properties:
        card:
          $ref: '#/components/schemas/card'
        sepa:
          $ref: '#/components/schemas/sepa'
        ach:
          $ref: '#/components/schemas/ach'
        bacs:
          $ref: '#/components/schemas/bacs'
    responseStatus:
      description: Request result status.
      type: string
      readOnly: true
      example: SUCCESS
      enum:
      - SUCCESS
      - ERROR
    consumerProfileAddress:
      description: Address Information used for consumer profile
      type: object
      writeOnly: true
      properties:
        firstName:
          $ref: '#/components/schemas/firstName'
        lastName:
          $ref: '#/components/schemas/lastName'
